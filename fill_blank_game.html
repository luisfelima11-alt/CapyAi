<style>
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

  /* Blank underline */
  .blank-slot {
    display: inline-block; min-width: 125px; border-bottom: 4px solid #fb923c;
    font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900;
    font-size: 1.45rem; color: #fdba74; text-align: center; padding: 0 10px;
    margin: 0 6px; vertical-align: baseline; transition: all 0.2s;
    background: rgba(251, 146, 60, 0.12); border-radius: 10px 10px 0 0;
  }
  .blank-slot.filled  { color: #fff; border-bottom-color: #10b981; }
  .blank-slot.correct { color: #34d399; border-bottom-color: #10b981; background: rgba(16, 185, 129, 0.18); }
  .blank-slot.wrong   { color: #fb7185; border-bottom-color: #ef4444; background: rgba(239, 68, 68, 0.18); }

  /* Option chips */
  .option-chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 24px; border-radius: 18px; cursor: pointer;
    font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 1.02rem;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    border: 2px solid rgba(255,255,255,0.18);
    box-shadow: 0 5px 0 rgba(0,0,0,0.28);
    color: #fff; transition: all 0.15s; user-select: none;
  }
  .option-chip:hover:not(.used) {
    background: rgba(251, 146, 60, 0.22);
    border-color: rgba(251, 146, 60, 0.65);
    transform: translateY(-2px);
    box-shadow: 0 7px 0 rgba(0,0,0,0.32);
  }
  .option-chip:active:not(.used) { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .option-chip.used { pointer-events: none; }
  .option-chip.correct-chip {
    background: rgba(16, 185, 129, 0.3) !important;
    border-color: #10b981 !important;
    box-shadow: 0 4px 0 rgba(5, 150, 105, 0.5) !important;
  }
  .option-chip.wrong-chip {
    background: rgba(239, 68, 68, 0.26) !important;
    border-color: #ef4444 !important;
  }
  .option-chip.eliminated-chip {
    opacity: 0.2 !important;
    pointer-events: none !important;
    text-decoration: line-through;
  }
  .option-chip:focus-visible, button:focus-visible {
    outline: 3px solid #fb923c; outline-offset: 3px;
  }

  .track-pill { transition: all 0.15s ease; white-space: nowrap; }
  .track-pill.active {
    background: linear-gradient(135deg, #f97316, #ec4899);
    color: #fff;
    border-color: rgba(255,255,255,0.45);
    box-shadow: 0 4px 14px rgba(249, 115, 22, 0.38);
  }

  /* Animations */
  @keyframes fadeUp  { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shake   { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  @keyframes spark   { 0%{opacity:1;transform:translate(0,0)scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0)} }

  .fade-up  { animation: fadeUp 0.34s ease both; }
  .do-shake { animation: shake 0.42s ease; }
  .spark    { position:fixed; width:9px; height:9px; border-radius:50%; animation:spark 0.85s ease forwards; pointer-events:none; z-index:9999; }

  #prog-fill { transition: width 0.45s ease; }
  #sentence-area { line-height: 2.2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
const TRACK_LABELS = {
  all: '🎲 Mix Geral',
  starter: '🌱 Dia a Dia (A1-A2)',
  intermediate: '🚀 Tempos & Preposições (B1-B2)',
  travel: '✈️ Viagem & Hotel',
  work: '💼 Trabalho & Entrevista',
  agro: '🌾 Agro English',
  gpstronic: '🛰️ GPS Tronic',
  med: '🩺 Medical English',
  advanced: '🔥 Desafio Fluência',
};

// ── 130 Questões Reais Contextualizadas por Trilha ──────────────────────────
const QUESTIONS = [
  // ── 1. STARTER / DIA A DIA (18 questões) ──
  { track: 'starter', emoji: '☕', sentence: 'I usually ___ a cup of coffee before work.', answer: 'drink', distractors: ['drinks', 'drinking', 'drank'], pt: 'Eu costumo tomar uma xícara de café antes do trabalho.', tip: 'Para rotina no presente com "I", usamos o verbo na forma simples: "I usually drink".' },
  { track: 'starter', emoji: '🕖', sentence: 'What time ___ your brother wake up on Mondays?', answer: 'does', distractors: ['do', 'is', 'are'], pt: 'A que horas o seu irmão acorda às segundas-feiras?', tip: 'Para perguntas no presente com "he / she / your brother", o auxiliar é "does".' },
  { track: 'starter', emoji: '🛒', sentence: 'We need to buy some fresh ___ at the bakery.', answer: 'bread', distractors: ['shoes', 'tickets', 'keys'], pt: 'Precisamos comprar pão fresco na padaria.', tip: '"Bakery" é padaria, onde compramos "fresh bread" (pão fresco).' },
  { track: 'starter', emoji: '🌧️', sentence: 'Take an umbrella because it is ___ outside.', answer: 'raining', distractors: ['rain', 'rains', 'sunny'], pt: 'Leve um guarda-chuva porque está chovendo lá fora.', tip: 'Com "it is" para descrever o que acontece agora, usamos final -ing: "it is raining".' },
  { track: 'starter', emoji: '🚌', sentence: 'She always goes to the office ___ bus.', answer: 'by', distractors: ['in', 'on', 'with'], pt: 'Ela sempre vai para o escritório de ônibus.', tip: 'Para meios de transporte em geral, usamos "by" (by bus, by car, by train).' },
  { track: 'starter', emoji: '📱', sentence: 'Can you ___ me a text message when you arrive?', answer: 'send', distractors: ['sending', 'sends', 'sent'], pt: 'Você pode me mandar uma mensagem de texto quando chegar?', tip: 'Depois de "Can you", o verbo fica sempre na forma base: "Can you send".' },
  { track: 'starter', emoji: '🧥', sentence: 'How ___ does this winter coat cost?', answer: 'much', distractors: ['many', 'long', 'often'], pt: 'Quanto custa este casaco de inverno?', tip: 'Para perguntar preços ("quanto custa"), usamos sempre "How much".' },
  { track: 'starter', emoji: '🎧', sentence: 'I love listening ___ music while I exercise.', answer: 'to', distractors: ['at', 'for', 'in'], pt: 'Eu adoro ouvir música enquanto me exercito.', tip: 'O verbo "listen" vem sempre acompanhado de "to" (listen to music).' },
  { track: 'starter', emoji: '🔑', sentence: 'I looked everywhere, but I can’t ___ my keys.', answer: 'find', distractors: ['found', 'finding', 'finds'], pt: 'Procurei em todo lugar, mas não consigo encontrar minhas chaves.', tip: 'Após "can’t", usamos o verbo na forma simples: "can’t find".' },
  { track: 'starter', emoji: '🍕', sentence: '___ you like a slice of pizza for dinner?', answer: 'Would', distractors: ['Are', 'Does', 'Have'], pt: 'Você gostaria de uma fatia de pizza no jantar?', tip: '"Would you like...?" é a estrutura padrão para oferecer algo com educação.' },
  { track: 'starter', emoji: '🐕', sentence: 'They ___ two friendly dogs in their backyard.', answer: 'have', distractors: ['has', 'having', 'are'], pt: 'Eles têm dois cachorros amigáveis no quintal.', tip: 'Com "They / We / I / You", usamos "have" (e "has" apenas para he/she/it).' },
  { track: 'starter', emoji: '📚', sentence: 'My sister ___ English every Tuesday and Thursday.', answer: 'studies', distractors: ['study', 'studying', 'studied'], pt: 'Minha irmã estuda inglês toda terça e quinta-feira.', tip: 'Para rotina com "My sister (she)", "study" troca o -y por -ies: "studies".' },
  { track: 'starter', emoji: '🎬', sentence: 'Let’s ___ a movie together tonight!', answer: 'watch', distractors: ['watching', 'watches', 'watched'], pt: 'Vamos assistir a um filme juntos hoje à noite!', tip: 'Depois de "Let’s", o verbo vem na forma simples: "Let’s watch".' },
  { track: 'starter', emoji: '💧', sentence: 'Could you bring me a ___ of cold water, please?', answer: 'glass', distractors: ['plate', 'fork', 'slice'], pt: 'Você poderia me trazer um copo de água gelada, por favor?', tip: '"A glass of water" = um copo de água.' },
  { track: 'starter', emoji: '🧹', sentence: 'We usually clean the house ___ Saturday mornings.', answer: 'on', distractors: ['in', 'at', 'to'], pt: 'Nós costumamos limpar a casa nas manhãs de sábado.', tip: 'Quando citamos o dia da semana (Saturday mornings), usamos a preposição "on".' },
  { track: 'starter', emoji: '🎂', sentence: 'Where ___ you born?', answer: 'were', distractors: ['was', 'did', 'are'], pt: 'Onde você nasceu?', tip: 'Em inglês dizemos "Where were you born?" (e "I was born in...").' },
  { track: 'starter', emoji: '🥪', sentence: 'He didn’t ___ breakfast before leaving home.', answer: 'eat', distractors: ['ate', 'eating', 'eats'], pt: 'Ele não tomou café da manhã antes de sair de casa.', tip: 'Quando usamos "didn’t" no passado, o verbo principal volta à forma base ("didn’t eat").' },
  { track: 'starter', emoji: '🏥', sentence: 'My mother works as a nurse at the local ___.', answer: 'hospital', distractors: ['airport', 'bakery', 'library'], pt: 'Minha mãe trabalha como enfermeira no hospital local.', tip: 'Enfermeiros e médicos atuam no "hospital" ou "clinic".' },

  // ── 2. INTERMEDIATE / TEMPOS VERBAIS & PREPOSIÇÕES (18 questões) ──
  { track: 'intermediate', emoji: '⏳', sentence: 'We have lived in this city ___ 2021.', answer: 'since', distractors: ['for', 'from', 'in'], pt: 'Nós moramos nesta cidade desde 2021.', tip: 'Usamos "since" para o ponto exato de início no tempo (since 2021) e "for" para a duração (for five years).' },
  { track: 'intermediate', emoji: '📞', sentence: 'What ___ you doing when the power went out?', answer: 'were', distractors: ['was', 'did', 'have'], pt: 'O que você estava fazendo quando a energia acabou?', tip: 'Com "you / we / they" no passado em andamento, usamos "were + verbo-ing".' },
  { track: 'intermediate', emoji: '🗓️', sentence: 'The training session starts ___ Monday at 9 AM.', answer: 'on', distractors: ['in', 'at', 'by'], pt: 'A sessão de treinamento começa na segunda-feira às 9h.', tip: 'Regra de ouro: "on" para dias da semana (on Monday), "at" para horários (at 9 AM) e "in" para meses/anos.' },
  { track: 'intermediate', emoji: '☔', sentence: 'If it ___ tomorrow, we will move the party indoors.', answer: 'rains', distractors: ['will rain', 'rained', 'raining'], pt: 'Se chover amanhã, passaremos a festa para dentro.', tip: 'Depois de "If" em condições reais do futuro, usamos o presente simples: "If it rains".' },

// ── Estado do Jogo ───────────────────────────────────────────────────────────
let selectedTrack  = 'all';
let gameMode       = 'standard'; // 'standard' | 'typing'
let sessionLength  = 15;
let shuffled       = [];
let currentQ       = 0;
let score          = 0;
let lives          = 4;
let combo          = 0;
let maxCombo       = 0;
let hintsLeft      = 3;
let correctCount   = 0;
let answered       = false;
let practicedList  = [];
let masteredSet    = new Set();

const MASTERY_KEY = 'capyFillBlankMastered_v1';

function loadMastered() {
  try {
    const raw = JSON.parse(localStorage.getItem(MASTERY_KEY) || '[]');
    if (Array.isArray(raw)) masteredSet = new Set(raw);
  } catch (e) {}
  updateMasteryUI();
}

function saveMastered(sentenceStr) {
  if (sentenceStr) masteredSet.add(sentenceStr);
  try {
    localStorage.setItem(MASTERY_KEY, JSON.stringify([...masteredSet]));
  } catch (e) {}
  updateMasteryUI();
}

function updateMasteryUI() {
  const el = document.getElementById('mastered-num');
  if (el) el.textContent = masteredSet.size;
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Áudio TTS ────────────────────────────────────────────────────────────────
function speakText(text, rate = 0.94) {
  if (!text || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'en-US';
    u.rate = rate;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function speakFullSentence(rate = 0.94) {
  const q = shuffled[currentQ];
  if (!q) return;
  const full = q.sentence.replace('___', q.answer);
  speakText(full, rate);
}

// ── Inicializar Partida ──────────────────────────────────────────────────────
function buildDeck() {
  const pool = selectedTrack === 'all'
    ? QUESTIONS
    : QUESTIONS.filter(q => q.track === selectedTrack);
  const unmastered = shuffleArr(pool.filter(q => !masteredSet.has(q.sentence)));
  const mastered   = shuffleArr(pool.filter(q => masteredSet.has(q.sentence)));
  shuffled = [...unmastered, ...mastered].slice(0, Math.min(sessionLength, pool.length));
}

function startNewSession() {
  currentQ = 0;
  score = 0;
  lives = 4;
  combo = 0;
  maxCombo = 0;
  hintsLeft = 3;
  correctCount = 0;
  practicedList = [];

  document.getElementById('score-disp').textContent = '0';
  document.getElementById('hints-left').textContent = String(hintsLeft);
  document.getElementById('hint-btn').disabled = false;
  updateComboUI();
  updateHearts();
  buildDeck();
  renderQuestion();
}

function updateComboUI() {
  const pill = document.getElementById('combo-pill');
  const countEl = document.getElementById('combo-count');
  if (!pill || !countEl) return;
  if (combo >= 2) {
    countEl.textContent = String(combo);
    pill.classList.remove('hidden');
  } else {
    pill.classList.add('hidden');
  }
}

// ── Renderizar Questão ───────────────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = shuffled[currentQ];
  if (!q) return;

  document.getElementById('q-label').textContent = `Pergunta ${currentQ + 1} de ${shuffled.length}`;
  document.getElementById('track-badge').textContent = TRACK_LABELS[q.track] || '🌱 Inglês';
  document.getElementById('q-emoji').textContent = q.emoji || '✏️';
  document.getElementById('prog-fill').style.width = `${(currentQ / shuffled.length) * 100}%`;
  document.getElementById('sentence-pt').textContent = q.pt ? `🇧🇷 "${q.pt}"` : '';
  document.getElementById('feedback').classList.add('hidden');

  const parts = q.sentence.split('___');
  document.getElementById('sentence-area').innerHTML =
    parts[0] + `<span class="blank-slot" id="blank">___</span>` + (parts[1] || '');

  const optRow = document.getElementById('options-row');
  const typRow = document.getElementById('typing-row');
  const typInput = document.getElementById('typing-input');

  if (gameMode === 'typing') {
    optRow.classList.add('hidden');
    typRow.classList.remove('hidden');
    typInput.value = '';
    typInput.disabled = false;
    setTimeout(() => typInput.focus(), 40);
  } else {
    typRow.classList.add('hidden');
    optRow.classList.remove('hidden');
    const opts = shuffleArr([q.answer, ...q.distractors]);
    optRow.innerHTML = opts.map((opt, idx) => `
      <button type="button" class="option-chip" data-opt="${opt.replace(/"/g, '&quot;')}">
        <span class="w-5 h-5 rounded-md bg-white/15 text-orange-300 text-xs font-extrabold flex items-center justify-center">${idx + 1}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    optRow.querySelectorAll('.option-chip').forEach(btn => {
      btn.addEventListener('click', () => pickOption(btn, btn.getAttribute('data-opt'), q));
    });
  }
}

// ── Dica (50/50 ou Letra Inicial) ────────────────────────────────────────────
function useHint() {
  if (answered || hintsLeft <= 0) return;
  const q = shuffled[currentQ];
  if (!q) return;

  if (gameMode === 'typing') {
    const typInput = document.getElementById('typing-input');
    const nextLen = Math.min(q.answer.length, (typInput.value.length || 0) + 2);
    typInput.value = q.answer.slice(0, nextLen);
    typInput.focus();
  } else {
    const wrongChips = Array.from(document.querySelectorAll('.option-chip'))
      .filter(b => b.getAttribute('data-opt') !== q.answer && !b.classList.contains('eliminated-chip'));
    if (wrongChips.length < 2) return;
    shuffleArr(wrongChips).slice(0, 2).forEach(b => b.classList.add('eliminated-chip'));
  }

  hintsLeft--;
  document.getElementById('hints-left').textContent = String(hintsLeft);
  if (hintsLeft <= 0) document.getElementById('hint-btn').disabled = true;
}

// ── Avaliar Resposta ─────────────────────────────────────────────────────────
function submitTypedAnswer() {
  if (answered) return;
  const q = shuffled[currentQ];
  if (!q) return;
  const typInput = document.getElementById('typing-input');
  const val = typInput.value.trim();
  if (!val) return;
  typInput.disabled = true;
  evaluateAnswer(val, q, null);
}

function pickOption(btn, chosen, q) {
  if (answered) return;
  evaluateAnswer(chosen, q, btn);
}

function evaluateAnswer(chosen, q, clickedBtn) {
  answered = true;
  const blank = document.getElementById('blank');
  const fb = document.getElementById('feedback');
  const fbTitle = document.getElementById('feedback-title');
  const fbTip = document.getElementById('feedback-tip');
  const isRight = String(chosen || '').trim().toLowerCase() === String(q.answer || '').trim().toLowerCase();

  blank.textContent = q.answer;
  blank.classList.add('filled');

  document.querySelectorAll('.option-chip').forEach(b => {
    b.classList.add('used');
    if (b.getAttribute('data-opt').toLowerCase() === q.answer.toLowerCase()) {
      b.classList.add('correct-chip');
    } else if (b !== clickedBtn) {
      b.style.opacity = '0.25';
    }
  });

  fb.classList.remove(
    'hidden',
    'bg-emerald-500/20', 'text-emerald-200', 'border-emerald-500/40',
    'bg-red-500/20', 'text-red-200', 'border-red-500/40'
  );

  const fullSentence = q.sentence.replace('___', q.answer);

  if (isRight) {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    correctCount++;
    const bonus = Math.min(12, (combo - 1) * 3);
    const pts = 12 + bonus;
    score += pts;
    document.getElementById('score-disp').textContent = String(score);
    updateComboUI();
    saveMastered(q.sentence);
    practicedList.push({ en: fullSentence, pt: q.pt, ok: true });

    blank.classList.add('correct');
    if (clickedBtn) clickedBtn.classList.add('correct-chip');
    fbTitle.textContent = `✅ Correto! "${q.answer}" (+${pts} pts)`;
    fbTip.textContent = `💡 ${q.tip}`;
    fb.classList.add('bg-emerald-500/20', 'text-emerald-200', 'border-emerald-500/40');

    speakText(fullSentence, 0.94);
    launchSparks();
  } else {
    combo = 0;
    updateComboUI();
    lives--;
    updateHearts();
    practicedList.push({ en: fullSentence, pt: q.pt, ok: false });

    blank.classList.add('wrong');
    if (clickedBtn) clickedBtn.classList.add('wrong-chip');
    fbTitle.textContent = `❌ Você escolheu "${chosen}", mas o correto é "${q.answer}".`;
    fbTip.textContent = `💡 ${q.tip}`;
    fb.classList.add('bg-red-500/20', 'text-red-200', 'border-red-500/40');

    const area = document.getElementById('sentence-area');
    area.classList.add('do-shake');
    setTimeout(() => area.classList.remove('do-shake'), 450);

    speakText(fullSentence, 0.92);
    if (lives <= 0) {
      document.getElementById('next-btn').textContent = 'Ver Resultado Final →';
    }
  }
}

function updateHearts() {
  document.querySelectorAll('[data-h]').forEach(h => {
    const idx = parseInt(h.dataset.h, 10);
    if (idx > lives) {
      h.style.opacity = '0.2';
      h.style.transform = 'scale(0.65)';
    } else {
      h.style.opacity = '1';
      h.style.transform = 'scale(1)';
    }
  });
}

function next() {
  if (lives <= 0) {
    showFinished();
    return;
  }
  currentQ++;
  if (currentQ >= shuffled.length) showFinished();
  else renderQuestion();
}

// ── Teclado (1..4 para opções, Enter para avançar/confirmar) ─────────────────
window.addEventListener('keydown', e => {
  if (e.target && e.target.id === 'typing-input') {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!answered) submitTypedAnswer();
      else next();
    }
    return;
  }
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;

  if (e.key === 'Enter' && answered) {
    e.preventDefault();
    next();
    return;
  }
  if (!answered && gameMode === 'standard' && /^[1-4]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const chips = document.querySelectorAll('.option-chip');
    if (chips[idx] && !chips[idx].classList.contains('eliminated-chip')) {
      e.preventDefault();
      chips[idx].click();
    }
  }
});

// ── Sparks ───────────────────────────────────────────────────────────────────
function launchSparks() {
  const colors = ['#f97316','#ec4899','#10b981','#f59e0b','#a855f7'];
  for (let i = 0; i < 14; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const a = (i / 14) * 360, d = 55 + Math.random() * 65;
    sp.style.setProperty('--tx', `${Math.cos(a * Math.PI / 180) * d}px`);
    sp.style.setProperty('--ty', `${Math.sin(a * Math.PI / 180) * d}px`);
    sp.style.background = colors[i % colors.length];
    sp.style.left = '50vw'; sp.style.top = '45vh';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 950);
  }
}

function recordStats(xpEarned, pct) {
  try {
    const stats = JSON.parse(localStorage.getItem('capyGameStats') || '{}');
    const prev = stats.fillBlank || { plays: 0, bestScore: 0, totalXP: 0 };
    stats.fillBlank = {
      plays: (prev.plays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, score),
      totalXP: (prev.totalXP || 0) + xpEarned,
      lastAccuracy: Math.round(pct * 100),
      updatedAt: new Date().toISOString(),
    };
    localStorage.setItem('capyGameStats', JSON.stringify(stats));
  } catch (e) {}
}

// ── Resultado Final + Revisão ────────────────────────────────────────────────
function showFinished() {
  const total = Math.max(1, shuffled.length);
  const pct   = Math.min(1, correctCount / total);
  const xp    = Math.round(pct * 50) + 15 + Math.min(18, maxCombo * 2);
  const stars = pct >= 0.85 ? 3 : pct >= 0.5 ? 2 : 1;

  recordStats(xp, pct);

  if (window.Store) {
    Store.addXP(xp);
    Store.activateStreak();
    Store.completeActivity('games');
    if (stars === 3) Store.unlockBadge('grammar_star');
  }

  const prevOv = document.getElementById('fb-result-overlay');
  if (prevOv) prevOv.remove();

  const reviewHtml = practicedList.slice(0, 12).map(item => `
    <div class="flex items-center justify-between gap-2 bg-white/5 border border-white/10 rounded-2xl px-3.5 py-2 text-left">
      <div class="min-w-0">
        <p class="font-label font-bold text-xs text-white truncate">${item.ok ? '✅' : '📌'} ${item.en}</p>
        <p class="font-body text-[11px] text-slate-400 truncate">${item.pt || ''}</p>
      </div>
      <button type="button" data-speak="${item.en.replace(/"/g, '&quot;')}" class="fb-review-speak px-2.5 py-1 rounded-xl bg-orange-500/25 hover:bg-orange-500/40 text-orange-200 text-xs font-bold flex-shrink-0">🔊</button>
    </div>
  `).join('');

  const overlay = document.createElement('div');
  overlay.id = 'fb-result-overlay';
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 overflow-y-auto';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-orange-500/60
         rounded-[2.5rem] px-6 sm:px-9 py-8 flex flex-col items-center gap-4 shadow-2xl text-center max-w-lg w-full my-auto
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-6xl">✏️</div>
      <div>
        <p class="font-label text-orange-400 font-extrabold text-xs uppercase tracking-widest mb-1">Concluído · ${TRACK_LABELS[selectedTrack]}</p>
        <h2 class="font-headline text-4xl sm:text-5xl font-black text-white mb-1">+${xp} XP</h2>
        <p class="font-body text-slate-300 text-sm">${score} pontos · ${correctCount}/${total} acertos · Combo máx: 🔥 ${maxCombo}x</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i => `<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-white/20'}" style="font-variation-settings:'FILL' 1;">star</span>`).join('')}
      </div>
      ${stars === 3 ? `<div class="bg-orange-500/20 border border-orange-500/40 rounded-xl px-4 py-2 text-orange-200 font-label font-bold text-xs">🏅 Medalha Mestre das Expressões desbloqueada!</div>` : ''}

      ${practicedList.length ? `
        <div class="w-full text-left mt-1">
          <p class="font-label text-[11px] uppercase tracking-wider text-orange-300 font-bold mb-1.5">🔊 Revisão das Frases Praticadas:</p>
          <div class="space-y-1.5 max-h-44 overflow-y-auto pr-1">${reviewHtml}</div>
        </div>
      ` : ''}

      <div class="flex gap-3 flex-wrap justify-center mt-2">
        <button type="button" id="btn-play-again" class="bg-orange-500 hover:bg-orange-400 text-white font-label font-extrabold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-orange-500/30 text-sm">🔄 Jogar de Novo</button>
        <button type="button" onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-6 py-3 rounded-full border border-white/20 active:scale-95 transition-all text-sm">Voltar ao Pavilhão 🌿</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.fb-review-speak').forEach(btn => {
    btn.addEventListener('click', () => speakText(btn.getAttribute('data-speak'), 0.92));
  });
  document.getElementById('btn-play-again').addEventListener('click', () => {
    overlay.remove();
    startNewSession();
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const c = document.getElementById('fin');
    if (c) { c.style.transform = 'scale(1)'; c.style.opacity = '1'; }
  }));
  launchSparks();
}

// ── Controles de Trilha e Modo ───────────────────────────────────────────────
document.querySelectorAll('#track-bar [data-track]').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedTrack = btn.getAttribute('data-track') || 'all';
    document.querySelectorAll('#track-bar [data-track]').forEach(b => b.classList.toggle('active', b === btn));
    startNewSession();
  });
});

document.getElementById('mode-select').addEventListener('change', e => {
  gameMode = e.target.value || 'standard';
  startNewSession();
});

document.getElementById('length-select').addEventListener('change', e => {
  sessionLength = parseInt(e.target.value, 10) || 15;
  startNewSession();
});

loadMastered();
startNewSession();
</script>
<script src="celebration.js?v=cel3"></script>
<script src="game-celebra.js?v=gc1"></script>
</body>
</html>
