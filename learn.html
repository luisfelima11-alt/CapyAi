<main class="md:pl-32 pt-24 pb-32 px-4 max-w-2xl mx-auto">

  <!-- ── HEADER ─────────────────────────────────────────── -->
  <div class="fade-up mb-8">
    <!-- Level badge -->
    <div class="flex items-center gap-3 mb-5">
      <div id="level-badge" class="flex items-center gap-2 bg-white/10 border border-white/20 px-4 py-2 rounded-full">
        <span id="level-emoji" class="text-xl inline-flex items-center">🌱</span>
        <span id="level-name" class="font-black text-sm text-white">Starter Level</span>
      </div>
      <a href="placement_test.html" class="text-slate-500 hover:text-slate-300 text-xs underline">Retake test →</a>
    </div>

    <!-- Continue CTA / Hero -->
    <div id="continue-card" class="hidden relative overflow-hidden bg-gradient-to-br from-navy via-[#0d2240] to-pink-900/40 border border-pink-500/20 rounded-3xl p-5 md:p-6 mb-8 shadow-2xl shadow-pink-500/10">
      <div class="absolute -top-10 -right-10 w-40 h-40 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <p id="continue-eyebrow" class="relative text-pink-300 text-[11px] font-black uppercase tracking-wider mb-2">Continue where you left off</p>
      <div class="relative flex items-center gap-4">
        <div id="continue-emoji" class="text-4xl md:text-5xl bg-white/10 rounded-2xl w-16 h-16 flex items-center justify-center flex-shrink-0">🌱</div>
        <div class="min-w-0 flex-1">
          <p id="continue-title" class="text-white font-black text-lg md:text-xl leading-tight truncate"></p>
          <p id="continue-step"  class="text-pink-200 text-xs mt-0.5"></p>
          <p id="continue-xp"    class="text-yellow-400 text-xs font-bold mt-1"></p>
        </div>
      </div>
      <div class="relative mt-4">
        <div class="flex items-center justify-between mb-1">
          <span id="continue-chapter-label" class="text-slate-400 text-[10px] font-bold uppercase tracking-wide"></span>
          <span id="continue-chapter-count" class="text-slate-400 text-[10px] font-bold"></span>
        </div>
        <div class="bg-white/10 rounded-full h-2 overflow-hidden">
          <div id="continue-chapter-bar" class="h-full bg-gradient-to-r from-emerald-400 to-pink-400 rounded-full transition-all" style="width:0%"></div>
        </div>
      </div>
      <button id="continue-btn" onclick="" class="relative mt-4 w-full bg-pink-500 hover:bg-pink-400 text-white font-black py-4 rounded-2xl text-base shadow-lg shadow-pink-500/30 hover:scale-[1.02] active:scale-95 transition-all min-h-[44px]">
        ▶ Continue
      </button>
    </div>

    <!-- ── Review ("Revisão da Yara") card — shown only if ≥4 weak words ──── -->
    <div id="review-card" class="hidden bg-gradient-to-r from-violet-500/20 to-pink-500/20 rounded-3xl p-5 mb-4 fade-up">
      <div class="flex items-center gap-4">
        <div class="text-4xl flex-shrink-0">🔁</div>
        <div class="flex-1 min-w-0">
          <p class="font-black text-white text-sm">Revisão da Yara</p>
          <p id="review-card-count" class="text-white/70 text-xs mt-0.5"></p>
        </div>
        <button onclick="window.location.href='lessons.html?review=1'" class="flex-shrink-0 bg-pink-500 hover:bg-pink-400 text-white font-black px-4 py-3 rounded-2xl text-sm transition-all active:scale-95 min-h-[44px]">
          Revisar
        </button>
      </div>
    </div>

    <!-- ── Streak em risco ──────────────────────────────────────
         Até aqui a única fricção de perda chegava por push às 19h — para quem
         tem push, que é 1 em 8 alunos. Dentro do app, nenhuma tela dizia que a
         streak morria hoje. -->
    <div id="streak-risco" class="hidden mb-4 fade-up rounded-3xl p-4 bg-gradient-to-r from-orange-500/15 to-pink-500/15 border border-orange-400/30">
      <div class="flex items-center gap-3 flex-wrap">
        <span class="text-2xl leading-none" id="streak-risco-icone">🔥</span>
        <div class="flex-1 min-w-[180px]">
          <p id="streak-risco-titulo" class="font-black text-white text-sm leading-snug"></p>
          <p id="streak-risco-sub" class="text-white/60 text-[11px] font-bold mt-0.5"></p>
        </div>
        <button id="streak-risco-btn" class="flex-shrink-0 bg-orange-500 hover:bg-orange-400 text-white font-black px-4 py-3 rounded-2xl text-sm transition-all active:scale-95 min-h-[44px]">
          Praticar agora
        </button>
      </div>
    </div>

    <!-- ── Daily Quests card ─────────────────────────────────── -->
    <div id="quests-card" class="bg-white/5 rounded-3xl p-5 mb-4 fade-up">
      <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <h3 class="font-black text-white text-sm flex items-center gap-2">🎯 Missões de Hoje</h3>
        <div class="flex items-center gap-2">
          <span id="freeze-chip" class="bg-cyan-500/15 text-cyan-300 text-[11px] font-black px-3 py-1.5 rounded-full flex items-center gap-1 min-h-[28px]">🧊 x0</span>
          <button id="freeze-buy-btn" onclick="buyFreeze()" class="hidden bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 text-[10px] font-black px-2.5 py-1.5 rounded-full transition-all min-h-[28px]">
            Comprar 80🫐
          </button>
        </div>
      </div>
      <p id="freeze-protected-msg" class="hidden text-cyan-300 text-[11px] font-bold bg-cyan-500/10 rounded-xl px-3 py-2 mb-3">🧊 Sua streak foi protegida ontem!</p>
      <div id="quests-list" class="flex flex-col gap-3"></div>
    </div>

    <div class="flex items-end justify-between mb-1">
      <div class="flex items-center gap-3">
        <img src="yara.png?v=3" alt="Yara" class="w-12 h-12 rounded-full object-cover border-2 border-pink-400/60 shadow-lg shadow-pink-500/20"/>
        <h1 class="font-black text-2xl text-white">Your Learning Path</h1>
      </div>
      <span id="trail-progress-label" class="text-slate-500 text-xs font-bold">0 / 24 done</span>
    </div>

    <!-- Language toggle -->
    <div id="trail-lang-toggle" class="inline-flex items-center gap-1 bg-white/5 border border-white/10 rounded-full p-1 mb-3">
      <button data-lang="en" onclick="setTrailLang('en')" class="bg-pink-500 text-white font-bold text-xs px-4 py-1.5 rounded-full transition-all">🇬🇧 English</button>
      <button data-lang="fr" onclick="setTrailLang('fr')" class="bg-white/10 text-slate-300 font-bold text-xs px-4 py-1.5 rounded-full transition-all">🇫🇷 Français</button>
      <button data-lang="tr" onclick="setTrailLang('tr')" class="bg-white/10 text-slate-300 font-bold text-xs px-4 py-1.5 rounded-full transition-all">🇹🇷 Türkçe</button>

      </div>
      <button onclick="window.location.href='landing.html'" class="text-[10px] font-black text-white bg-pink-500 px-3 py-1.5 rounded-full hover:bg-pink-400 transition-all">

    </div>
    <!-- overall progress bar -->
    <div class="bg-white/8 rounded-full h-1.5 mb-2 overflow-hidden">
      <div id="trail-progress-bar" class="h-full bg-gradient-to-r from-pink-500 to-pink-400 rounded-full transition-all" style="width:0%"></div>
    </div>
    <p class="text-slate-500 text-xs">Complete lessons in order to unlock the next one.</p>
  </div>

  <!-- ── TRAIL ──────────────────────────────────────────── -->

  </div>

</main>

</div>

const STEP_LABELS = ['Listen','Quiz','Game','Build','Speak','Chat with Yara'];
const STEP_ICONS  = ['🔊','❓','🎮','🏗️','🎤','💬'];

// ── State ─────────────────────────────────────────────────────────────────────
const completedLessons = Store.state.completedLessons || [];
const startLesson      = parseInt(localStorage.getItem('capyStartLesson') || '1');
const playerLevel      = localStorage.getItem('capyPlayerLevel') || 'starter';

// ── Trail language (English default; French is chapter 6) ──────────────────────
const requestedTrailLang = new URLSearchParams(location.search).get('lang');
let currentTrailLang = ['en','fr','tr'].includes(requestedTrailLang)
  ? requestedTrailLang
  : (localStorage.getItem('capyTrailLang') || 'en');

// ── Helpers ───────────────────────────────────────────────────────────────────
function getStepProgress(lessonId) {
  return parseInt(localStorage.getItem('capyGuidedStep_' + lessonId) || '0');
}
function isDone(id) {
  if (window.Store && Store.isLessonDone) return Store.isLessonDone(id, currentTrailLang);
  const key = currentTrailLang === 'en' ? id : `${currentTrailLang}:${id}`;
  return completedLessons.includes(key) || (currentTrailLang === 'en' && completedLessons.includes('j' + id));
}
function isUnlocked(id)  {
  return true; // All lessons unlocked — free navigation
}
function isCurrent(id)  { return !isDone(id) && isUnlocked(id); }

// ── Mini-lesson data ──────────────────────────────────────────────────────────
const DAY_SUBTITLES    = ['Listen & Quiz', 'Game', 'Build & Speak', 'Chat with Yara'];
const DAY_ICONS        = ['🔊❓', '🎮', '🏗️🎤', '💬'];
const MINI_STEP_INDICES = { 1:[0,1], 2:[2], 3:[3,4], 4:[5] };

const MINI_TRAIL = TRAIL.flatMap(lesson =>
  [1,2,3,4].map(miniNum => ({
    lessonId: lesson.id,
    miniNum,
    emoji:    lesson.emoji,
    title:    lesson.title,
    subtitle: `Day ${miniNum} — ${DAY_SUBTITLES[miniNum - 1]}`,
    dayIcons: DAY_ICONS[miniNum - 1],
    chapter:  lesson.chapter,
    xp:       Math.ceil(lesson.xp / 4),
    game:     lesson.game,
  }))
);

function isMiniDone(lessonId, miniNum) {
  // Backward compat: if lesson was fully completed in old full-mode, all minis count as done
  if (isDone(lessonId)) return true;
  return window.Store ? Store.isMiniDone(lessonId, miniNum, currentTrailLang) : false;
}
function isMiniUnlocked(lessonId, miniNum) {
  return true; // All lessons unlocked — free navigation
}
function isMiniCurrent(lessonId, miniNum) {
  return !isMiniDone(lessonId, miniNum) && isMiniUnlocked(lessonId, miniNum);
}
function getMiniStepProgress(lessonId, miniNum) {
  return parseInt(localStorage.getItem(`capyGuidedStep_${lessonId}_${currentTrailLang}_m${miniNum}`) || '0');
}

// ── Build trail HTML ──────────────────────────────────────────────────────────
function renderTrail() {
  const container = document.getElementById('trail-container');
  let html = '';

  // Only chapters matching the current language (missing lang === 'en')
  const visibleChapters = CHAPTERS.filter(ch => (ch.lang || 'en') === currentTrailLang);
  const nextTarget = computeNextMini(currentTrailLang);

  visibleChapters.forEach((ch, ci) => {
    const chMinis      = MINI_TRAIL.filter(m => m.chapter === ch.id);
    const chLessons    = TRAIL.filter(l => l.chapter === ch.id);
    const allDone      = chMinis.every(m => isMiniDone(m.lessonId, m.miniNum));
    const anyUnlocked  = chMinis.some(m => isMiniUnlocked(m.lessonId, m.miniNum));

    // Between-chapter connector (skip for first chapter)
    if (ci > 0) {
      const prevChMinis = MINI_TRAIL.filter(m => m.chapter === visibleChapters[ci - 1].id);
      const lastPrev    = prevChMinis[prevChMinis.length - 1];
      const firstCurr   = chMinis[0];
      const lastDone    = isMiniDone(lastPrev.lessonId, lastPrev.miniNum);
      const firstDone   = isMiniDone(firstCurr.lessonId, firstCurr.miniNum);
      const chConnColor = (lastDone && firstDone)
        ? 'rgba(74,222,128,0.55)'
        : (lastDone || isMiniUnlocked(firstCurr.lessonId, firstCurr.miniNum))
          ? 'rgba(236,72,153,0.4)'
          : 'rgba(255,255,255,0.06)';
      const lastIsLeft = (prevChMinis.length - 1) % 2 === 0;
      const chConnX    = lastIsLeft ? '52px' : 'calc(100% - 88px)';
      html += `
        <div class="relative w-full" style="height:36px;pointer-events:none">
          <div style="position:absolute;left:${chConnX};width:3px;top:0;height:100%;
            background:repeating-linear-gradient(to bottom,${chConnColor} 0px,${chConnColor} 6px,transparent 6px,transparent 11px);
          "></div>
        </div>`;
    }

    html += `
      <div class="mb-4 fade-up" style="animation-delay:${ci * 0.08}s">
        <!-- Chapter header -->
        <div class="flex items-center gap-3 mb-4">
          <div class="bg-gradient-to-r ${ch.color} rounded-2xl px-4 py-2 flex items-center gap-2 shadow-lg">
            <span class="text-xl w-5 h-5 flex items-center justify-center">${Components.icon(ch.iconKey, 'w-5 h-5') || ch.icon}</span>
            <div>
              <p class="font-black text-white text-sm">${ch.name}</p>
              <p class="text-white/70 text-[10px]">${ch.id === 6 ? `${chLessons.length} leçons` : `${chLessons.length} lessons · ${chLessons.length * 4} days`}</p>
            </div>
          </div>
          ${allDone      ? '<span class="text-green-400 font-bold text-sm">✅ Complete!</span>' : ''}
          ${!anyUnlocked ? '<span class="text-slate-600 text-sm">🔒 Finish previous chapter</span>' : ''}
        </div>

        <!-- Mini-nodes in zigzag -->
        <div class="flex flex-col">`;

    // ── Chapter lock disabled — all chapters open ──────────────

    chMinis.forEach((mini, i) => {
      const done         = isMiniDone(mini.lessonId, mini.miniNum);
      const unlocked     = isMiniUnlocked(mini.lessonId, mini.miniNum);
      const current      = isMiniCurrent(mini.lessonId, mini.miniNum);
      const step         = getMiniStepProgress(mini.lessonId, mini.miniNum);
      const isLeft       = i % 2 === 0;
      const isTarget     = !!nextTarget && mini.lessonId === nextTarget.lessonId && mini.miniNum === nextTarget.miniNum;
      const hasNext      = i < chMinis.length - 1;
      const nextDone     = hasNext ? isMiniDone(chMinis[i+1].lessonId, chMinis[i+1].miniNum) : false;
      const nextUnlocked = hasNext ? isMiniUnlocked(chMinis[i+1].lessonId, chMinis[i+1].miniNum) : false;

      const lineColor = (done && nextDone)
        ? 'rgba(74,222,128,0.6)'
        : (done || nextUnlocked)
          ? 'rgba(236,72,153,0.5)'
          : 'rgba(255,255,255,0.08)';

      let nodeClass = 'lesson-node w-[72px] h-[72px] rounded-2xl flex flex-col items-center justify-center relative shadow-xl select-none ';
      if (done)         nodeClass += 'bg-gradient-to-br from-green-400 to-emerald-600 border-4 border-green-300 cursor-pointer';
      else if (current) nodeClass += 'bg-gradient-to-br from-pink-500 to-rose-600 border-4 border-pink-300 cursor-pointer' + (isTarget ? ' node-current' : '');
      else if (unlocked)nodeClass += 'bg-white/10 border-2 border-white/25 hover:bg-white/18 cursor-pointer';
      else              nodeClass += 'bg-white/4 border border-white/8 opacity-50 cursor-pointer hover:opacity-70 transition-opacity';

      const miniStepCount = (MINI_STEP_INDICES[mini.miniNum] || []).length;
      const stepDots = (step > 0 && !done) ? `
        <div class="absolute -bottom-2.5 flex gap-[3px]">
          ${Array.from({length: miniStepCount}, (_, s) =>
            `<div class="w-[5px] h-[5px] rounded-full ${s < step ? 'bg-white shadow-sm' : 'bg-white/20'}"></div>`
          ).join('')}
        </div>` : '';

      // Day badge (shows D1/D2/D3/D4)
      const dayBadge = `<div class="absolute -top-2 -right-2 min-w-[20px] h-[18px] rounded-full bg-[#001229] border border-white/20 flex items-center justify-center text-[7px] font-black text-white/70 px-1">D${mini.miniNum}</div>`;

      const titleColor    = done ? 'text-green-300' : current ? 'text-pink-300' : unlocked ? 'text-white/65' : 'text-white/25';
      const subtitleColor = done ? 'text-green-400/70' : current ? 'text-pink-400/80' : unlocked ? 'text-white/40' : 'text-white/15';
      const statusLine    = done ? 'Complete ✓' : current ? 'Ready!' : !unlocked ? '🔒 Locked' : mini.dayIcons;

      const labelLeft = `
        <div class="ml-3 max-w-[130px]">
          <p class="text-[10px] font-bold leading-tight ${titleColor}">${mini.title}</p>
          <p class="text-[9px] ${subtitleColor} mt-0.5">${mini.subtitle}</p>
          <p class="text-[8px] ${subtitleColor}">${statusLine}</p>
        </div>`;
      const labelRight = `
        <div class="mr-3 max-w-[130px] text-right">
          <p class="text-[10px] font-bold leading-tight ${titleColor}">${mini.title}</p>
          <p class="text-[9px] ${subtitleColor} mt-0.5">${mini.subtitle}</p>
          <p class="text-[8px] ${subtitleColor}">${statusLine}</p>
        </div>`;

      const balloon = isTarget ? `
        <div class="node-balloon bg-pink-500 text-white text-[9px] font-black px-2.5 py-1 rounded-full shadow-lg shadow-pink-500/40 z-10">
          ${step > 0 ? 'CONTINUE' : 'START'}
          <div style="position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #ec4899;"></div>
        </div>` : '';

      const nodeInner = `
        <span class="text-[24px] leading-none">${done ? '✓' : !unlocked ? '🔒' : mini.emoji}</span>
        ${done    ? '<span class="text-[10px] text-white font-black mt-0.5">Done</span>' : ''}
        ${current ? '<span class="text-[9px] text-white font-black mt-0.5">▶ Go</span>'  : ''}
        ${dayBadge}${stepDots}${balloon}`;

      const nodeOnclick = `openPopup(${mini.lessonId},${mini.miniNum})`;
      const nodeIdAttr  = `id="mini-node-${mini.lessonId}-${mini.miniNum}"`;

      html += isLeft
        ? `<div class="flex items-center pl-5">
             <div ${nodeIdAttr} class="${nodeClass}" onclick="${nodeOnclick}">${nodeInner}</div>
             ${labelLeft}
           </div>`
        : `<div class="flex items-center justify-end pr-5">
             ${labelRight}
             <div ${nodeIdAttr} class="${nodeClass}" onclick="${nodeOnclick}">${nodeInner}</div>
           </div>`;

      if (hasNext) {
        const boxStyle = `position:absolute;left:52px;right:52px;top:0;height:100%;`;
        html += isLeft
          ? `<div class="relative w-full" style="height:48px;pointer-events:none">
               <div style="${boxStyle}border-top:3px dashed ${lineColor};border-right:3px dashed ${lineColor};border-top-right-radius:30px;"></div>
             </div>`
          : `<div class="relative w-full" style="height:48px;pointer-events:none">
               <div style="${boxStyle}border-top:3px dashed ${lineColor};border-left:3px dashed ${lineColor};border-top-left-radius:30px;"></div>
             </div>`;
      }

      // ── Chest node: every 5 minis in this chapter ──────────────
      if ((i + 1) % 5 === 0) {
        const chestIdx = Math.floor((i + 1) / 5);
        const key = chestKey(ch.id, chestIdx);
        const opened = window.Store ? Store.isChestOpened(key) : false;
        const prevMinis = chMinis.slice(0, i + 1);
        const available = !opened && prevMinis.every(m => isMiniDone(m.lessonId, m.miniNum));
        const chestClickable = available;
        const chestEmoji = opened ? '📭' : available ? '🎁' : '🔒';
        const chestCls = opened
          ? 'bg-white/5 opacity-40'
          : available
            ? 'bg-gradient-to-br from-yellow-400 to-amber-500 shadow-lg shadow-amber-500/30 cursor-pointer hover:scale-110'
            : 'bg-white/5 opacity-50';
        html += `
          <div class="flex items-center justify-center my-2" style="height:56px;pointer-events:none">
            <div class="${chestCls} rounded-2xl w-12 h-12 flex items-center justify-center text-2xl transition-transform"
                 style="pointer-events:auto" ${chestClickable ? `onclick="openChestNode(${ch.id},${chestIdx})"` : ''}>
              ${chestEmoji}
            </div>
          </div>`;
      }
    });

    // ── Boss node: "Desafio da Yara" at the end of each EN chapter ──
    // (skip French chapter 6 and "My Lessons" chapter 5)
    if (ch.id !== 6 && ch.id !== 5) {
      html += renderBossNode(ch, chMinis);
      // Discovery detour after the boss — rotates News → History → Music
      html += renderDiscoveryNode(DISCOVERY_ACTIVITIES[ci % DISCOVERY_ACTIVITIES.length]);
    }

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

// ── Boss node ("Desafio da Yara") ──────────────────────────────────────────
function renderBossNode(ch, chMinis) {
  const allDone = chMinis.every(m => isMiniDone(m.lessonId, m.miniNum));
  const beaten  = window.Store ? (Store.state.bossesBeaten || []).includes(ch.id) : false;
  const available = allDone && !beaten;
  const bossCls = beaten
    ? 'bg-gradient-to-br from-yellow-300 to-amber-500 border-4 border-yellow-200 shadow-xl shadow-amber-500/30'
    : available
      ? 'bg-gradient-to-br from-purple-500 to-fuchsia-600 border-4 border-fuchsia-300 shadow-xl shadow-fuchsia-500/30 cursor-pointer hover:scale-105 boss-pulse'
      : 'bg-white/5 border-2 border-white/10 opacity-60';
  const emoji  = beaten ? '👑' : available ? '👑' : '🔒';
  const label  = beaten ? 'Vencido!' : available ? 'Desafio da Yara' : 'Complete o capítulo';
  const sub    = beaten ? '✅ Coroa conquistada' : available ? 'Fale com a Yara!' : 'Termine todas as lições';
  const lessonIds = ch.lessons.join(',');
  const onclick = available ? `onclick="startBoss(${ch.id},'${lessonIds}')"` : '';
  const titleColor = beaten ? 'text-yellow-300' : available ? 'text-fuchsia-300' : 'text-white/30';
  return `
    <div class="flex flex-col items-center justify-center my-4" style="pointer-events:none">
      <div class="${bossCls} rounded-3xl w-20 h-20 flex flex-col items-center justify-center relative transition-transform"
           style="pointer-events:auto" ${onclick} title="${sub}">
        <span class="text-3xl leading-none">${emoji}</span>
        ${beaten ? '<span class="text-[9px] text-white font-black mt-0.5">✓</span>' : ''}
      </div>
      <p class="text-[11px] font-black ${titleColor} mt-1.5">${label}</p>
    </div>`;
}

// ── Discovery node (Notícia / História / Música) ─────────────────────────────
// Always clickable — even once done today, the student can go read another one.
function renderDiscoveryNode(activity) {
  const done = isDiscoveryDoneToday(activity);
  const cls = `bg-gradient-to-br ${activity.color} border-4 ${activity.ring} `
            + (done ? 'opacity-70' : 'shadow-xl') + ' cursor-pointer hover:scale-105';
  return `
    <div class="flex flex-col items-center justify-center my-4" style="pointer-events:none">
      <div class="${cls} rounded-3xl w-16 h-16 flex flex-col items-center justify-center relative transition-transform"
           style="pointer-events:auto" onclick="openDiscovery('${activity.key}')" title="${activity.sub}">
        <span class="text-2xl leading-none">${activity.emoji}</span>
        ${done ? '<span class="text-[9px] text-white font-black mt-0.5">✓</span>' : ''}
      </div>
      <p class="text-[11px] font-black ${done ? 'text-green-300' : activity.text} mt-1.5">${done ? 'Feito hoje!' : activity.title}</p>
    </div>`;
}

function startBoss(chapterId, lessonIds) {
  window.location.href = `lessons.html?boss=${chapterId}&lessons=${lessonIds}`;
}

// ── Popup ─────────────────────────────────────────────────────────────────────
let popupLessonId = null;
let popupMiniNum  = null;
function openPopup(lessonId, miniNum) {
  popupLessonId = lessonId;
  popupMiniNum  = miniNum;
  const lesson   = TRAIL.find(l => l.id === lessonId);
  const done     = isMiniDone(lessonId, miniNum);
  const unlocked = isMiniUnlocked(lessonId, miniNum);
  const step     = getMiniStepProgress(lessonId, miniNum);
  const ch       = CHAPTERS.find(c => c.id === lesson.chapter) || CHAPTERS[0];
  const xpVal    = Math.ceil(lesson.xp / 4);

  document.getElementById('popup-emoji').innerHTML     = done ? '✅' : !unlocked ? '🔒' : (Components.icon(ch.iconKey, 'w-12 h-12 mx-auto') || lesson.emoji);
  document.getElementById('popup-title').textContent   = lesson.title;
  document.getElementById('popup-chapter').textContent = `${ch.name} · Lesson ${lessonId} — Day ${miniNum} of 4`;
  document.getElementById('popup-xp').textContent      = done
    ? '✅ Day complete!'
    : !unlocked
      ? (miniNum === 1 ? `🔒 Finish Lesson ${lessonId - 1} Day 4 to unlock` : `🔒 Finish Day ${miniNum - 1} to unlock`)
      : `🏆 Earn ${xpVal} XP · ${DAY_SUBTITLES[miniNum - 1]}`;

  const startBtn  = document.getElementById('popup-start-btn');
  const replayBtn = document.getElementById('popup-replay-btn');

  // Locked state
  if (!unlocked) {
    document.getElementById('popup-steps').innerHTML = `
      <div class="text-center py-2">
        <p class="text-slate-400 text-sm">
          ${miniNum === 1
            ? `Finish <strong class="text-white">Lesson ${lessonId - 1} — Day 4</strong> first.`
            : `Finish <strong class="text-white">Lesson ${lessonId} — Day ${miniNum - 1}</strong> first.`}
        </p>
      </div>`;
    if (miniNum === 1 && lessonId > 1) {
      startBtn.textContent = `Go to Lesson ${lessonId - 1} — Day 4 →`;
      startBtn.onclick     = () => { closePopup(); openPopup(lessonId - 1, 4); };
    } else if (miniNum > 1) {
      startBtn.textContent = `Go to Day ${miniNum - 1} →`;
      startBtn.onclick     = () => { closePopup(); openPopup(lessonId, miniNum - 1); };
    } else {
      startBtn.textContent = 'Keep studying!';
      startBtn.onclick     = () => closePopup();
    }
    replayBtn.classList.add('hidden');
    document.getElementById('lesson-popup').classList.remove('hidden');
    return;
  }

  // Step dots — only for this mini's steps
  const activeIndices = MINI_STEP_INDICES[miniNum];
  document.getElementById('popup-steps').innerHTML = activeIndices.map((globalIdx, localIdx) => {
    const icon  = STEP_ICONS[globalIdx];
    const label = STEP_LABELS[globalIdx];
    const isDoneStep    = done || localIdx < step;
    const isCurrentStep = localIdx === step && !done;
    const dotCls = isDoneStep
      ? 'bg-green-500 border-green-400 text-white shadow-sm shadow-green-500/40'
      : isCurrentStep
        ? 'bg-pink-500 border-pink-400 text-white shadow-sm shadow-pink-500/50'
        : 'bg-white/8 border-white/15 text-slate-500';
    const labelCls = isDoneStep ? 'text-green-400' : isCurrentStep ? 'text-pink-400' : 'text-slate-600';
    return `
      <div class="flex flex-col items-center gap-1">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm border ${dotCls}">
          ${isDoneStep ? '✓' : icon}
        </div>
        <span class="text-[8px] font-bold ${labelCls} leading-tight text-center" style="max-width:36px">${label.split(' ')[0]}</span>
      </div>`;
  }).join('');

  const url = `lessons.html?lesson=${lessonId}&mini=${miniNum}&guided=1`;

  if (done) {
    startBtn.textContent = 'Review Day';
    startBtn.onclick     = () => window.location.href = url;
    replayBtn.classList.remove('hidden');
    replayBtn.textContent = 'Redo Day';
    replayBtn.onclick     = () => {
      localStorage.removeItem(`capyGuidedStep_${lessonId}_${currentTrailLang}_m${miniNum}`);
      window.location.href = url;
    };
  } else if (step > 0) {
    const stepCount = activeIndices.length;
    startBtn.textContent = `Continue — Step ${step + 1}/${stepCount} ${STEP_ICONS[activeIndices[step]] || ''}`;
    startBtn.onclick     = () => window.location.href = url;
    replayBtn.classList.remove('hidden');
    replayBtn.textContent = 'Restart Day';
    replayBtn.onclick     = () => {
      localStorage.removeItem(`capyGuidedStep_${lessonId}_${currentTrailLang}_m${miniNum}`);
      window.location.href = url;
    };
  } else {
    startBtn.textContent = `Start Day ${miniNum} →`;
    startBtn.onclick     = () => window.location.href = url;
    replayBtn.classList.add('hidden');
  }

  document.getElementById('lesson-popup').classList.remove('hidden');
}

function closePopup() {
  document.getElementById('lesson-popup').classList.add('hidden');
}
// Close on backdrop click
document.getElementById('lesson-popup').addEventListener('click', e => {
  if (e.target === document.getElementById('lesson-popup')) closePopup();
});

// ── Next mini computation ────────────────────────────────────────────────────
// Pure-ish: relies on module-level MINI_TRAIL/CHAPTERS + the isMiniDone/getMiniStepProgress
// helpers (both already defensive against missing Store). Kept side-effect free
// (only reads localStorage) so it can be exercised in isolation for testing.
function computeNextMini(lang) {
  const chapterIds = CHAPTERS.filter(ch => (ch.lang || 'en') === lang).map(ch => ch.id);
  const minis = MINI_TRAIL.filter(m => chapterIds.includes(m.chapter));
  if (minis.length === 0) return null;

  // (a) Explicit resume — user just opened a mini in lessons.html
  try {
    const last = JSON.parse(localStorage.getItem('capyLastMini_' + lang) || (lang === 'en' ? localStorage.getItem('capyLastMini') : 'null') || 'null');
    if (last && typeof last.lessonId !== 'undefined') {
      const m = minis.find(x => x.lessonId === last.lessonId && x.miniNum === last.miniNum);
      if (m && !isMiniDone(m.lessonId, m.miniNum)) return m;
    }
  } catch (e) { /* ignore malformed value */ }

  // (a2) Any mini already started mid-way (step progress > 0) but not finished
  for (const m of minis) {
    if (!isMiniDone(m.lessonId, m.miniNum) && getMiniStepProgress(m.lessonId, m.miniNum) > 0) return m;
  }

  // (b) First not-done mini in trail order
  for (const m of minis) {
    if (!isMiniDone(m.lessonId, m.miniNum)) return m;
  }

  // (c) Everything done
  return null;
}

function hasStartedTrail(lang) {
  const chapterIds = CHAPTERS.filter(ch => (ch.lang || 'en') === lang).map(ch => ch.id);
  const minis = MINI_TRAIL.filter(m => chapterIds.includes(m.chapter));
  if (minis.some(m => isMiniDone(m.lessonId, m.miniNum))) return true;
  if (minis.some(m => getMiniStepProgress(m.lessonId, m.miniNum) > 0)) return true;
  try { if (localStorage.getItem('capyLastMini_' + lang) || (lang === 'en' && localStorage.getItem('capyLastMini'))) return true; } catch (e) {}
  return false;
}

// ── Continue card (hero) ─────────────────────────────────────────────────────
function buildContinueCard() {
  const card = document.getElementById('continue-card');
  const target = computeNextMini(currentTrailLang);
  const started = hasStartedTrail(currentTrailLang);

  if (!target) {
    // (c) Trail complete → congrats state
    document.getElementById('continue-eyebrow').textContent = 'Trail complete! 🎉';
    document.getElementById('continue-emoji').innerHTML     = '🏆';
    document.getElementById('continue-title').textContent   = 'You finished this trail!';
    document.getElementById('continue-step').textContent    = 'Ready for a new challenge?';
    document.getElementById('continue-xp').textContent      = '';
    document.getElementById('continue-chapter-label').textContent = '';
    document.getElementById('continue-chapter-count').textContent = '';
    document.getElementById('continue-chapter-bar').style.width = '100%';
    const btn = document.getElementById('continue-btn');
    btn.textContent = 'Explore other courses →';
    btn.onclick = () => window.location.href = 'classes.html';
    card.classList.remove('hidden');
    return;
  }

  const step = getMiniStepProgress(target.lessonId, target.miniNum);
  const url  = `lessons.html?lesson=${target.lessonId}&mini=${target.miniNum}&guided=1`;
  const chMinis = MINI_TRAIL.filter(m => m.chapter === target.chapter);
  const chDone  = chMinis.filter(m => isMiniDone(m.lessonId, m.miniNum)).length;
  const ch      = CHAPTERS.find(c => c.id === target.chapter);

  document.getElementById('continue-eyebrow').textContent = started ? 'Continue where you left off' : 'Ready to begin?';
  document.getElementById('continue-emoji').innerHTML     = Components.icon(ch && ch.iconKey, 'w-8 h-8') || target.emoji;
  document.getElementById('continue-title').textContent   = started ? target.title : 'Start the Trail 🌱';
  document.getElementById('continue-step').textContent    = step > 0
    ? `Day ${target.miniNum} · Step ${step + 1} of ${MINI_STEP_INDICES[target.miniNum].length} — ${STEP_LABELS[MINI_STEP_INDICES[target.miniNum][step]] || ''}`
    : `Day ${target.miniNum} — ${DAY_SUBTITLES[target.miniNum - 1]}`;
  document.getElementById('continue-xp').textContent      = `🏆 +${target.xp} XP`;
  document.getElementById('continue-chapter-label').textContent = ch ? ch.name : '';
  document.getElementById('continue-chapter-count').textContent = `${chDone} / ${chMinis.length} days`;
  document.getElementById('continue-chapter-bar').style.width   = chMinis.length ? `${Math.round((chDone / chMinis.length) * 100)}%` : '0%';
  document.getElementById('continue-btn').textContent = step > 0 ? '▶ Continuar' : '▶ Começar';
  document.getElementById('continue-btn').onclick = () => window.location.href = url;
  card.classList.remove('hidden');
}

// ── Auto-scroll to the "next mini" node (Duolingo-style resume) ─────────────
function scrollToNextMini() {
  if (currentTrailLang === 'fr') return; // French retains its legacy non-guided behavior
  const target = computeNextMini(currentTrailLang);
  if (!target) return;
  setTimeout(() => {
    const el = document.getElementById(`mini-node-${target.lessonId}-${target.miniNum}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 400);
}

// ── Language toggle ───────────────────────────────────────────────────────────
function syncTrailLangButtons(lang) {
  document.querySelectorAll('#trail-lang-toggle [data-lang]').forEach(b => {
    const on = b.getAttribute('data-lang') === lang;
    b.classList.toggle('bg-pink-500', on);
    b.classList.toggle('text-white', on);
    b.classList.toggle('text-slate-300', !on);
    b.classList.toggle('bg-white/10', !on);
  });

function setTrailLang(lang) {
  currentTrailLang = lang;
  localStorage.setItem('capyTrailLang', lang);
  syncTrailLangButtons(lang);
  // French retains its legacy non-guided behavior; Turkish uses the shared guided runner.
  const continueCard = document.getElementById('continue-card');
  if (lang === 'fr') {
    if (continueCard) continueCard.style.display = 'none';

    if (continueCard) continueCard.style.display = '';
  }

  updateTrailCounter();

// ── Overall progress / completion counter (per language) ──────────────────────
function updateTrailCounter() {
  const bar = document.getElementById('trail-progress-bar');
  const lbl = document.getElementById('trail-progress-label');
  const langLessons = TRAIL.filter(l => {
    const ch = CHAPTERS.find(c => c.id === l.chapter);
    return ((ch && ch.lang) || 'en') === currentTrailLang;
  });
  const total = langLessons.length;
  const done  = langLessons.filter(l => isDone(l.id)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = `${done} / ${total} done`;
}

// ── Review ("Revisão da Yara") card — counts DUE weak words across lessons ──
// SRS: a weak word without w.srs is due immediately (streak 0). Once srs
// exists, it's due only when nextDue <= now (mirrors lessons.html).
function isWeakWordDue(w) {
  if (!w.srs) return true;
  return w.srs.nextDue <= Date.now();
}
function countWeakWords() {
  let total = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('lessonProgress_j')) continue;
    try {
      const data = JSON.parse(localStorage.getItem(key));
      total += (data.weakWords || []).filter(isWeakWordDue).length;
    } catch (e) { /* ignore malformed entries */ }
  }
  return total;
}
function renderReviewCard() {
  const card = document.getElementById('review-card');
  const countLabel = document.getElementById('review-card-count');
  if (!card) return;
  const count = countWeakWords();
  if (count >= 4) {
    card.classList.remove('hidden');
    if (countLabel) countLabel.textContent = `${count} palavras para revisar hoje`;
  } else {
    card.classList.add('hidden');
  }
}

// ── Daily Quests / Streak Freeze UI ──────────────────────────────────────────
function renderQuestsCard() {
  const list = document.getElementById('quests-list');
  if (!list || !window.Store) return;
  const dq = Store.state.dailyQuests;
  const quests = (dq && dq.quests) || [];
  list.innerHTML = quests.map(q => {
    const pct = q.target ? Math.min(100, Math.round((q.progress / q.target) * 100)) : 0;
    return `
      <div class="flex items-center gap-3">
        <span class="text-xl flex-shrink-0">${q.done ? '✅' : q.icon}</span>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold ${q.done ? 'text-green-300' : 'text-white/85'} truncate">${q.label}</p>
          <div class="bg-white/10 rounded-full h-1.5 mt-1 overflow-hidden">
            <div class="h-full ${q.done ? 'bg-green-400' : 'bg-gradient-to-r from-pink-500 to-pink-400'} rounded-full transition-all" style="width:${pct}%"></div>
          </div>
        </div>
        <span class="text-[10px] font-bold ${q.done ? 'text-green-400' : 'text-slate-400'} flex-shrink-0">${q.progress}/${q.target}</span>
      </div>`;
  }).join('');

  // Streak freeze chip
  const freezes = Store.state.streakFreezes || 0;
  const chip = document.getElementById('freeze-chip');
  if (chip) chip.textContent = `🧊 x${freezes}`;
  const buyBtn = document.getElementById('freeze-buy-btn');
  if (buyBtn) buyBtn.classList.toggle('hidden', freezes >= 2);
  const today = capyHojeBR();
  const msg = document.getElementById('freeze-protected-msg');
  if (msg) msg.classList.toggle('hidden', Store.state.lastFreezeUsed !== today);
}

function buyFreeze() {
  if (!window.Store) return;
  const freezes = Store.state.streakFreezes || 0;
  if (freezes >= 2) return;
  if (!confirm('Comprar Streak Freeze por 80 🫐? Protege sua streak se você faltar um dia.')) return;
  const ok = Store.buyStreakFreeze();
  if (ok) {
    if (window.CapySound) CapySound.correct();
  } else {
    alert('Berries insuficientes! Você precisa de 80 🫐.');
  }
}

// ── Chests (every 5 minis in a chapter) ──────────────────────────────────────
function chestKey(chapterId, idx) { return `${chapterId}_${idx}`; }

function openChestNode(chapterId, idx) {
  if (!window.Store) return;
  const key = chestKey(chapterId, idx);
  if (Store.isChestOpened(key)) return;
  const opened = Store.openChest(key);
  if (!opened) return;
  if (window.CapySound) CapySound.correct();
  if (window.CapyJuice) CapyJuice.celebrate();
  renderTrail();
  scrollToNextMini();
  setTimeout(() => alert('🎁 Baú aberto! +25 🫐 berries!'), 200);
}

// ── Aviso de streak em risco ────────────────────────────────────────────────
// Só aparece para quem TEM o que perder: streak viva e ainda sem praticar hoje.
// O prazo é real — meia-noite de Brasília, agora que o dia do aluno é o daqui.
function renderStreakRisco() {
  const el = document.getElementById('streak-risco');
  if (!el || typeof Store === 'undefined') return;
  const dias = Store.state.streakDays || 0;
  const praticouHoje = Store.state.lastPracticeDate === capyHojeBR();

  if (dias < 1 || praticouHoje) { el.classList.add('hidden'); return; }

  // Horas até a virada do dia EM BRASÍLIA — não a meia-noite do relógio do
  // aparelho, que pode estar em outro fuso (aluno viajando, notebook errado).
  const agoraBR = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
  const faltaMs = (24 - agoraBR.getHours()) * 36e5 - agoraBR.getMinutes() * 6e4;
  const horas = Math.max(0, Math.floor(faltaMs / 36e5));
  const minutos = Math.max(0, Math.round((faltaMs % 36e5) / 6e4));
  const prazo = horas >= 1 ? `${horas}h` : `${minutos}min`;

  const freezes = Store.state.streakFreezes || 0;
  document.getElementById('streak-risco-icone').textContent = freezes > 0 ? '🧊' : '🔥';
  document.getElementById('streak-risco-titulo').textContent =
    `Sua streak de ${dias} ${dias === 1 ? 'dia' : 'dias'} acaba em ${prazo}`;
  document.getElementById('streak-risco-sub').textContent = freezes > 0
    ? `Você tem ${freezes} 🧊 — se faltar hoje, um deles te protege. Melhor não gastar.`
    : 'Qualquer atividade de hoje já mantém ela viva.';

  const btn = document.getElementById('streak-risco-btn');
  const lang = (typeof currentTrailLang !== 'undefined' && currentTrailLang) || 'en';
  const proximo = computeNextMini(lang);
  btn.onclick = () => {
    // Mesma URL do card "Continue" — o &guided=1 é o que abre o mini no modo
    // guiado; sem ele a lição abre de outro jeito.
    window.location.href = proximo
      ? `lessons.html?lesson=${proximo.lessonId}&mini=${proximo.miniNum}&guided=1`
      : 'lessons.html';
  };
  el.classList.remove('hidden');
}
