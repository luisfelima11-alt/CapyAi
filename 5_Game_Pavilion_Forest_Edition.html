    const BADGE_CATALOG = [
        { id: 'tree_warden',    icon: 'eco',                         color: 'bg-emerald-500',  shadow: 'shadow-emerald-500/30', label: 'Tree Warden'   },
        { id: 'fast_tracker',   icon: 'rocket_launch',               color: 'bg-pink-500',     shadow: 'shadow-pink-500/30',    label: 'Fast Tracker'  },
        { id: 'explorer',       icon: 'style',                       color: 'bg-pink-500',     shadow: 'shadow-pink-500/30',    label: 'Card Explorer' },
        { id: 'chat_master',    icon: 'chat_bubble',                 color: 'bg-emerald-500',  shadow: 'shadow-emerald-500/30', label: 'Chat Master'   },
        { id: 'game_hero',      icon: 'sports_esports',              color: 'bg-pink-500',     shadow: 'shadow-pink-500/30',    label: 'Game Hero'     },
        { id: 'forest_sage',    icon: 'auto_awesome',                color: 'bg-emerald-500',  shadow: 'shadow-emerald-500/30', label: 'Forest Sage'   },
        { id: 'grammar_star',   icon: 'school',                      color: 'bg-cyan-500',     shadow: 'shadow-cyan-500/30',    label: 'Grammar Star'  },
        { id: 'word_wizard',    icon: 'spellcheck',                  color: 'bg-violet-500',   shadow: 'shadow-violet-500/30',  label: 'Word Wizard'   },
        { id: 'number_wizard',  icon: '123',                         color: 'bg-amber-500',    shadow: 'shadow-amber-500/30',   label: 'Number Wizard' },
        { id: 'story_teller',   icon: 'menu_book',                   color: 'bg-rose-500',     shadow: 'shadow-rose-500/30',    label: 'Story Teller'  },
        { id: 'week_warrior',   icon: 'local_fire_department',       color: 'bg-orange-500',   shadow: 'shadow-orange-500/30',  label: 'Week Warrior'  },
        { id: 'fortnight_hero', icon: 'whatshot',                    color: 'bg-red-500',      shadow: 'shadow-red-500/30',     label: 'Fortnight Hero' },
        { id: 'body_champ',     icon: 'directions_run',              color: 'bg-teal-500',     shadow: 'shadow-teal-500/30',    label: 'Body Champ'    },
        { id: 'food_explorer',  icon: 'restaurant',                  color: 'bg-yellow-500',   shadow: 'shadow-yellow-500/30',  label: 'Food Explorer' },
        { id: 'emotion_star',   icon: 'sentiment_very_satisfied',    color: 'bg-fuchsia-500',  shadow: 'shadow-fuchsia-500/30', label: 'Emotion Star'  },
        { id: 'legend',         icon: 'emoji_events',                color: 'bg-yellow-400',   shadow: 'shadow-yellow-400/30',  label: 'Legend'        },
    ];

    function updateUI() {
        document.getElementById('stat-level-badge').textContent = 'Level ' + Store.getLevel();
        const unlocked = Store.state.badges;
        document.getElementById('badge-vault').innerHTML = BADGE_CATALOG.map(b => {
            if (unlocked.includes(b.id)) {
                return `<div class="aspect-square bg-navy-light rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-6 hover:rotate-3 hover:scale-105 transition-all border border-white/10 cursor-default" title="${b.label}">
                    <div class="w-24 h-24 mb-4 ${b.color} rounded-full flex items-center justify-center shadow-lg ${b.shadow} ring-4 ring-white/20">
                        <span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">${b.icon}</span>
                    </div>
                    <span class="font-label text-sm font-bold text-white text-center">${b.label}</span>
                    <span class="font-label text-xs text-emerald-400 mt-1">✅ Earned!</span>
                </div>`;
            } else {
                return `<div class="aspect-square bg-white/3 rounded-[2rem] flex flex-col items-center justify-center p-6 opacity-40 hover:opacity-60 transition-opacity border border-dashed border-white/10 cursor-default" title="Locked — keep playing!">
                    <div class="w-24 h-24 mb-4 bg-slate-800/60 rounded-full flex items-center justify-center border border-white/10">
                        <span class="material-symbols-outlined text-slate-500 text-4xl">lock</span>
                    </div>
                    <span class="font-label text-sm font-bold text-slate-400 text-center">${b.label}</span>
                    <span class="font-label text-xs text-slate-600 mt-1">🔒 Locked</span>
                </div>`;
            }
        }).join('');
    }

    Store.completeActivity('games');

    // Auto-unlock Legend when all other badges are earned
    function checkLegend() {
        const others = BADGE_CATALOG.filter(b => b.id !== 'legend').map(b => b.id);
        if (others.every(id => Store.state.badges.includes(id))) Store.unlockBadge('legend');
    }

    updateUI();
    checkLegend();
    document.addEventListener('stateChanged', () => { updateUI(); checkLegend(); });

    // Category filter
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const f = btn.dataset.filter;
            document.querySelectorAll('#games-grid > button').forEach(tile => {
                tile.style.display = (f === 'all' || tile.dataset.category === f) ? '' : 'none';
            });
        });
    });
</script>
</body></html>
