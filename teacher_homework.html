<body class="bg-slate-50 min-h-screen">

<!-- Login Screen -->
<div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl border-2 border-slate-200 shadow-xl p-8 w-full max-w-sm text-center">
    <div class="text-5xl mb-4">🐾</div>
    <h1 class="text-2xl font-black text-navy mb-1">Professor Dashboard</h1>
    <p class="text-slate-500 text-sm mb-6">Visualize as tarefas dos seus alunos</p>
    <button data-capy-onclick="doLogin()"
      class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-black py-3 rounded-xl hover:scale-105 transition-all shadow text-sm">
      Entrar →
    </button>
    <p id="login-err" class="text-red-500 text-xs mt-3 hidden">Conta sem permissão de professor.</p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">

  <!-- Header -->
  <div class="bg-gradient-to-r from-violet-800 to-indigo-800 text-white px-6 py-5">
    <div class="max-w-6xl mx-auto flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-black">📋 Tarefas dos Alunos</h1>
        <p class="text-violet-200 text-sm">Capy Yara English — Painel do Professor</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="total-badge" class="bg-white/20 rounded-full px-4 py-1.5 text-sm font-black">0 entregas</span>
        <button data-capy-onclick="logout()" class="bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl px-4 py-1.5 text-sm font-bold transition-colors">Sair</button>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="max-w-6xl mx-auto px-4 py-5">
    <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 mb-6 flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-40">
        <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-1.5">Filtrar por Aula</label>
        <input id="filter-lesson" type="text" placeholder="ex: 32" data-capy-onchange="applyFilters()"
          class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-400"/>
      </div>
      <div class="flex-1 min-w-40">
        <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-1.5">Filtrar por Aluno</label>
        <input id="filter-student" type="text" placeholder="Nome ou ID" data-capy-oninput="applyFilters()"
          class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-400"/>
      </div>
      <div class="flex-1 min-w-40">
        <label class="block text-xs font-black text-slate-500 uppercase tracking-wider mb-1.5">Ordenar por</label>
        <select id="sort-by" data-capy-onchange="applyFilters()"
          class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-400 bg-white">
          <option value="newest">Mais recente</option>
          <option value="oldest">Mais antigo</option>
          <option value="student">Nome do aluno</option>
          <option value="lesson">Número da aula</option>
        </select>
      </div>
      <button data-capy-onclick="loadSubmissions()" class="bg-violet-600 text-white font-black px-5 py-2 rounded-xl text-sm hover:bg-violet-700 transition-colors flex items-center gap-2">
        <span class="material-symbols-outlined text-sm">refresh</span>Atualizar
      </button>
    </div>

    <!-- Stats Row -->
    <div id="stats-row" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 hidden">
      <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 text-center">
        <div id="stat-total" class="text-3xl font-black text-violet-600">0</div>
        <div class="text-xs font-black text-slate-500 mt-1">Total entregas</div>
      </div>
      <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 text-center">
        <div id="stat-students" class="text-3xl font-black text-blue-600">0</div>
        <div class="text-xs font-black text-slate-500 mt-1">Alunos únicos</div>
      </div>
      <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 text-center">
        <div id="stat-lessons" class="text-3xl font-black text-emerald-600">0</div>
        <div class="text-xs font-black text-slate-500 mt-1">Aulas diferentes</div>
      </div>
      <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 text-center">
        <div id="stat-today" class="text-3xl font-black text-amber-600">0</div>
        <div class="text-xs font-black text-slate-500 mt-1">Hoje</div>
      </div>
    </div>

    <!-- Results -->
    <div id="results-area"></div>
  </div>
</div>

<script src="auth-secure.js?v=auth20260918"></script>
<script src="assets/js/pages/teacher_homework-1.js"></script>
  <script src="assets/js/secure-inline-events.js"></script>
</body>
</html>
