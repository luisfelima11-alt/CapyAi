<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Glow backing -->
  <circle cx="160" cy="180" r="120" fill="#ec489922" />

  <!-- Body -->
  <ellipse cx="160" cy="220" rx="90" ry="68" fill="#8B6834"/>
  <!-- Body highlight -->
  <ellipse cx="148" cy="195" rx="55" ry="35" fill="#A07840" opacity="0.5"/>

  <!-- Legs -->
  <ellipse cx="108" cy="275" rx="28" ry="18" fill="#7A5A28"/>
  <ellipse cx="212" cy="275" rx="28" ry="18" fill="#7A5A28"/>
  <!-- Front legs -->
  <ellipse cx="95" cy="268" rx="20" ry="13" fill="#9A7238"/>
  <ellipse cx="225" cy="268" rx="20" ry="13" fill="#9A7238"/>

  <!-- Neck -->
  <ellipse cx="160" cy="165" rx="38" ry="30" fill="#8B6834"/>

  <!-- Head -->
  <ellipse cx="160" cy="120" rx="62" ry="54" fill="#9A7840"/>
  <!-- Head top highlight -->
  <ellipse cx="148" cy="100" rx="38" ry="25" fill="#B08C50" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="106" cy="72" rx="18" ry="15" fill="#8B6834"/>
  <ellipse cx="214" cy="72" rx="18" ry="15" fill="#8B6834"/>
  <ellipse cx="106" cy="72" rx="11" ry="9" fill="#D4956A"/>
  <ellipse cx="214" cy="72" rx="11" ry="9" fill="#D4956A"/>

  <!-- Snout / muzzle area -->
  <ellipse cx="160" cy="138" rx="42" ry="28" fill="#B09060"/>
  <ellipse cx="160" cy="133" rx="38" ry="22" fill="#C4A870"/>

  <!-- Nostrils -->
  <ellipse cx="148" cy="140" rx="6" ry="5" fill="#5C3810"/>
  <ellipse cx="172" cy="140" rx="6" ry="5" fill="#5C3810"/>
  <!-- Nose bridge -->
  <rect x="150" y="132" width="20" height="5" rx="3" fill="#9A7038" opacity="0.4"/>

  <!-- Eyes — white base -->
  <ellipse cx="136" cy="108" rx="14" ry="13" fill="white"/>
  <ellipse cx="184" cy="108" rx="14" ry="13" fill="white"/>
  <!-- Eye shadow -->
  <ellipse cx="136" cy="112" rx="14" ry="8" fill="#00000018"/>
  <ellipse cx="184" cy="112" rx="14" ry="8" fill="#00000018"/>
  <!-- Pupils -->
  <circle cx="138" cy="108" r="9" fill="#2A1800"/>
  <circle cx="186" cy="108" r="9" fill="#2A1800"/>
  <!-- Iris -->
  <circle cx="138" cy="108" r="6" fill="#5C3400"/>
  <circle cx="186" cy="108" r="6" fill="#5C3400"/>
  <!-- Eye shine -->
  <circle cx="142" cy="104" r="3.5" fill="white"/>
  <circle cx="190" cy="104" r="3.5" fill="white"/>
  <circle cx="134" cy="113" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="182" cy="113" r="1.5" fill="white" opacity="0.6"/>

  <!-- Eyebrows (friendly expression) -->
  <path d="M 124 95 Q 137 89 150 94" stroke="#5C3810" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 170 94 Q 183 89 196 95" stroke="#5C3810" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 142 154 Q 160 168 178 154" stroke="#5C3810" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="115" cy="124" rx="13" ry="8" fill="#E87070" opacity="0.35"/>
  <ellipse cx="205" cy="124" rx="13" ry="8" fill="#E87070" opacity="0.35"/>

  <!-- Tiny flower on head (cute detail) -->
  <circle cx="195" cy="76" r="9" fill="#ec4899" opacity="0.9"/>
  <circle cx="195" cy="76" r="5" fill="#fde047"/>
  <circle cx="205" cy="70" r="7" fill="#ec4899" opacity="0.8"/>
  <circle cx="205" cy="70" r="4" fill="#fde047"/>
  <circle cx="200" cy="65" r="6" fill="#f9a8d4" opacity="0.8"/>

  <!-- Tail (small round bump) -->
  <ellipse cx="242" cy="228" rx="14" ry="10" fill="#7A5A28"/>
</svg>
