<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Entrando... — Capy English</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{navy:'#001f3f',brand:{orange:'#FF9F1C',teal:'#2EC4B6'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>
*{font-family:'Plus Jakarta Sans',sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.spinner{width:48px;height:48px;border:4px solid #fde68a;border-top-color:#FF9F1C;border-radius:50%;animation:spin .8s linear infinite}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-violet-50/30 min-h-screen flex items-center justify-center px-5">

  <div class="max-w-md w-full bg-white rounded-3xl border-2 border-slate-100 p-8 md:p-10 text-center shadow-xl shadow-slate-200/40">

    <!-- Loading state -->
    <div id="loading-state">
      <div class="text-5xl mb-4">🦫</div>
      <h1 class="font-black text-2xl text-navy mb-2">Entrando...</h1>
      <p class="text-slate-500 text-sm mb-6">Verificando seu link de acesso</p>
      <div class="flex justify-center"><div class="spinner"></div></div>
    </div>

    <!-- Success state -->
    <div id="success-state" class="hidden">
      <div class="text-6xl mb-4 pop">✅</div>
      <h1 class="font-black text-2xl text-navy mb-2">Bem-vindo de volta!</h1>
      <p id="success-name" class="text-slate-500 text-sm mb-6">Carregando seu painel...</p>
      <div class="flex justify-center"><div class="spinner"></div></div>
    </div>

    <!-- Set-password state (old accounts / accounts created by e-mail link) -->
    <div id="password-state" class="hidden text-left">
      <div class="text-5xl mb-4 text-center pop">🔐</div>
      <h1 class="font-black text-2xl text-navy mb-2 text-center">Crie sua senha</h1>
      <p class="text-slate-500 text-sm mb-6 text-center">Você entrou pelo link. Crie uma senha para entrar mais rápido da próxima vez.</p>
      <label for="new-password" class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-1.5">Nova senha</label>
      <input id="new-password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"
             class="w-full h-12 rounded-xl border-2 border-slate-200 bg-slate-50 px-4 text-sm text-slate-800 focus:outline-none focus:border-[#FF9F1C] mb-2"/>
      <p id="password-error" class="text-red-500 text-xs mb-3 hidden"></p>
      <button id="save-password-btn" type="button"
              class="block w-full bg-gradient-to-r from-[#FF9F1C] to-orange-400 text-white font-black py-3.5 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all shadow-lg shadow-orange-500/20">
        Salvar senha
      </button>
      <button id="skip-password-btn" type="button" class="block w-full text-slate-400 hover:text-slate-600 font-bold text-sm py-3">
        Agora não
      </button>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden">
      <div class="text-6xl mb-4 pop">⚠️</div>
      <h1 id="error-title" class="font-black text-2xl text-navy mb-2">Link inválido</h1>
      <p id="error-msg" class="text-slate-500 text-sm mb-6">Esse link pode ter expirado ou já ter sido usado.</p>
      <a href="4_Login_Capy_Yara_Welcomes_You.html"
         class="block w-full bg-gradient-to-r from-[#FF9F1C] to-orange-400 text-white font-black py-3.5 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all shadow-lg shadow-orange-500/20">
        Solicitar novo link →
      </a>
    </div>

  </div>

<script>
(async function () {
  const token = new URLSearchParams(window.location.search).get('token');
  const loading = document.getElementById('loading-state');
  const success = document.getElementById('success-state');
  const error   = document.getElementById('error-state');

  function showError(title, msg) {
    loading.classList.add('hidden');
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-msg').textContent   = msg;
    error.classList.remove('hidden');
  }

  if (!token) {
    showError('Link inválido', 'Esse link parece estar quebrado. Solicite um novo abaixo.');
    return;
  }

  try {
    const r = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await r.json();

    if (!r.ok) {
      const msgMap = {
        token_not_found: 'Esse link não foi encontrado. Verifique se você usou o link mais recente.',
        token_used:      'Esse link já foi usado. Solicite um novo abaixo.',
        token_expired:   'Esse link expirou (válido por 15 minutos). Solicite um novo abaixo.',
        user_not_found:  'Conta não encontrada. Entre em contato com o suporte.',
      };
      showError('Não foi possível entrar', msgMap[data.error] || 'Algo deu errado. Tente novamente.');
      return;
    }

    // The server set the session cookie; cache the display info like auth.js does
    const session = {
      id: data.user.id,
      name: data.user.name,
      email: data.user.email,
      avatar: data.user.avatar || '🐾',
    };
    localStorage.setItem('capySession', JSON.stringify(session));
    try { sessionStorage.setItem('capySessOk', session.id); } catch (e) {}

    // Force plan re-sync after login
    localStorage.removeItem('capyPlanSyncedAt');

    // Bring the progress saved on the server to this device before any page saves.
    try {
      const st = await fetch('/api/db?type=state', { cache: 'no-store' });
      if (st.ok) {
        const remote = await st.json();
        if (remote && typeof remote === 'object') {
          localStorage.setItem('capyYaraState_' + session.id, JSON.stringify(remote));
        }
      }
    } catch (e) {}

    const goHome = () => {
      loading.classList.add('hidden');
      document.getElementById('password-state').classList.add('hidden');
      success.classList.remove('hidden');
      document.getElementById('success-name').textContent = `Boa, ${session.name}! Redirecionando...`;
      setTimeout(() => { window.location.href = '6_Home_Forest_Expedition.html?refresh=1'; }, 1200);
    };

    if (!data.needsPassword) { goHome(); return; }

    // Old accounts (and accounts created by e-mail link) have no password yet.
    loading.classList.add('hidden');
    document.getElementById('password-state').classList.remove('hidden');
    document.getElementById('skip-password-btn').onclick = goHome;
    document.getElementById('save-password-btn').onclick = async () => {
      const pwErr = document.getElementById('password-error');
      const password = document.getElementById('new-password').value;
      pwErr.classList.add('hidden');
      if (password.length < 8) {
        pwErr.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
        pwErr.classList.remove('hidden');
        return;
      }
      try {
        const pr = await fetch('/api/auth/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const pd = await pr.json().catch(() => ({}));
        if (!pr.ok) {
          pwErr.textContent = pd.message || 'Não foi possível salvar a senha. Tente de novo.';
          pwErr.classList.remove('hidden');
          return;
        }
        goHome();
      } catch (e) {
        pwErr.textContent = 'Falha de rede. Tente de novo.';
        pwErr.classList.remove('hidden');
      }
    };
  } catch (e) {
    showError('Falha de rede', 'Verifique sua conexão e tente novamente.');
  }
})();
</script>

</body>
</html>
