<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Yara AI — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{navy:'#001f3f'},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>
* { font-family: 'Plus Jakarta Sans', sans-serif; }

html, body { height: 100%; overflow: hidden; background: #001f3f; }

/* Breathe animation for fallback image */
@keyframes breathe {
  0%, 100% { transform: scale(1) translateY(0); }
  50%       { transform: scale(1.03) translateY(-6px); }
}
.breathe { animation: breathe 4s ease-in-out infinite; }

/* Speech bubble tail */
#speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -13px;
  left: 22px;
  width: 0; height: 0;
  border-left: 13px solid transparent;
  border-right: 6px solid transparent;
  border-top: 14px solid white;
}

/* Bubble transition */
#speech-bubble {
  transition: opacity .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
}

/* Mic wave bars */
@keyframes wave {
  0%, 100% { height: 6px; }
  50%       { height: 22px; }
}
.wave-bar {
  width: 3px; border-radius: 99px; background: white;
  animation: wave .6s ease-in-out infinite;
}

/* User pill entrance */
@keyframes pillIn {
  from { opacity: 0; transform: translateY(10px) scale(.92); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}
.pill-in { animation: pillIn .25s ease forwards; }

/* Toast entrance */
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
#toast { animation: toastIn .3s ease; }

/* Online dot pulse */
@keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:.3} }
.pulse-dot { animation: pulseDot 2s ease-in-out infinite; }

/* Bottom vignette */
.vignette {
  background: linear-gradient(to top,
    rgba(0,31,63,1) 0%,
    rgba(0,31,63,.7) 20%,
    rgba(0,31,63,0) 50%);
}

/* Input focus glow */
#chat-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(236,72,153,.45); }

/* Scrollbar hide */
textarea::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-navy">

<!-- ── TOP BAR ────────────────────────────────────────────────────────────── -->
<div id="topbar"
     class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 py-3"
     style="background:rgba(0,31,63,.8);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);">

  <button onclick="history.length>1?history.back():location.href='6_Home_Forest_Expedition.html'"
          class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors active:scale-95">
    <span class="material-symbols-outlined text-white" style="font-size:20px">arrow_back</span>
  </button>

  <div class="flex items-center gap-2">
    <div class="relative">
      <img src="yara-avatar.png" alt="Yara"
           class="w-8 h-8 rounded-full object-cover border-2 border-pink-400/60"
           onerror="this.src='yara.svg'"/>
      <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-navy pulse-dot"></span>
    </div>
    <div class="text-left">
      <p class="text-white font-black text-sm leading-none">Yara AI</p>
      <p id="status-text" class="text-emerald-400 text-[10px] font-bold leading-none mt-0.5">Online agora</p>
    </div>
  </div>

  <div class="flex items-center gap-1.5 bg-white/10 rounded-full px-3 py-1.5">
    <span class="text-yellow-300 text-xs">✨</span>
    <span class="text-white/80 text-xs font-bold">AI</span>
  </div>
</div>

<!-- ── VIDEO ZONE + BUBBLE ────────────────────────────────────────────────── -->
<div class="fixed inset-0 flex flex-col" style="padding-top:56px; padding-bottom:134px;">

  <div class="relative flex-1 overflow-hidden bg-navy">

    <!-- Looping video (if provided) -->
    <video id="yara-video" autoplay loop muted playsinline
           class="w-full h-full object-cover object-top">
      <source src="yara-chat.mp4" type="video/mp4"/>
    </video>

    <!-- Fallback: animated image -->
    <img id="yara-fallback" src="yara-avatar.png" alt="Yara"
         class="w-full h-full object-cover object-top absolute inset-0 hidden breathe"
         onerror="this.src='yara.svg'"/>

    <!-- Bottom vignette -->
    <div class="absolute inset-x-0 bottom-0 h-2/5 vignette pointer-events-none"></div>

    <!-- ── SPEECH BUBBLE ── -->
    <div id="speech-bubble"
         class="absolute left-4 right-4 opacity-0 scale-95 pointer-events-none"
         style="bottom:12%;">
      <div class="relative bg-white rounded-[1.4rem] rounded-bl-sm shadow-2xl px-5 py-4 max-w-sm">
        <!-- Typing dots -->
        <div id="typing-dots" class="flex items-center gap-1.5 py-1 hidden">
          <span class="w-2.5 h-2.5 rounded-full bg-slate-300 animate-bounce" style="animation-delay:0s"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-slate-300 animate-bounce" style="animation-delay:.15s"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-slate-300 animate-bounce" style="animation-delay:.3s"></span>
        </div>
        <!-- Reply text -->
        <p id="bubble-text" class="text-navy font-semibold text-sm leading-relaxed hidden"></p>
      </div>
    </div>

    <!-- ── USER PILL ── -->
    <div id="user-pill" class="absolute right-4 hidden" style="bottom:12%;">
      <div class="bg-pink-500 text-white rounded-[1.2rem] rounded-br-sm px-4 py-2.5 text-sm font-bold shadow-xl max-w-[220px]">
        <p id="user-pill-text" class="leading-snug"></p>
      </div>
    </div>

    <!-- ── MIC OVERLAY ── -->
    <div id="mic-wave" class="absolute inset-0 flex items-center justify-center hidden" style="background:rgba(0,0,0,.45);">
      <div class="bg-navy/90 backdrop-blur-md rounded-3xl px-10 py-8 flex flex-col items-center gap-4 border border-white/10">
        <div class="flex items-end gap-1.5" style="height:28px;">
          <div class="wave-bar" style="animation-delay:.0s"></div>
          <div class="wave-bar" style="animation-delay:.1s"></div>
          <div class="wave-bar" style="animation-delay:.2s"></div>
          <div class="wave-bar" style="animation-delay:.3s"></div>
          <div class="wave-bar" style="animation-delay:.2s"></div>
          <div class="wave-bar" style="animation-delay:.1s"></div>
          <div class="wave-bar" style="animation-delay:.0s"></div>
        </div>
        <p class="text-white font-black text-base">Ouvindo...</p>
        <button onclick="stopMic()"
                class="text-white/50 text-xs font-bold bg-white/10 px-4 py-1.5 rounded-full hover:bg-white/20 transition-colors">
          Parar
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ── BOTTOM CONTROLS ────────────────────────────────────────────────────── -->
<div class="fixed bottom-0 left-0 right-0 z-50">

  <!-- Action row -->
  <div class="flex items-center justify-center gap-10 px-6 py-4"
       style="background:rgba(0,31,63,.95);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);">

    <!-- Mic -->
    <button id="mic-btn" onclick="toggleMic()" class="flex flex-col items-center gap-1.5 group active:scale-95 transition-transform">
      <div id="mic-circle"
           class="w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-pink-500/30"
           style="background:linear-gradient(135deg,#ec4899,#be185d)">
        <span class="material-symbols-outlined text-white text-2xl" id="mic-icon"
              style="font-variation-settings:'FILL' 1">mic</span>
      </div>
      <span class="text-white/50 text-[10px] font-bold tracking-wide">ÁUDIO</span>
    </button>

    <!-- Call -->
    <button onclick="showComingSoon()" class="flex flex-col items-center gap-1.5 group active:scale-95 transition-transform">
      <div class="w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-violet-500/30"
           style="background:linear-gradient(135deg,#7c3aed,#4c1d95)">
        <span class="material-symbols-outlined text-white text-2xl"
              style="font-variation-settings:'FILL' 1">call</span>
      </div>
      <span class="text-white/50 text-[10px] font-bold tracking-wide">LIGAR</span>
    </button>

  </div>

  <!-- Input bar -->
  <div class="flex items-center gap-3 px-4 py-3"
       style="background:#001020;border-top:1px solid rgba(255,255,255,.06);padding-bottom:max(12px,env(safe-area-inset-bottom));">
    <textarea id="chat-input" rows="1"
              placeholder="Escreva para Yara..."
              onkeydown="handleKey(event)"
              oninput="autoResize(this); hideBubble();"
              class="flex-1 bg-white/10 text-white placeholder-white/35 rounded-full px-4 py-2.5 text-sm font-medium resize-none leading-snug"
              style="max-height:90px;overflow-y:auto;border:1px solid rgba(255,255,255,.12);"></textarea>
    <button id="send-btn" onclick="sendMessage()"
            class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center active:scale-95 transition-transform shadow-md"
            style="background:linear-gradient(135deg,#ec4899,#be185d)">
      <span class="material-symbols-outlined text-white" style="font-size:18px;font-variation-settings:'FILL' 1">send</span>
    </button>
  </div>

</div>

<!-- Toast -->
<div id="toast"
     class="fixed z-[60] bg-white/20 backdrop-blur-md text-white font-bold text-sm px-5 py-2.5 rounded-full shadow-xl hidden"
     style="bottom:148px;left:50%;transform:translateX(-50%);white-space:nowrap;"></div>

<script src="store.js"></script>
<script>
// ─── Video fallback ───────────────────────────────────────────────────────────
const yaraVideo    = document.getElementById('yara-video');
const yaraFallback = document.getElementById('yara-fallback');

function showFallback() {
  yaraVideo.classList.add('hidden');
  yaraFallback.classList.remove('hidden');
}

yaraVideo.addEventListener('error', showFallback);
yaraVideo.addEventListener('loadeddata', () => {
  yaraFallback.classList.add('hidden');
  yaraVideo.classList.remove('hidden');
});
// If no video present, fall back after short wait
setTimeout(() => {
  if (yaraVideo.readyState === 0 || yaraVideo.networkState === 3) showFallback();
}, 600);

// ─── Speech bubble ────────────────────────────────────────────────────────────
const bubble     = document.getElementById('speech-bubble');
const bubbleTxt  = document.getElementById('bubble-text');
const typingDots = document.getElementById('typing-dots');
let   bubbleTimr = null;

function showTypingBubble() {
  typingDots.classList.remove('hidden');
  bubbleTxt.classList.add('hidden');
  bubble.classList.remove('opacity-0','scale-95');
  bubble.classList.add('opacity-100','scale-100');
}

function showBubble(text) {
  typingDots.classList.add('hidden');
  bubbleTxt.textContent = text;
  bubbleTxt.classList.remove('hidden');
  bubble.classList.remove('opacity-0','scale-95');
  bubble.classList.add('opacity-100','scale-100');
  clearTimeout(bubbleTimr);
  bubbleTimr = setTimeout(hideBubble, 9000);
}

function hideBubble() {
  bubble.classList.remove('opacity-100','scale-100');
  bubble.classList.add('opacity-0','scale-95');
}

// ─── User pill ────────────────────────────────────────────────────────────────
const userPill     = document.getElementById('user-pill');
const userPillText = document.getElementById('user-pill-text');
let   pillTimer    = null;

function showUserPill(text) {
  userPillText.textContent = text.length > 55 ? text.slice(0,52)+'…' : text;
  userPill.classList.remove('hidden');
  userPill.classList.add('pill-in');
  clearTimeout(pillTimer);
  pillTimer = setTimeout(() => {
    userPill.classList.add('hidden');
    userPill.classList.remove('pill-in');
  }, 3500);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
const toast = document.getElementById('toast');
let   toastT = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.remove('hidden');
  clearTimeout(toastT);
  toastT = setTimeout(() => toast.classList.add('hidden'), 2600);
}
function showComingSoon() { showToast('📞 Em breve!'); }

// ─── Status ───────────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status-text');
function setStatus(txt, online = true) {
  statusEl.textContent = txt;
  statusEl.className = (online ? 'text-emerald-400' : 'text-slate-400')
    + ' text-[10px] font-bold leading-none mt-0.5';
}

// ─── Input helpers ────────────────────────────────────────────────────────────
const input   = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
let history      = [];
let firstMessage = true;

async function sendMessage() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  input.value = '';
  autoResize(input);
  sendBtn.disabled = true;
  hideBubble();

  showUserPill(text);
  history.push({ role: 'user', text });

  showTypingBubble();
  setStatus('Digitando…');

  try {
    const res  = await fetch('/api/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ history: history.slice(0, -1), message: text }),
    });
    const data  = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text
                  || data?.reply
                  || 'Hmm, não consegui responder agora. Tente de novo! 🦫';

    history.push({ role: 'assistant', text: reply });
    showBubble(reply);
    setStatus('Online agora');

    if (firstMessage) {
      firstMessage = false;
      if (typeof Store !== 'undefined') Store.addXP(10);
    }
  } catch (err) {
    showBubble('Ops! Sem conexão agora. 🌿 Tente mais tarde.');
    setStatus('Offline', false);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// ─── Mic ─────────────────────────────────────────────────────────────────────
let recognition = null;
let micActive   = false;
const micCircle = document.getElementById('mic-circle');
const micIcon   = document.getElementById('mic-icon');
const micWave   = document.getElementById('mic-wave');

function toggleMic() {
  if (micActive) { stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('🎤 Não suportado neste navegador'); return; }

  recognition = new SR();
  recognition.lang            = 'en-US';
  recognition.interimResults  = false;
  recognition.maxAlternatives = 1;

  recognition.onstart  = () => {
    micActive = true;
    micCircle.style.background = 'linear-gradient(135deg,#10b981,#059669)';
    micIcon.textContent = 'mic_off';
    micWave.classList.remove('hidden');
    setStatus('Ouvindo…');
  };
  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript;
    input.value = t;
    autoResize(input);
    stopMic();
    sendMessage();
  };
  recognition.onerror  = () => { stopMic(); showToast('🎤 Não ouvi. Tente de novo!'); };
  recognition.onend    = () => { if (micActive) stopMic(); };

  recognition.start();
}

function stopMic() {
  micActive = false;
  try { recognition?.stop(); } catch(e) {}
  recognition = null;
  micCircle.style.background = 'linear-gradient(135deg,#ec4899,#be185d)';
  micIcon.textContent = 'mic';
  micWave.classList.add('hidden');
  setStatus('Online agora');
}

// ─── Welcome bubble ───────────────────────────────────────────────────────────
setTimeout(() => {
  let name = '';
  try {
    const sess = JSON.parse(localStorage.getItem('capySession') || 'null');
    if (sess?.name) name = sess.name.split(' ')[0];
  } catch(e) {}
  showBubble(name
    ? `Olá, ${name}! 🦫 Ready to practice your English today?`
    : `Olá, Explorer! 🦫 I'm Yara — ask me anything in English!`);
}, 900);
</script>
</body>
</html>
