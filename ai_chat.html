<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Chat with Yara — AI English Practice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#001f3f",
        "secondary": "#ec4899",
        "tertiary": "#10b981",
        "surface-container": "#002a54",
      },
      fontFamily: {
        "headline": ["Plus Jakarta Sans"],
        "body":     ["Be Vietnam Pro"],
        "label":    ["Lexend"]
      },
      borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
    }
  }
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  /* Chat bubble animation */
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }
  .bubble-in { animation: bubbleIn 0.3s ease both; }

  /* Typing dots */
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-6px); }
  }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#10b981; animation: dot-bounce 1.2s ease infinite; }
  .dot:nth-child(2) { animation-delay:.15s; }
  .dot:nth-child(3) { animation-delay:.3s; }

  /* Sound wave bars (mic active) */
  @keyframes bar-wave {
    0%,100% { height:6px; }
    50%     { height:20px; }
  }
  .bar { display:inline-block; width:4px; border-radius:2px; background:#ec4899; animation: bar-wave 0.8s ease infinite; margin:0 1px; }
  .bar:nth-child(2) { animation-delay:.1s; }
  .bar:nth-child(3) { animation-delay:.2s; }
  .bar:nth-child(4) { animation-delay:.1s; }

  /* Scrollbar */
  #chat-messages::-webkit-scrollbar { width:6px; }
  #chat-messages::-webkit-scrollbar-thumb { background:#ffffff20; border-radius:999px; }
</style>
</head>
<body class="bg-primary font-body text-white min-h-screen flex flex-col overflow-hidden">

<!-- ── Top Bar ────────────────────────────────────────────────────────────── -->
<header class="flex items-center gap-4 px-6 py-4 bg-primary/90 backdrop-blur border-b border-white/10 flex-shrink-0">
  <button onclick="window.location.href='6_Home_Forest_Expedition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <!-- Yara avatar + name -->
  <div class="flex items-center gap-3">
    <div class="relative">
      <img src="Hello%20Yara%20profile%20pic%20002.png"
           class="w-12 h-12 rounded-full object-cover border-2 border-emerald-400" alt="Yara" onerror="this.onerror=null;this.src='yara.svg'"/>
      <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-400 rounded-full border-2 border-primary" id="status-dot"></span>
    </div>
    <div>
      <p class="font-headline font-bold text-white leading-none">Yara</p>
      <p class="font-label text-xs text-emerald-400" id="status-text">Thinking… 🌿</p>
    </div>
  </div>
  <!-- AI badge -->
  <div class="ml-auto flex items-center gap-2 bg-pink-500/20 border border-pink-500/40 px-3 py-1 rounded-full">
    <span class="material-symbols-outlined text-pink-400 text-sm" style="font-variation-settings:'FILL' 1;">auto_awesome</span>
    <span class="font-label text-pink-300 text-xs font-bold">AI Powered</span>
  </div>
</header>

<!-- ── Starter Prompts (shown only before first message) ─────────────────── -->
<div id="starter-prompts" class="flex-shrink-0 px-4 pt-4 flex flex-wrap gap-2 justify-center">
  <p class="w-full text-center font-label text-xs text-white/30 uppercase tracking-widest mb-1">Try asking…</p>
  <button onclick="usePrompt(this)" class="starter-btn bg-white/8 hover:bg-white/15 border border-white/15 text-white/70 font-label text-xs px-4 py-2 rounded-full active:scale-95 transition-all">What is your name? 🦫</button>
  <button onclick="usePrompt(this)" class="starter-btn bg-white/8 hover:bg-white/15 border border-white/15 text-white/70 font-label text-xs px-4 py-2 rounded-full active:scale-95 transition-all">Teach me a new word 📚</button>
  <button onclick="usePrompt(this)" class="starter-btn bg-white/8 hover:bg-white/15 border border-white/15 text-white/70 font-label text-xs px-4 py-2 rounded-full active:scale-95 transition-all">How do I say hello? 👋</button>
  <button onclick="usePrompt(this)" class="starter-btn bg-white/8 hover:bg-white/15 border border-white/15 text-white/70 font-label text-xs px-4 py-2 rounded-full active:scale-95 transition-all">Tell me about animals 🐾</button>
  <button onclick="usePrompt(this)" class="starter-btn bg-white/8 hover:bg-white/15 border border-white/15 text-white/70 font-label text-xs px-4 py-2 rounded-full active:scale-95 transition-all">What colour is the sky? 🌤️</button>
</div>

<!-- ── Chat Messages ──────────────────────────────────────────────────────── -->
<div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-4 min-h-0">
  <!-- Yara welcome bubble injected by JS -->
</div>

<!-- ── Input Bar ──────────────────────────────────────────────────────────── -->
<div class="flex-shrink-0 border-t border-white/10 bg-surface-container px-4 py-3">
  <div class="max-w-2xl mx-auto flex items-end gap-3">
    <!-- Mic button -->
    <button id="mic-btn"
            onclick="toggleMic()"
            class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-full bg-white/10 hover:bg-pink-500/20 border border-white/20 transition-all"
            title="Speak">
      <span class="material-symbols-outlined text-xl" id="mic-icon">mic</span>
    </button>
    <!-- Text input -->
    <div class="flex-1 relative">
      <textarea id="chat-input"
                rows="1"
                placeholder="Type something to Yara…"
                class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-3 pr-14 text-white placeholder-white/40 font-body resize-none focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all"
                style="max-height:120px; overflow-y:auto;"
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
    </div>
    <!-- Send button -->
    <button id="send-btn"
            onclick="sendMessage()"
            class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-full bg-emerald-500 hover:bg-emerald-400 active:scale-90 transition-all shadow-lg shadow-emerald-500/30"
            title="Send">
      <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1;">send</span>
    </button>
  </div>
  <!-- Mic wave indicator -->
  <div id="mic-wave" class="hidden flex justify-center items-end gap-1 mt-2 h-6">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <span class="font-label text-xs text-pink-400 ml-2">Listening…</span>
  </div>
</div>

<script src="store.js"></script>
<script>
// ── Conversation history ──────────────────────────────────────────────────────
const history = [];
let isThinking = false;
let recognition = null;
let micActive   = false;

// ── Starter prompt tap ───────────────────────────────────────────────────────
function usePrompt(btn) {
    document.getElementById('chat-input').value = btn.textContent.replace(/[^\w\s?!,.]/g,'').trim();
    document.getElementById('starter-prompts').style.display = 'none';
    document.getElementById('chat-input').focus();
}

// ── Greeting on load ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    const name = (window.Store?.state?.playerName) || 'Explorer';
    const greetings = [
        `Hi ${name}! 👋 I'm Yara! I'm so happy to chat with you. What English word did you learn today?`,
        `Hello ${name}! 🌿 Welcome! I'm Yara the capybara. Can you tell me one English word you know?`,
        `Hey ${name}! 😊 I'm Yara! Let's practise English together. What is your favourite animal in English?`
    ];
    const msg = greetings[Math.floor(Math.random() * greetings.length)];
    appendBubble('yara', msg);
    setStatus('Online', true);
});

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(text, online = true) {
    document.getElementById('status-text').textContent = text;
    const dot = document.getElementById('status-dot');
    dot.className = `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-primary ${online ? 'bg-emerald-400' : 'bg-yellow-400'}`;
}

function appendBubble(role, text) {
    const wrap = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = `flex gap-3 bubble-in ${role === 'yara' ? 'justify-start' : 'justify-end'}`;

    if (role === 'yara') {
        div.innerHTML = `
          <img src="Hello%20Yara%20profile%20pic%20002.png"
               class="w-9 h-9 rounded-full object-cover flex-shrink-0 self-end border border-emerald-400/40" alt="Yara" onerror="this.onerror=null;this.src='yara.svg'"/>
          <div class="max-w-[75%] bg-surface-container border border-white/10 rounded-3xl rounded-bl-sm px-5 py-3 font-body text-white text-sm leading-relaxed shadow-lg">${escHtml(text)}</div>`;
    } else {
        div.innerHTML = `
          <div class="max-w-[75%] bg-pink-500 rounded-3xl rounded-br-sm px-5 py-3 font-body text-white text-sm leading-relaxed shadow-lg shadow-pink-500/20">${escHtml(text)}</div>`;
    }

    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
}

function showTyping() {
    const wrap = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.id        = 'typing-indicator';
    div.className = 'flex gap-3 justify-start bubble-in';
    div.innerHTML = `
      <img src="Hello%20Yara%20profile%20pic%20002.png"
           class="w-9 h-9 rounded-full object-cover flex-shrink-0 self-end border border-emerald-400/40" alt="Yara" onerror="this.onerror=null;this.src='yara.svg'"/>
      <div class="bg-surface-container border border-white/10 rounded-3xl rounded-bl-sm px-5 py-4 flex items-center gap-1 shadow-lg">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
}

function hideTyping() {
    document.getElementById('typing-indicator')?.remove();
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// ── Send message ──────────────────────────────────────────────────────────────
async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text || isThinking) return;

    input.value = '';
    autoResize(input);
    appendBubble('user', text);
    history.push({ role: 'user', text });
    // Hide starter prompts after first message
    const sp = document.getElementById('starter-prompts');
    if (sp) sp.style.display = 'none';

    isThinking = true;
    setStatus('Typing… ✍️', false);
    showTyping();
    document.getElementById('send-btn').disabled = true;

    try {
        const res  = await fetch('/api/chat', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ history: history.slice(0, -1), message: text })
        });
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text
                   || "Oops! I couldn't think of a reply. Try again! 😅";

        hideTyping();
        appendBubble('yara', reply);
        history.push({ role: 'assistant', text: reply });

        // Award XP for chatting (once per session max 3 times)
        const userTurns = history.filter(m => m.role === 'user').length;
        if (window.Store && userTurns <= 3) {
            Store.addXP(5);
            Store.activateStreak();
        }
        // Unlock chat_master after 5 exchanges; mark activity complete after first reply
        if (window.Store) {
            if (userTurns === 1) Store.completeActivity('ai_chat');
            if (userTurns >= 5) Store.unlockBadge('chat_master');
        }
    } catch (err) {
        hideTyping();
        appendBubble('yara', "Hmm, I can't connect right now. Is the server running? 🌿");
    }

    isThinking = false;
    setStatus('Online', true);
    document.getElementById('send-btn').disabled = false;
    document.getElementById('chat-input').focus();
}

// ── Web Speech Recognition (mic) ─────────────────────────────────────────────
function toggleMic() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        appendBubble('yara', "Sorry, your browser doesn't support voice input. Try typing instead! 😊");
        return;
    }

    if (micActive) {
        recognition?.stop();
        return;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang          = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        micActive = true;
        document.getElementById('mic-icon').textContent = 'mic_off';
        document.getElementById('mic-btn').classList.add('bg-pink-500/30', 'border-pink-500/60');
        document.getElementById('mic-wave').classList.remove('hidden');
        document.getElementById('mic-wave').classList.add('flex');
    };

    recognition.onresult = e => {
        const transcript = e.results[0][0].transcript;
        document.getElementById('chat-input').value = transcript;
        autoResize(document.getElementById('chat-input'));
        sendMessage();
    };

    recognition.onerror = () => stopMic();
    recognition.onend   = () => stopMic();

    recognition.start();
}

function stopMic() {
    micActive = false;
    document.getElementById('mic-icon').textContent = 'mic';
    document.getElementById('mic-btn').classList.remove('bg-pink-500/30', 'border-pink-500/60');
    document.getElementById('mic-wave').classList.add('hidden');
    document.getElementById('mic-wave').classList.remove('flex');
}
</script>
</body>
</html>
