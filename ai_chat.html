<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Yara AI — Capy Yara English</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet"/>
<style>
  /* ── Chamada de video (8/out) ────────────────────────────────────────────────
     Pedido do Luis: "gostei das funcionalidades, nao do design". A capivara
     ocupa a tela como numa chamada de video do celular; as falas flutuam em
     baloes por cima da parte de baixo; a caixa de texto flutua. Sem cartoes e
     sem emoji na interface (icones de linha, na cor do projeto).

     Esta pagina continua sem Tailwind e sem fonte de icones: e o destino do
     botao "Yara AI" de 201 paginas, e cada request a menos aqui vale por 201.
     Os icones sao <symbol> inline (Lucide, licenca ISC). */
  :root{
    --fundo:#050c18; --navy:#001f3f; --rosa:#ec4899; --rosa-claro:#f9a8d4;
    --rosa-suave:rgba(236,72,153,.14); --teal:#2EC4B6; --vermelho:#e11d48;
    --tinta:#f3f6fb; --tinta-2:rgba(243,246,251,.72); --tinta-3:rgba(243,246,251,.5);
    --vidro:rgba(10,20,38,.46); --vidro-forte:rgba(10,20,38,.72); --borda:rgba(255,255,255,.14);
    --bolha-ia:rgba(9,18,36,.74); --bolha-eu:rgba(236,72,153,.90);
    --raio-bolha:20px; --raio-cauda:6px; --raio-caixa:26px;
    --sombra-bolha:0 6px 20px rgba(2,6,16,.28); --sombra-flutua:0 18px 48px rgba(2,6,16,.5);
    --ease:cubic-bezier(.22,1,.36,1);
    /* Celular/tablet em pe: a capivara num quadrado colado no topo. O clamp corta
       no maximo ~9% de cada lado (medido nas 8 artes: mala, croissant e bandeiras
       ficam dentro). As falas so comecam abaixo do rosto. */
    --lado:clamp(100vw, 58vh, 118vw);
    --zona-rosto:max(45vh, calc(var(--lado) * .56 + 20px));
    --painel:clamp(380px, 32vw, 460px);
    /* Usado como MASCARA na marca das falas de voz. */
    --icone-mic: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z%27/%3E%3Cpath d=%27M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.07A7 7 0 0 0 19 11Z%27/%3E%3C/svg%3E");
  }
  @supports (height:100dvh){
    :root{ --lado:clamp(100vw, 58dvh, 118vw); --zona-rosto:max(45dvh, calc(var(--lado) * .56 + 20px)); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--fundo);color:var(--tinta);
       display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  :focus-visible{outline:3px solid var(--rosa);outline-offset:3px}
  .ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;
      stroke-linecap:round;stroke-linejoin:round}

  /* ── Palco: a capivara em tela cheia ─────────────────────────────────────── */
  #palco{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--navy)}
  /* A propria arte, ampliada e desfocada, preenchendo a tela inteira. */
  .fundo{position:absolute;inset:-10%;background-size:cover;background-position:center;
         filter:blur(40px) saturate(1.3);transform:scale(1.15);opacity:.62;transition:opacity .35s ease}
  .quadro{position:absolute;top:0;left:50%;width:var(--lado);height:var(--lado);transform:translateX(-50%);
          -webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);
                  mask-image:linear-gradient(180deg,#000 74%,transparent 100%)}
  /* Sem video (antes do 1o toque, sem clipe, movimento reduzido): a foto respira. */
  #palco:not([data-video="on"]) .quadro .retrato:first-child{animation:respira 9s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  /* O aluno pausou o movimento (botao do topo): a foto tambem para de respirar. */
  #palco[data-movimento="off"] .quadro .retrato{animation:none}
  .retrato{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
           transition:opacity .2s ease}
  .retrato-b{opacity:0}
  /* Veus para o texto ser legivel: em cima (barra) e embaixo (baloes e caixa). */
  #palco::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,12,24,.62) 0,rgba(5,12,24,0) 18%,
                                      rgba(5,12,24,0) 40%,rgba(5,12,24,.55) 62%,rgba(5,12,24,.92) 100%)}

  /* Estados da ligacao, por cima do quadro. */
  .anel,.halo{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  #palco[data-estado="microfone"] .anel,
  #palco[data-estado="conectando"] .anel{opacity:1}
  .anel::before,.anel::after{content:'';position:absolute;inset:8%;border-radius:50%;
    border:2px solid rgba(46,196,182,.55);animation:anelCresce 2s ease-out infinite}
  .anel::after{animation-delay:1s}
  @keyframes anelCresce{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.04);opacity:0}}
  .halo{background:radial-gradient(closest-side,rgba(236,72,153,0) 62%,rgba(236,72,153,.22) 100%)}
  #palco[data-estado="ia_falando"] .halo{opacity:1;animation:haloPulsa 1.8s ease-in-out infinite}
  @keyframes haloPulsa{0%,100%{opacity:.55}50%{opacity:1}}

  /* Um indicador por vez, logo acima dos baloes: a voz do aluno (medidor), ela
     pensando (pontinhos) ou ela falando (ondas). So visual: o #estado anuncia. */
  .status{position:absolute;left:50%;top:calc(var(--zona-rosto) - 52px);transform:translateX(-50%);
          height:34px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .medidor,.pontinhos,.ondas{display:none;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;
          background:var(--vidro);border:1px solid var(--borda);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  #palco[data-estado="ouvindo"] .medidor,#palco[data-estado="falando"] .medidor{display:flex}
  #palco[data-estado="ouvindo"] .medidor{opacity:.55}
  .medidor{height:34px}
  .medidor i{width:4px;height:100%;border-radius:99px;transform:scaleY(.12);transform-origin:center;
             background:linear-gradient(180deg,#5eead4,var(--teal));transition:transform .08s linear}
  #palco[data-estado="pensando"] .pontinhos{display:flex}
  .pontinhos i{width:7px;height:7px;border-radius:50%;background:var(--rosa-claro);
               animation:saltinho 1.1s ease-in-out infinite}
  .pontinhos i:nth-child(2){animation-delay:.14s}
  .pontinhos i:nth-child(3){animation-delay:.28s}
  @keyframes saltinho{0%,62%,100%{transform:translateY(0);opacity:.45}31%{transform:translateY(-5px);opacity:1}}
  #palco[data-estado="ia_falando"] .ondas{display:flex;height:34px}
  .ondas i{width:4px;height:16px;border-radius:99px;background:var(--rosa);animation:onda .9s ease-in-out infinite}
  .ondas i:nth-child(2){animation-delay:.15s}
  .ondas i:nth-child(3){animation-delay:.3s}
  @keyframes onda{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

  /* ── Barra de cima, flutuando sobre o palco ─────────────────────────────── */
  #topo{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
        padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px}
  .redondo{width:44px;height:44px;border-radius:50%;background:var(--vidro);border:1px solid var(--borda);
           -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;
           justify-content:center;flex:none;transition:transform .15s var(--ease),background .15s}
  .redondo:hover{background:var(--vidro-forte)}
  .redondo:active{transform:scale(.92)}
  .redondo[hidden]{display:none}
  .cresce-topo{flex:1}
  /* O botao da capivara: avatar grande, nome e estado em duas linhas. */
  #btn-capivara{position:relative;display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;
          min-height:48px;background:var(--vidro);border:1px solid var(--borda);
          -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;
          padding:4px 14px 4px 4px;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
  #btn-capivara:hover{background:var(--vidro-forte);border-color:rgba(255,255,255,.26)}
  #btn-capivara:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #btn-capivara .avatar{position:relative;flex:none;width:38px;height:38px}
  #btn-capivara .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;
          border:2px solid rgba(255,255,255,.9);display:block}
  #btn-capivara .avatar::after{content:'';position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;
          border-radius:50%;background:#22c55e;border:2px solid #0b1220}
  #btn-capivara[data-estado="ia_falando"] .avatar::after{background:var(--rosa)}
  #btn-capivara .nomes{display:flex;flex-direction:column;min-width:0;overflow:hidden;line-height:1.2}
  #btn-capivara .linha2{display:flex;align-items:center;gap:8px;min-width:0}
  #btn-capivara .chev{width:16px;height:16px;opacity:.75;transition:transform .2s var(--ease)}
  #btn-capivara[aria-expanded="true"] .chev{transform:rotate(180deg)}
  #btn-capivara.travado{cursor:default}
  #btn-capivara.travado .chev{display:none}
  /* Pulso ate o aluno abrir o menu pela 1a vez (pedido do Luis). Brilho no
     box-shadow, nunca transform: transform criava rolagem lateral em 320px. */
  #btn-capivara.chamar{animation:chamaCapivara 8s ease-out 1.5s infinite}
  @keyframes chamaCapivara{
    0%{box-shadow:0 0 0 0 rgba(236,72,153,.7)}
    9%{box-shadow:0 0 0 10px rgba(236,72,153,0)}
    10%{box-shadow:0 0 0 0 rgba(236,72,153,.6)}
    19%{box-shadow:0 0 0 10px rgba(236,72,153,0)}
    100%{box-shadow:0 0 0 0 rgba(236,72,153,0)}}
  #titulo{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #estado{font-size:12px;font-weight:600;color:var(--tinta-2);white-space:nowrap;flex:none}
  #cron{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--tinta);flex:none}
  #cron:empty{display:none}
  #cota{font-size:12px;font-weight:700;color:#FFC48A;flex:none}
  #cota:empty{display:none}
  #btn-movimento .ic-play{display:none}
  #btn-movimento[aria-pressed="false"] .ic-pausa{display:none}
  #btn-movimento[aria-pressed="false"] .ic-play{display:block}

  /* ── A conversa por cima do palco ───────────────────────────────────────── */
  #chamada{position:relative;z-index:3;flex:1;min-height:0;display:flex;flex-direction:column}
  #conversa{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
            padding-top:var(--zona-rosto);transition:padding-top .3s var(--ease),background .3s}
  /* As falas antigas somem no degrade; as novas ficam embaixo, perto da caixa. */
  #fio{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 14px 10px;
       -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 48px);
               mask-image:linear-gradient(180deg,transparent 0,#000 48px);
       -webkit-overflow-scrolling:touch}
  #fio .coluna{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:100%;
               max-width:44rem;margin-inline:auto}
  #fio p{max-width:min(84%,34rem);padding:10px 14px;border-radius:var(--raio-bolha);
         font-size:15px;line-height:1.5;font-weight:500;overflow-wrap:anywhere;
         box-shadow:var(--sombra-bolha);animation:falaEntra .22s var(--ease) both}
  @keyframes falaEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #fio p[data-quem="ia"]{align-self:flex-start;background:var(--bolha-ia);color:var(--tinta);
         border:1px solid var(--borda);border-bottom-left-radius:var(--raio-cauda);white-space:pre-line}
  #fio p[data-quem="eu"]{align-self:flex-end;background:var(--bolha-eu);color:#fff;
         border-bottom-right-radius:var(--raio-cauda)}
  /* "Agora: Intensivo · Encenacao" — aviso da pagina, nao fala de ninguem. */
  #fio p[data-quem="sistema"]{align-self:center;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
         gap:6px 8px;max-width:min(94%,32rem);text-align:center;background:var(--vidro);
         -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tinta-2);
         font-size:12.5px;font-weight:700;border:1px solid var(--borda);border-radius:18px;padding:6px 8px 6px 14px;box-shadow:none}
  #fio p[data-quem="sistema"] .ic{width:16px;height:16px;color:var(--rosa-claro)}
  #fio p[data-quem="sistema"] .item{display:inline-flex;align-items:center;gap:5px;color:var(--tinta)}
  #fio p[data-quem="sistema"] button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;
         border-radius:999px;background:var(--rosa);color:#fff;font-weight:800;font-size:12.5px}
  #fio p[data-quem="sistema"] button .ic{color:#fff;width:14px;height:14px}
  /* Marca quem veio da ligacao, para distinguir o falado do escrito. */
  #fio p[data-canal="voz"]::before{content:'';display:inline-block;width:.75em;height:.75em;
    margin-right:.4em;vertical-align:-.06em;opacity:.6;background:currentColor;
    -webkit-mask:var(--icone-mic) center/contain no-repeat;mask:var(--icone-mic) center/contain no-repeat}
  #fio p.viva::after{content:'';display:inline-block;width:.45ch;height:.95em;
    margin-left:.12em;vertical-align:-.12em;background:currentColor;border-radius:1px;
    animation:cursorPisca 1s steps(2,start) infinite}
  @keyframes cursorPisca{0%,100%{opacity:1}50%{opacity:0}}
  #fio .novo{animation:pedacoEntra .26s var(--ease) both}
  @keyframes pedacoEntra{from{opacity:.2}to{opacity:1}}
  #fio .digitando{display:inline-flex;gap:4px;align-items:center;min-height:20px}
  #fio .digitando i{width:6px;height:6px;border-radius:50%;background:var(--tinta-3);
                    animation:saltinho 1.1s ease-in-out infinite}
  #fio .digitando i:nth-child(2){animation-delay:.14s}
  #fio .digitando i:nth-child(3){animation-delay:.28s}

  /* Modo leitura: rolou para cima para reler -> a conversa sobe e cobre o palco.
     Substitui o antigo painel "Nossa conversa" e o botao "Ver historico". */
  #voltar-palco{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;display:none;
         align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;
         white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;
         background:var(--vidro-forte);border:1px solid var(--borda);
         -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--sombra-flutua)}
  #voltar-palco .ic{width:16px;height:16px;color:var(--rosa-claro)}
  body[data-lendo] #conversa{padding-top:calc(env(safe-area-inset-top,0px) + 76px);
         background:rgba(5,12,24,.86)}
  body[data-lendo] #voltar-palco{display:inline-flex}
  /* Teclado aberto no celular: o rosto encolhe, as falas sobem. */
  body[data-digitando] #conversa{padding-top:calc(env(safe-area-inset-top,0px) + 76px)}

  /* ── Caixa de texto flutuante ───────────────────────────────────────────── */
  #compositor{position:relative;z-index:3;flex:none;padding:6px 12px max(12px, env(safe-area-inset-bottom,0px))}
  .caixa{max-width:44rem;margin-inline:auto;background:var(--vidro-forte);
         -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
         border:1px solid var(--borda);border-radius:var(--raio-caixa);padding:10px 10px 10px 14px;
         box-shadow:var(--sombra-flutua);transition:border-color .2s}
  .caixa:focus-within{border-color:rgba(236,72,153,.55)}
  #entrada{width:100%;background:transparent;border:none;color:var(--tinta);font:inherit;
           font-size:16px;font-weight:500;line-height:1.45;resize:none;outline:none;
           max-height:9rem;overflow-y:auto;padding:4px 2px}
  #entrada::placeholder{color:var(--tinta-3)}
  .acoes{display:flex;align-items:center;gap:8px;margin-top:8px}
  .cresce{flex:1}
  /* Dificuldade + estilo: icone do nivel, icone do estilo e os nomes curtos. */
  #btn-modo{display:flex;align-items:center;gap:6px;min-height:40px;background:rgba(255,255,255,.07);
            border:1px solid var(--borda);border-radius:999px;padding:0 12px 0 10px;
            font-size:13px;font-weight:700;color:var(--tinta);min-width:0;flex:0 1 auto;transition:background .15s}
  #btn-modo[hidden]{display:none}
  #btn-modo:not(:disabled):hover{background:rgba(255,255,255,.13)}
  #btn-modo .modo-ic{display:flex;align-items:center;gap:4px;flex:none;color:var(--rosa-claro)}
  #btn-modo .modo-ic .ic{width:18px;height:18px}
  #btn-modo .modo-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #btn-modo .chev{width:14px;height:14px;opacity:.7;transition:transform .2s var(--ease)}
  #btn-modo[aria-expanded="true"] .chev{transform:rotate(180deg)}
  @media(max-width:359px){#btn-modo .modo-txt{display:none}}
  .acao{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
        justify-content:center;flex:none;transition:transform .15s var(--ease),background .15s}
  .acao:not(:disabled):active{transform:scale(.9)}
  .acao[hidden]{display:none}
  .acao .ic{width:20px;height:20px}
  .acao span{display:flex}
  .acao span[hidden]{display:none}
  .ic-parar .ic{width:14px;height:14px;fill:currentColor}
  #ligar,#silenciar{background:rgba(255,255,255,.07);border:1px solid var(--borda);color:var(--rosa-claro)}
  #silenciar{color:var(--tinta)}
  #ligar.desligar,#silenciar.desligar{background:var(--vermelho);border-color:transparent;color:#fff}
  /* A ponta direita troca de papel como no WhatsApp: microfone com a caixa
     vazia, seta de enviar quando ha texto. */
  #gravar,#btn-enviar{background:var(--rosa);color:#fff}
  #gravar.gravando{background:var(--vermelho);animation:pulsoRec 1.4s ease-out infinite}
  @keyframes pulsoRec{0%{box-shadow:0 0 0 0 rgba(225,29,72,.55)}100%{box-shadow:0 0 0 12px rgba(225,29,72,0)}}

  /* Enquanto grava, a faixa de gravacao ocupa o lugar do texto. */
  .gravacao{display:none;align-items:center;gap:10px;min-height:30px;padding:4px 2px;
            font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .caixa.gravando #entrada,.caixa.transcrevendo #entrada{display:none}
  .caixa.gravando .gravacao,.caixa.transcrevendo .gravacao{display:flex}
  .ponto-rec{width:10px;height:10px;border-radius:50%;background:#f43f5e;flex:none;
             animation:cursorPisca 1s steps(2,start) infinite}
  .caixa.transcrevendo .ponto-rec{background:var(--tinta-3);animation:none}
  #cancelar-gravacao{margin-left:auto;font-size:13px;font-weight:700;color:var(--tinta-2);
                     padding:6px 10px;border-radius:999px}
  #cancelar-gravacao:hover{background:rgba(255,255,255,.1);color:#fff}
  .caixa.transcrevendo #cancelar-gravacao{display:none}
  .dica{max-width:44rem;margin:8px auto 0;font-size:12px;font-weight:500;color:var(--tinta-3);
        text-align:center;line-height:1.4;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px}
  .dica .ic{width:13px;height:13px;vertical-align:-2px}
  .dica span{display:inline-flex;align-items:center;gap:4px}
  @media(max-height:640px){.dica{display:none}}

  /* ── Menus (capivara; dificuldade e estilo) ─────────────────────────────── */
  #veu{position:fixed;inset:0;z-index:40;background:rgba(2,6,16,.5);opacity:0;transition:opacity .2s}
  #veu[hidden]{display:none}
  #veu.aberto{opacity:1}
  .painel{position:fixed;z-index:41;background:rgba(10,18,34,.94);border:1px solid var(--borda);
          -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--sombra-flutua);
          max-height:min(36rem,calc(100dvh - 6rem));overflow-y:auto;overscroll-behavior:contain}
  .painel[hidden]{display:none}
  .painel .painel-titulo{font-size:12px;font-weight:800;color:var(--tinta-3);
          text-transform:uppercase;letter-spacing:.08em;padding:8px 12px 10px}
  /* Celular: folha subindo de baixo, onde o polegar alcanca. */
  @media(max-width:767px){
    .painel{left:0;right:0;bottom:0;border-radius:24px 24px 0 0;
            padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
            animation:folhaSobe .26s var(--ease) both}
    @keyframes folhaSobe{from{transform:translateY(100%)}to{transform:none}}
    .painel::before{content:'';display:block;width:36px;height:4px;border-radius:99px;
      background:rgba(255,255,255,.25);margin:4px auto 10px}
  }
  @media(min-width:768px){
    #menu-persona{left:14px;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(25rem,calc(100vw - 28px));
                  border-radius:20px;padding:6px;animation:desceEntra .2s var(--ease) both}
    @keyframes desceEntra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
    #menu-modo{left:50%;bottom:120px;transform:translateX(-50%);width:min(44rem,calc(100vw - 2rem));
               border-radius:20px;padding:8px 8px 0;animation:popEntra .2s var(--ease) both}
    @keyframes popEntra{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%)}}
    #menu-modo .grupos{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  }
  .opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         padding:10px 12px;border-radius:14px;transition:background .15s}
  .opcao:hover{background:rgba(255,255,255,.06)}
  .opcao[aria-selected="true"]{background:var(--rosa-suave)}
  .opcao .mini{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:rgba(255,255,255,.1)}
  .opcao .txt{min-width:0;flex:1}
  .opcao b{display:block;font-size:15px;font-weight:700}
  .opcao small{display:block;font-size:13px;font-weight:500;color:var(--tinta-3);line-height:1.35;margin-top:2px}
  .opcao .seta{width:16px;height:16px;opacity:.5}
  #menu-modo .grupo h3{font-size:12px;font-weight:800;color:var(--tinta-3);
          text-transform:uppercase;letter-spacing:.08em;padding:8px 12px 6px}
  #menu-modo .grupo-motivo{font-size:13px;font-weight:600;color:#FFD9A8;line-height:1.4;padding:0 12px 6px}
  #menu-modo .grupo-motivo[hidden]{display:none}
  #menu-modo .opcao{min-height:56px}
  #menu-modo .opcao .ic-roda{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;
          justify-content:center;background:var(--rosa-suave);color:var(--rosa-claro)}
  #menu-modo .opcao .ic-roda .ic{width:18px;height:18px}
  #menu-modo .opcao .ok{width:18px;height:18px;opacity:0;color:var(--rosa-claro)}
  #menu-modo .opcao[aria-checked="true"]{background:var(--rosa-suave)}
  #menu-modo .opcao[aria-checked="true"] .ok{opacity:1}
  #menu-modo .opcao:disabled{opacity:.4}
  #menu-modo .rodape{position:sticky;bottom:0;display:flex;justify-content:flex-end;
          padding:10px 4px;background:linear-gradient(to top,rgba(10,18,34,.98) 70%,rgba(10,18,34,0))}
  #modo-pronto{min-height:44px;padding:0 24px;border-radius:999px;background:var(--rosa);color:#fff;
          font-weight:800;font-size:15px}

  /* ── Aviso e toast ──────────────────────────────────────────────────────── */
  #aviso{position:relative;z-index:3;flex:none;width:calc(100% - 24px);max-width:44rem;margin:0 auto 6px;
         padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;line-height:1.4;
         background:rgba(255,159,28,.16);border:1px solid rgba(255,159,28,.35);color:#FFD9A8}
  #aviso[hidden]{display:none}
  #aviso.erro{background:rgba(225,29,72,.18);border-color:rgba(244,63,94,.45);color:#FFC9D3}
  #toast{position:fixed;left:50%;bottom:8rem;transform:translateX(-50%);z-index:50;
         background:rgba(2,6,16,.88);color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px}
  #toast[hidden]{display:none}

  /* ── Deitado com largura (tablet deitado, computador): como o Meet com o
     chat aberto. Palco a esquerda, conversa num painel de vidro a direita. ── */
  @media (orientation:landscape) and (min-width:560px){
    #palco .quadro{--lado-d:min(calc(100vh - 120px), calc(100vw - var(--painel) - 120px));
          width:var(--lado-d);height:var(--lado-d);top:50%;left:calc((100vw - var(--painel)) / 2);
          transform:translate(-50%,-50%);
          -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),
                             linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
          -webkit-mask-composite:source-in;
          mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),
                     linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
          mask-composite:intersect}
    #palco::after{background:radial-gradient(ellipse at 38% 50%,rgba(5,12,24,0) 40%,rgba(5,12,24,.6) 100%)}
    .status{top:auto;bottom:24px;left:calc((100vw - var(--painel)) / 2)}
    #topo{right:var(--painel)}
    #chamada{position:fixed;top:0;right:0;bottom:0;width:var(--painel);z-index:3;
             background:rgba(8,16,30,.62);-webkit-backdrop-filter:blur(24px) saturate(1.3);
             backdrop-filter:blur(24px) saturate(1.3);border-left:1px solid var(--borda)}
    #conversa{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
    body[data-lendo] #conversa,body[data-digitando] #conversa{padding-top:calc(env(safe-area-inset-top,0px) + 12px);background:transparent}
    body[data-lendo] #voltar-palco{display:none}
    #fio{padding:16px 16px 10px}
    #fio p{max-width:88%}
    #fio p[data-quem="ia"]{background:rgba(255,255,255,.06)}
    #compositor{padding:6px 14px max(14px, env(safe-area-inset-bottom,0px))}
    .caixa{background:rgba(255,255,255,.05);box-shadow:none}
    #menu-modo{left:auto;right:16px;transform:none;width:min(44rem,calc(100vw - 32px))}
    @keyframes popEntra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  @media (min-width:768px){
    #titulo{font-size:16px}
    #btn-capivara{min-height:52px}
  }
  /* Tela de toque: nao ha Enter nem Shift+Enter para ensinar. */
  @media(hover:none){.dica-teclado{display:none}}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  /* Sem movimento: so o pontinho fixo no botao da capivara, no lugar do pulso. */
  @media(prefers-reduced-motion:reduce){
    #btn-capivara.chamar .avatar::before{content:'';position:absolute;left:-2px;top:-2px;width:10px;height:10px;
      border-radius:50%;background:var(--rosa);border:2px solid #0b1220}
  }
</style>

<!-- O palco: a capivara em tela cheia, como numa chamada de video. Dois <video>
     que se revezam (parada / falando) para a troca ser uma fusao, nunca um
     piscar. Nenhum baixa nada antes do 1o toque do aluno (capy-presence.js). -->
<div id="palco" data-estado="desconectado" aria-hidden="true">
  <div class="fundo" id="fundo"></div>
  <div class="quadro">
    <video class="retrato" id="yara-video" poster="yara-quadrado-v1.jpg" muted loop playsinline preload="none"></video>
    <video class="retrato retrato-b" poster="yara-quadrado-v1.jpg" muted loop playsinline preload="none"></video>
    <div class="anel"></div>
    <div class="halo"></div>
  </div>
  <div class="status">
    <div class="medidor" id="medidor"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="pontinhos"><i></i><i></i><i></i></div>
    <div class="ondas"><i></i><i></i><i></i></div>
  </div>
</div>

<header id="topo">
  <button class="redondo" type="button" onclick="capyVoltar()" aria-label="Voltar"><svg class="ic" aria-hidden="true"><use href="#i-voltar"/></svg></button>
  <!-- Trocar de capivara e AQUI em cima desde 28/set (pedido do Luis: "onde
       esta escrito capivara tal online"). Pulsa ate o aluno abrir o menu. -->
  <button id="btn-capivara" type="button" aria-haspopup="listbox" aria-expanded="false"
          aria-controls="menu-persona" aria-label="Trocar de capivara. Agora: Yara">
    <span class="avatar"><img id="cracha-arte" src="yara-quadrado-v1.jpg" alt=""/></span>
    <span class="nomes">
      <span id="titulo">Yara AI</span>
      <span class="linha2">
        <span id="estado" role="status" aria-live="polite">online</span>
        <span id="cron"></span>
        <span id="cota"></span>
      </span>
    </span>
    <svg class="ic chev" aria-hidden="true"><use href="#i-chev"/></svg>
  </button>
  <span class="cresce-topo" aria-hidden="true"></span>
  <!-- So aparece quando ha video para tocar (capy-presence.js). -->
  <button id="btn-movimento" class="redondo" type="button" aria-pressed="true"
          aria-label="Movimento da capivara" title="Pausar o movimento" hidden><svg class="ic ic-pausa" aria-hidden="true"><use href="#i-pausa"/></svg><svg class="ic ic-play" aria-hidden="true"><use href="#i-play"/></svg></button>
</header>

<main id="chamada">
  <div id="conversa">
    <div id="fio" role="log" aria-live="polite" aria-label="Conversa com a Yara" tabindex="0">
      <div class="coluna" id="fio-coluna"></div>
    </div>
    <!-- Modo leitura (rolou para cima): a conversa cobre o palco; isto devolve. -->
    <button id="voltar-palco" type="button"><svg class="ic" aria-hidden="true"><use href="#i-baixo"/></svg><span id="voltar-palco-txt">Voltar para a Yara</span></button>
  </div>

  <div id="aviso" role="status" aria-live="polite" hidden></div>

  <form id="compositor" autocomplete="off">
    <div class="caixa">
      <div class="gravacao" aria-live="polite">
        <span class="ponto-rec" aria-hidden="true"></span>
        <span id="gravacao-txt">Gravando 0:00</span>
        <button id="cancelar-gravacao" type="button">Cancelar</button>
      </div>
      <textarea id="entrada" rows="1" maxlength="2000"
                placeholder="Escreva uma mensagem…"
                aria-label="Escreva uma mensagem para a Yara"></textarea>
      <div class="acoes">
        <!-- Dificuldade e estilo da conversa (28/set). A capivara foi para o topo. -->
        <button id="btn-modo" type="button" aria-haspopup="dialog"
                aria-expanded="false" aria-controls="menu-modo" disabled>
          <span class="modo-ic" aria-hidden="true"></span>
          <span class="modo-txt">Auto · Livre</span>
          <svg class="ic chev" aria-hidden="true"><use href="#i-chev"/></svg>
        </button>
        <span class="cresce"></span>
        <button id="silenciar" class="acao" type="button" aria-pressed="false"
                aria-label="Silenciar o microfone" title="Silenciar" hidden><svg class="ic" aria-hidden="true"><use href="#i-mic-off"/></svg></button>
        <!-- Telefone = ligacao ao vivo. Antes a ligacao era o MICROFONE, e o aluno,
             que conhece o microfone do WhatsApp, achava que ia mandar um audio. -->
        <button id="ligar" class="acao" type="button" aria-label="Ligar para a Yara" title="Ligar">
          <span class="ic-ligar"><svg class="ic" aria-hidden="true"><use href="#i-ligar"/></svg></span><span class="ic-desligar" hidden><svg class="ic" aria-hidden="true"><use href="#i-desligar"/></svg></span>
        </button>
        <!-- Microfone = grava e manda como mensagem. Vira a seta de enviar quando ha texto. -->
        <button id="gravar" class="acao" type="button" aria-label="Gravar um áudio" title="Gravar um áudio">
          <span class="ic-mic"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><span class="ic-parar" hidden><svg class="ic" aria-hidden="true"><use href="#i-parar"/></svg></span>
        </button>
        <button id="btn-enviar" class="acao" type="submit" aria-label="Enviar" hidden><svg class="ic" aria-hidden="true"><use href="#i-enviar"/></svg></button>
      </div>
    </div>
    <p class="dica"><span class="dica-teclado">Enter envia · Shift+Enter quebra a linha ·</span><span><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg>grava um áudio</span><span aria-hidden="true">·</span><span><svg class="ic" aria-hidden="true"><use href="#i-ligar"/></svg>liga para ela</span></p>
  </form>
</main>

<div id="veu" hidden></div>
<div id="menu-persona" class="painel" role="listbox" aria-label="Com quem você quer falar" hidden></div>
<div id="menu-modo" class="painel" role="dialog" aria-modal="false" aria-labelledby="modo-titulo" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="capy-skins.js?v=skins1"></script>
<script src="auth-secure.js?v=m1015"></script>
<script src="store.js?v=modo20260928"></script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const ARTE_PADRAO = 'yara-quadrado-v1.jpg';

const ROTULOS = {
  microfone:   'pedindo o microfone…',
  conectando:  'chamando…',
  ouvindo:     'te ouvindo',
  falando:     'você falando',
  pensando:    'pensando',
  ia_falando:  'falando',
  desconectado:'online',
};

const semMovimento = () => {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; }
};
const mmss = ms => Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0');

function avisar(txt, erro) {
  const a = $('aviso');
  if (!txt) { a.hidden = true; return; }
  a.textContent = txt;
  a.className = erro ? 'erro' : '';
  a.hidden = false;
}
function toast(msg, dur) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(window._toast);
  window._toast = setTimeout(() => { t.hidden = true; }, dur || 2500);
}

// ── O fio ────────────────────────────────────────────────────────────────────
// Uma lista só para voz e texto. As falas da ligação usam a mesma maquinaria de
// "linha viva" da conversa.html: os deltas chegam palavra a palavra e a linha
// CRESCE; quando o turno fecha ela é finalizada, em vez de virar uma segunda
// linha. Sem isso o texto apareceria duas vezes.
const falas = new Map();
const noFim = () => { const t = $('fio'); return t.scrollHeight - t.scrollTop - t.clientHeight < 60; };
// Fala nova mais alta que a area visivel: alinha pelo INICIO dela, senao o
// aluno ve o fim de uma resposta longa e tem que rolar para cima para ler.
function rolar() {
  const t = $('fio');
  const ultima = $('fio-coluna').lastElementChild;
  if (ultima && ultima.offsetHeight > t.clientHeight - 24) {
    t.scrollTop = ultima.offsetTop - 12;   // #fio e position:relative: offsetTop ja e dentro dele
  } else {
    t.scrollTop = t.scrollHeight;
  }
}

// ── Icones (no lugar dos emojis) ─────────────────────────────────────────────
// O `emoji` que vem do /api/personas nunca e mostrado: o Luis nao quer emoji na
// interface ("fica infantil") e no Windows a bandeira vira letra. Id que nao
// estiver aqui cai no balao de conversa, nunca num emoji.
const ICONE_NIVEL = { auto: 'nivel-auto', zero: 'nivel-1', iniciante: 'nivel-2', medio: 'nivel-3', intensivo: 'nivel-4' };
const ICONE_ESTILO = { livre: 'conversa', guiada: 'bussola', encenacao: 'mascaras', repete: 'repetir', comosediz: 'idiomas', revisao: 'cerebro', historia: 'livro' };
const iconeNivel = id => ICONE_NIVEL[id] || 'nivel-auto';
const iconeEstilo = id => ICONE_ESTILO[id] || 'conversa';
function icone(nome) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'ic');
  s.setAttribute('aria-hidden', 'true');
  s.dataset.icone = nome;
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + nome);
  s.appendChild(u);
  return s;
}

function linhaDe(quem, canal, id) {
  let reg = id ? falas.get(id) : null;
  if (reg) return reg;
  const p = document.createElement('p');
  p.dataset.quem = quem === 'eu' ? 'eu' : 'ia';
  p.dataset.canal = canal;
  if (canal === 'voz') p.classList.add('viva');
  const corpo = document.createElement('span');
  p.appendChild(corpo);
  $('fio-coluna').appendChild(p);
  reg = { p, corpo, texto: '' };
  if (id) falas.set(id, reg);
  return reg;
}

// Só acrescenta o sufixo novo. Reescrever a linha inteira a cada delta faria o
// texto piscar e mataria a animação de entrada de cada pedaço.
function escrever(reg, texto) {
  if (texto.indexOf(reg.texto) !== 0) { reg.corpo.textContent = ''; reg.texto = ''; }
  const novo = texto.slice(reg.texto.length);
  if (!novo) return;
  const s = document.createElement('span');
  s.className = 'novo';
  s.textContent = novo;   // textContent, nunca innerHTML: é fala transcrita.
  reg.corpo.appendChild(s);
  reg.texto = texto;
}

function dizer(quem, canal, texto) {
  const colado = noFim();
  const reg = linhaDe(quem, canal, null);
  escrever(reg, texto);
  reg.p.classList.remove('viva');
  if (colado) rolar();
  return reg;
}

function pensando(liga) {
  $('palco').dataset.estado = liga ? 'pensando' : 'desconectado';
  sincronizarVideo();
  const velho = $('fio-coluna').querySelector('p[data-pensando]');
  if (velho) velho.remove();
  if (!liga) return;
  const p = document.createElement('p');
  p.dataset.quem = 'ia'; p.dataset.canal = 'texto'; p.dataset.pensando = '1';
  const d = document.createElement('span');
  d.className = 'digitando';
  d.appendChild(document.createElement('i'));
  d.appendChild(document.createElement('i'));
  d.appendChild(document.createElement('i'));
  p.appendChild(d);
  $('fio-coluna').appendChild(p);
  rolar();
}

// ── Personas ─────────────────────────────────────────────────────────────────
// O cliente NÃO tem lista embutida: ela vem do /api/personas. É isso que faz uma
// IA de curso nova aparecer aqui sem tocar neste arquivo. Se o GET falhar, a
// página funciona com a Yara padrão e o menu simplesmente não abre — fallback
// com lista seria a segunda lista.
let PERSONAS = [];
let personaAtual = 'conversa';

// Dificuldade e estilo (28/set). Tambem vem do /api/personas: NIVEIS, ESTILOS
// e APELIDOS (capivaras que sairam do menu, mas cujo link ainda vale).
let NIVEIS = [], ESTILOS = [], APELIDOS = [];
let nivelEscolhido = 'auto', estiloEscolhido = 'livre';
// So grava nivel/estilo no Store depois de ler o catalogo: no boot, antes
// dele, os valores padrao apagariam a preferencia salva do aluno.
let modoCarregado = false;

const temId = (lista, id) => lista.some(x => x.id === id);
function nivelDaUrl() {
  try { const n = new URLSearchParams(location.search).get('nivel'); return temId(NIVEIS, n) ? n : null; } catch (_) { return null; }
}

function personaInicial() {
  let id = 'conversa';
  try {
    const daUrl = new URLSearchParams(location.search).get('persona');
    if (daUrl) id = daUrl;
    else if (window.Store && Store.state && Store.state.aiPersona) id = Store.state.aiPersona;
  } catch (_) {}
  // "Capivara para iniciantes" saiu do menu: o link antigo vira Yara + Total
  // iniciante (a nao ser que a URL ja traga um nivel).
  const apelido = APELIDOS.find(a => a.id === id);
  if (apelido) {
    id = apelido.persona;
    if (!nivelDaUrl() && temId(NIVEIS, apelido.nivel)) nivelEscolhido = apelido.nivel;
  }
  return id;
}

// Nivel e estilo salvos: URL primeiro (link compartilhado), depois o Store.
function carregarModo() {
  let q = null, sn = null, se = null;
  try { q = new URLSearchParams(location.search); } catch (_) {}
  try { if (window.Store && Store.state) { sn = Store.state.aiNivel; se = Store.state.aiEstilo; } } catch (_) {}
  nivelEscolhido = [q && q.get('nivel'), sn].find(x => temId(NIVEIS, x)) || 'auto';
  estiloEscolhido = [q && q.get('estilo'), se].find(x => temId(ESTILOS, x)) || 'livre';
  modoCarregado = true;
}

// O que a capivara atual aceita. A Maia tem o jeito dela; a paciente, so nivel.
function personaAceita(campo) {
  const p = dadosDaPersona(personaAtual);
  return !p || p[campo] !== false;
}
const nivelEfetivo = () => (personaAceita('niveis') && temId(NIVEIS, nivelEscolhido) ? nivelEscolhido : 'auto');
const estiloEfetivo = () => (personaAceita('estilos') && temId(ESTILOS, estiloEscolhido) ? estiloEscolhido : 'livre');
const dadosNivel = id => NIVEIS.find(n => n.id === id) || null;
const dadosEstilo = id => ESTILOS.find(e => e.id === id) || null;

// Persona, nivel e estilo na URL de uma vez, sem os valores padrao. replaceState:
// trocar nao pode empilhar historico, senao o botao voltar vira um labirinto.
function gravarUrl() {
  try {
    const u = new URL(location.href);
    const por = (k, v, padrao) => { if (!v || v === padrao) u.searchParams.delete(k); else u.searchParams.set(k, v); };
    por('persona', personaAtual, 'conversa');
    if (modoCarregado) { por('nivel', nivelEscolhido, 'auto'); por('estilo', estiloEscolhido, 'livre'); }
    history.replaceState(null, '', u.pathname + u.search);
  } catch (_) {}
}
function salvarPreferencias() {
  try {
    if (!window.Store || !Store.state) return;
    Store.state.aiPersona = personaAtual;
    if (modoCarregado) { Store.state.aiNivel = nivelEscolhido; Store.state.aiEstilo = estiloEscolhido; }
    Store.save();
  } catch (_) {}
}

function dadosDaPersona(id) {
  return PERSONAS.find(p => p.id === id) || null;
}

// Troca a capivara do palco: arte, clipes e o fundo borrado. Com transicao
// quando o ALUNO troca (no carregamento da pagina e imediato), e a arte nova e
// baixada ANTES de aparecer: sem isso a tela piscava vazia entre uma capivara e
// outra. Os <video> (poster, clipe, descarregar o anterior) sao do
// capy-presence.js; aqui so o quadro e o fundo somem e voltam.
let trocaDaVez = 0;
function trocarArte(arte, clipes, animar) {
  const quadro = document.querySelector('#palco .quadro'), fundo = $('fundo');
  const vez = ++trocaDaVez;
  const aplicar = () => {
    if (vez !== trocaDaVez) return;   // o aluno ja trocou de novo: vale a ultima
    if (window.CapyPresence) CapyPresence.setPersona({ arte, clipes });
    else document.querySelectorAll('#palco video').forEach(v => { v.poster = arte; });
    fundo.style.backgroundImage = 'url("' + arte + '")';
    requestAnimationFrame(() => { quadro.style.opacity = ''; fundo.style.opacity = ''; });
  };
  if (!animar || semMovimento()) { aplicar(); return; }
  quadro.style.transition = fundo.style.transition = 'opacity .2s ease';
  quadro.style.opacity = '0'; fundo.style.opacity = '0';
  const img = new Image();
  img.onload = img.onerror = () => setTimeout(aplicar, 200);
  img.src = arte;
}

function aplicarPersona(id, comHistoria) {
  const p = dadosDaPersona(id);
  // `destino` é a persona que não é conversada aqui: o menu navega para a página
  // que já tem a simulação inteira (recrutador, devolutiva, clipe).
  if (p && p.destino) { location.href = p.destino; return; }
  // Trocou de capivara: o que foi conversado até aqui era com a ANTERIOR — anota
  // antes de trocar. (No boot o histórico ainda nem existe; o try segura.)
  if ((p ? p.id : 'conversa') !== personaAtual) { try { anotarMemoria('texto'); } catch (_) {} }
  personaAtual = p ? p.id : 'conversa';
  const arte = (p && p.arte) || ARTE_PADRAO;
  // Sem catalogo (boot) a Yara fica na foto: os clipes vem do /api/personas.
  trocarArte(arte, (p && p.clipes) || null, comHistoria);
  $('cracha-arte').src = arte;
  const nome = p ? p.rotulo : 'Yara AI';
  $('titulo').textContent = nome;
  $('btn-capivara').setAttribute('aria-label', 'Trocar de capivara. Agora: ' + (p ? p.rotulo : 'Yara'));
  $('fio').setAttribute('aria-label', 'Conversa com ' + nome);
  $('voltar-palco-txt').textContent = 'Voltar para a ' + nome;   // todas sao "a": Yara, Maia, capivara
  if (comHistoria) gravarUrl();
  // Sem catalogo (boot, ou /api/personas fora do ar) nao grava: a persona salva
  // pode ser um apelido ("iniciante") que so o catalogo sabe resolver.
  if (PERSONAS.length) salvarPreferencias();
  pintarModo();
}

function montarMenu() {
  const m = $('menu-persona');
  m.textContent = '';
  const titulo = document.createElement('div');
  titulo.className = 'painel-titulo';
  titulo.setAttribute('role', 'presentation');
  titulo.textContent = 'Com quem você quer falar?';
  m.appendChild(titulo);
  for (const p of PERSONAS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opcao';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', String(p.id === personaAtual));
    b.dataset.id = p.id;
    const img = document.createElement('img');
    img.className = 'mini'; img.alt = ''; img.loading = 'lazy';
    img.src = p.arte || ARTE_PADRAO;
    const txt = document.createElement('div');
    txt.className = 'txt';
    const nome = document.createElement('b');
    nome.textContent = p.rotulo;
    const leg = document.createElement('small');
    leg.textContent = p.legenda || '';
    txt.appendChild(nome); txt.appendChild(leg);
    b.appendChild(img); b.appendChild(txt);
    // A entrevistadora abre outra pagina: a seta avisa antes do toque.
    if (p.destino) {
      const seta = icone('externo');
      seta.classList.add('seta');
      b.appendChild(seta);
    }
    b.addEventListener('click', () => { fecharMenus(); aplicarPersona(p.id, true); });
    m.appendChild(b);
  }
}

// ── O chamariz: o botao da capivara pulsa ate o aluno descobrir o menu ──────
// Pedido do Luis: "que fique pulsando as vezes, para a pessoa saber que da pra
// apertar". Pulsa ate a 1a vez que o menu abre, e volta se entrar capivara nova.
const CHAVE_VISTAS = 'capyCapivarasVistas';
function capivarasVistas() {
  try { const v = JSON.parse(localStorage.getItem(CHAVE_VISTAS) || 'null'); return v && Array.isArray(v.ids) ? v.ids : null; }
  catch (_) { return null; }
}
function marcarVistas() {
  try { localStorage.setItem(CHAVE_VISTAS, JSON.stringify({ ids: PERSONAS.map(p => p.id), em: Date.now() })); } catch (_) {}
}
function pintarChamariz() {
  const vistas = capivarasVistas();
  const novidade = PERSONAS.length > 1 && (!vistas || PERSONAS.some(p => !vistas.includes(p.id)));
  const ocupado = chamada.ligado() || chamada.pendente() || gravando() || gravacao.transcrevendo;
  $('btn-capivara').classList.toggle('chamar', novidade && !ocupado && $('menu-persona').hidden);
}

function abrirMenu() {
  if (!PERSONAS.length) return;
  fecharMenus(false);
  montarMenu();
  marcarVistas();
  $('menu-persona').hidden = false;
  $('veu').hidden = false;
  requestAnimationFrame(() => $('veu').classList.add('aberto'));
  $('btn-capivara').setAttribute('aria-expanded', 'true');
  pintarChamariz();
  const sel = $('menu-persona').querySelector('[aria-selected="true"]') || $('menu-persona').querySelector('.opcao');
  if (sel) sel.focus();
}

// ── Dificuldade e estilo (28/set) ───────────────────────────────────────────
// A pilula do compositor mostra o que vale agora: icone do nivel, icone do
// estilo e "Iniciante · Guiada".
function pintarModo() {
  const b = $('btn-modo');
  const temCatalogo = NIVEIS.length > 0 && ESTILOS.length > 0;
  b.hidden = !temCatalogo;
  if (!temCatalogo) return;
  const aceitaN = personaAceita('niveis'), aceitaE = personaAceita('estilos');
  const n = dadosNivel(nivelEfetivo()), e = dadosEstilo(estiloEfetivo());
  let icones = ['jeito'], texto = 'Do jeito dela';
  if (aceitaN || aceitaE) {
    const ic = [], tx = [];
    if (aceitaN && n) { ic.push(iconeNivel(n.id)); tx.push(n.curto); }
    if (aceitaE && e) { ic.push(iconeEstilo(e.id)); tx.push(e.curto); }
    icones = ic; texto = tx.join(' · ');
  }
  const caixaIc = b.querySelector('.modo-ic');
  caixaIc.textContent = '';
  icones.forEach(nome => caixaIc.appendChild(icone(nome)));
  b.querySelector('.modo-txt').textContent = texto;
  b.setAttribute('aria-label', aceitaN || aceitaE
    ? 'Dificuldade: ' + (aceitaN && n ? n.rotulo : 'do jeito dela') + '. Estilo: ' + (aceitaE && e ? e.rotulo : 'do jeito dela') + '. Toque para mudar.'
    : 'Esta capivara tem o jeito dela. Toque para ver.');
}

function opcaoDeModo(tipo, item, marcado, aceita) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'opcao';
  b.setAttribute('role', 'radio');
  b.setAttribute('aria-checked', String(marcado));
  b.tabIndex = marcado ? 0 : -1;
  b.disabled = !aceita;
  b.dataset.tipo = tipo;
  b.dataset.id = item.id;
  const ic = document.createElement('span');
  ic.className = 'ic-roda';
  ic.appendChild(icone(tipo === 'estilo' ? iconeEstilo(item.id) : iconeNivel(item.id)));
  const txt = document.createElement('div');
  txt.className = 'txt';
  const nome = document.createElement('b');
  nome.textContent = item.rotulo;
  const leg = document.createElement('small');
  leg.textContent = item.legenda || '';
  txt.appendChild(nome); txt.appendChild(leg);
  const ok = icone('ok');
  ok.classList.add('ok');
  b.appendChild(ic); b.appendChild(txt); b.appendChild(ok);
  b.addEventListener('click', () => escolherModo(tipo, item.id));
  return b;
}

function grupoDeModo(titulo, tipo, lista, atual, aceita) {
  const sec = document.createElement('section');
  sec.className = 'grupo';
  const h = document.createElement('h3');
  h.id = 'grupo-' + tipo; h.textContent = titulo;
  sec.appendChild(h);
  const motivo = document.createElement('p');
  motivo.className = 'grupo-motivo';
  const p = dadosDaPersona(personaAtual);
  motivo.textContent = (p && p.motivo) || 'Esta capivara tem o jeito dela.';
  motivo.hidden = aceita;
  sec.appendChild(motivo);
  const rg = document.createElement('div');
  rg.setAttribute('role', 'radiogroup');
  rg.setAttribute('aria-labelledby', h.id);
  for (const item of lista) rg.appendChild(opcaoDeModo(tipo, item, item.id === atual, aceita));
  // Setas andam entre as opcoes do grupo e ja escolhem (padrao de radio).
  rg.addEventListener('keydown', ev => {
    const passo = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[ev.key];
    if (!passo) return;
    const botoes = Array.from(rg.querySelectorAll('[role="radio"]:not(:disabled)'));
    const i = botoes.indexOf(document.activeElement);
    if (i < 0) return;
    ev.preventDefault();
    const alvo = botoes[(i + passo + botoes.length) % botoes.length];
    alvo.focus();
    escolherModo(tipo, alvo.dataset.id);
  });
  sec.appendChild(rg);
  return sec;
}

function montarMenuModo() {
  const m = $('menu-modo');
  m.textContent = '';
  const t = document.createElement('div');
  t.className = 'painel-titulo'; t.id = 'modo-titulo';
  t.textContent = 'Como vai ser a conversa?';
  m.appendChild(t);
  const grupos = document.createElement('div');
  grupos.className = 'grupos';
  grupos.appendChild(grupoDeModo('Dificuldade', 'nivel', NIVEIS, nivelEscolhido, personaAceita('niveis')));
  grupos.appendChild(grupoDeModo('Estilo', 'estilo', ESTILOS, estiloEscolhido, personaAceita('estilos')));
  m.appendChild(grupos);
  const rod = document.createElement('div');
  rod.className = 'rodape';
  const pronto = document.createElement('button');
  pronto.type = 'button'; pronto.id = 'modo-pronto'; pronto.textContent = 'Pronto';
  pronto.addEventListener('click', () => fecharMenus(true));
  rod.appendChild(pronto);
  m.appendChild(rod);
}

// Escolher NAO fecha: o aluno escolhe dificuldade E estilo e toca em Pronto.
function escolherModo(tipo, id) {
  if (tipo === 'estilo' && id !== estiloEscolhido) {
    // O que foi conversado ate aqui era no estilo ANTERIOR: anota antes.
    try { anotarMemoria('texto'); } catch (_) {}
  }
  if (tipo === 'nivel') nivelEscolhido = id; else estiloEscolhido = id;
  $('menu-modo').querySelectorAll('[data-tipo="' + tipo + '"]').forEach(b => {
    const on = b.dataset.id === id;
    b.setAttribute('aria-checked', String(on));
    b.tabIndex = on ? 0 : -1;
  });
  pintarModo();
  gravarUrl();
  salvarPreferencias();
}

let modoAoAbrir = null;
function abrirMenuModo() {
  if (!NIVEIS.length || !ESTILOS.length) return;
  fecharMenus(false);
  modoAoAbrir = nivelEfetivo() + '|' + estiloEfetivo();
  montarMenuModo();
  $('menu-modo').hidden = false;
  $('veu').hidden = false;
  requestAnimationFrame(() => $('veu').classList.add('aberto'));
  $('btn-modo').setAttribute('aria-expanded', 'true');
  const sel = $('menu-modo').querySelector('[aria-checked="true"]:not(:disabled)') || $('modo-pronto');
  if (sel) sel.focus();
}

// "Agora: Intensivo · Encenação" no fio, cada um com seu icone. Aviso da
// PAGINA: nao entra no historico que vai para a IA.
function linhaDeSistema() {
  const partes = [];
  const n = dadosNivel(nivelEfetivo()), e = dadosEstilo(estiloEfetivo());
  if (personaAceita('niveis') && n) partes.push([iconeNivel(n.id), n.rotulo]);
  if (personaAceita('estilos') && e) partes.push([iconeEstilo(e.id), e.rotulo]);
  if (!partes.length) return;
  const p = document.createElement('p');
  p.dataset.quem = 'sistema';
  // Os espacos sao para o leitor de tela; na tela quem separa e o `gap`.
  p.appendChild(document.createTextNode('Agora: '));
  partes.forEach(([nome, rotulo], i) => {
    if (i) p.appendChild(document.createTextNode(' · '));
    const item = document.createElement('span');
    item.className = 'item';
    item.appendChild(icone(nome));
    item.appendChild(document.createTextNode(rotulo));
    p.appendChild(item);
  });
  if (estiloEfetivo() !== 'livre' && !chamada.ligado() && !chamada.pendente()) {
    const b = document.createElement('button');
    b.type = 'button';
    b.appendChild(icone('play'));
    b.appendChild(document.createTextNode('Começar'));
    b.addEventListener('click', () => {
      b.remove();
      if (chamada.ligado() || chamada.pendente() || gravando()) return;
      entrada.value = 'Vamos começar!';
      ajustarAltura();
      enviar();
    });
    p.appendChild(b);
  }
  $('fio-coluna').appendChild(p);
  rolar();
}

// Fecha os dois menus. `devolverFoco`: volta o foco para o botao que abriu.

$('btn-capivara').addEventListener('click', () => {

// ── O vídeo ──────────────────────────────────────────────────────────────────
// Quem decide qual clipe toca (parada, ouvindo, falando), quando baixa e
// quando para é o capy-presence.js, lendo o data-estado do #palco. Aqui so
// avisa que o estado mudou.
const sincronizarVideo = () => { if (window.CapyPresence) CapyPresence.sync(); };

// ── Modo leitura e teclado ───────────────────────────────────────────────────
// As falas ficam por cima da parte de baixo do palco. Quem rola para CIMA para
// reler ganha a tela inteira (a conversa cobre a capivara); chegar no fim ou
// tocar em "Voltar para a ..." devolve. Substitui o antigo painel "Nossa
// conversa" com botao de historico.
function modoLeitura(liga) {
  const estava = 'lendo' in document.body.dataset;
  if (liga === estava) return;
  if (liga) document.body.dataset.lendo = ''; else delete document.body.dataset.lendo;
  // O fio encolhe em .3s (transicao do padding): rola de novo no fim dela,
  // senao a ultima fala fica cortada embaixo.
  if (!liga) { requestAnimationFrame(rolar); setTimeout(rolar, 340); }
}
{
  const fio = $('fio');
  let ultimoGesto = 0, gestoSobe = false, toqueY = null;
  const gesto = sobe => {
    ultimoGesto = Date.now(); gestoSobe = sobe;
    if (sobe && fio.scrollHeight > fio.clientHeight + 4) modoLeitura(true);
  };
  fio.addEventListener('wheel', e => gesto(e.deltaY < 0), { passive: true });
  fio.addEventListener('touchstart', e => { toqueY = e.touches[0].clientY; }, { passive: true });
  fio.addEventListener('touchmove', e => {
    if (toqueY === null) return;
    const y = e.touches[0].clientY;
    if (Math.abs(y - toqueY) > 6) { gesto(y > toqueY); toqueY = y; }
  }, { passive: true });
  fio.addEventListener('keydown', e => { if (e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Home') gesto(true); });
  // So sai do modo leitura por gesto do ALUNO descendo ate o fim: a propria
  // troca de altura do fio dispara `scroll`, e sem essa guarda o modo piscava.
  fio.addEventListener('scroll', () => {
    if (!gestoSobe && Date.now() - ultimoGesto < 500 && noFim()) modoLeitura(false);
  }, { passive: true });
  $('voltar-palco').addEventListener('click', () => modoLeitura(false));
}

// Teclado aberto no celular: o rosto encolhe e as falas sobem, senao sobra uma
// fresta de conversa entre a capivara e o teclado. A altura cheia e a maior ja
// vista (no Android a janela inteira encolhe com o teclado; no iOS so o
// visualViewport).
let alturaCheia = window.innerHeight;
function medirTeclado() {
  alturaCheia = Math.max(alturaCheia, window.innerHeight);
  const vv = window.visualViewport;
  const visivel = vv ? vv.height : window.innerHeight;
  const aberto = document.activeElement === $('entrada') && visivel < alturaCheia * 0.75;
  if (aberto) document.body.dataset.digitando = ''; else delete document.body.dataset.digitando;
}
if (window.visualViewport) visualViewport.addEventListener('resize', medirTeclado);
window.addEventListener('resize', medirTeclado);
$('entrada').addEventListener('focus', () => setTimeout(medirTeclado, 300));
$('entrada').addEventListener('blur', medirTeclado);

// ── Medidor de voz ───────────────────────────────────────────────────────────
let ctxAudio = null, analisador = null, quadroVoz = 0;
function ligarMedidor() {
  if (analisador || semMovimento()) return;
  const fluxo = chamada.fluxo && chamada.fluxo();
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!fluxo || !AC) return;
  try {
    ctxAudio = new AC();
    if (ctxAudio.state === 'suspended') { try { ctxAudio.resume(); } catch (_) {} }
    const fonte = ctxAudio.createMediaStreamSource(fluxo);
    analisador = ctxAudio.createAnalyser();
    analisador.fftSize = 256;
    analisador.smoothingTimeConstant = .72;
    fonte.connect(analisador);
    const dados = new Uint8Array(analisador.frequencyBinCount);
    const barras = Array.prototype.slice.call($('medidor').children);
    const porBarra = Math.max(1, Math.floor((dados.length * 0.6) / barras.length));
    const passo = () => {
      if (!analisador) return;
      analisador.getByteFrequencyData(dados);
      for (let i = 0; i < barras.length; i++) {
        let soma = 0;
        for (let k = i * porBarra; k < (i + 1) * porBarra; k++) soma += dados[k];
        const nivel = Math.min(1, (soma / porBarra) / 130);
        barras[i].style.transform = 'scaleY(' + (0.1 + nivel * 0.9).toFixed(3) + ')';
      }
      quadroVoz = requestAnimationFrame(passo);
    };
    passo();
  } catch (_) { analisador = null; }
}
function desligarMedidor() {
  cancelAnimationFrame(quadroVoz);
  analisador = null;
  if (ctxAudio) { try { ctxAudio.close(); } catch (_) {} ctxAudio = null; }
  Array.prototype.forEach.call($('medidor').children, b => { b.style.transform = ''; });
}

// ── Sessão e histórico ───────────────────────────────────────────────────────
const sessao = (() => { try { return JSON.parse(localStorage.getItem('capySession') || '{}'); } catch (_) { return {}; } })();
const userId = (sessao && sessao.id) || 'guest';
const userName = (sessao && sessao.name) || 'Explorer';

// A ligação e o chat escrito compartilham o MESMO histórico: o aluno desliga,
// digita "como se escreve isso?" e ela sabe do que ele está falando.
const historia = [];

// ── Memória da Yara ──────────────────────────────────────────────────────────
// Quando uma conversa livre termina (desligou, trocou de capivara, saiu da
// página), o trecho NOVO do histórico vai para o servidor, que anota o que o
// aluno contou da vida dele e a Yara retoma na próxima conversa. Só o trecho
// novo: sem isso a mesma conversa seria lida duas vezes. O servidor é quem
// decide o que vale (persona, visitante, tamanho); a lista aqui só evita mandar
// cena e entrevista à toa. Cada fala vai cortada em 400 caracteres porque o
// sendBeacon não aceita mais que 64 KB.
const PERSONAS_COM_MEMORIA = ['conversa', 'maia'];
let memoriaEnviadaAte = 0;
function anotarMemoria(canal) {
  const novo = historia.slice(memoriaEnviadaAte);
  // Encenacao e exercicio (28/set) nao sao a vida do aluno: nao viram lembranca.
  // O servidor confere de novo; aqui so evita mandar a toa.
  const estilo = estiloEfetivo();
  const estiloGuarda = !ESTILOS.length || (dadosEstilo(estilo) || {}).memoria !== false;
  if (!estiloGuarda || !PERSONAS_COM_MEMORIA.includes(personaAtual) || !sessao.id || sessao.id === 'guest' || sessao.role === 'guest') {
    memoriaEnviadaAte = historia.length;
    return;
  }
  if (novo.filter(m => m.role === 'user').length < 3) return;
  memoriaEnviadaAte = historia.length;
  try {
    const transcricao = novo.slice(-80).map(m => ({ role: m.role, content: String(m.content || '').slice(0, 400) }));
    const corpo = JSON.stringify({ canal, persona: personaAtual, estilo, transcricao });
    const blob = new Blob([corpo], { type: 'application/json' });
    if (!(navigator.sendBeacon && navigator.sendBeacon('/api/lembrancas', blob))) {
      fetch('/api/lembrancas', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: corpo, keepalive: true, credentials: 'same-origin',
      }).catch(() => {});
    }
  } catch (_) { /* anotar é bônus: nunca atrapalha o aluno */ }
}
window.addEventListener('pagehide', () => anotarMemoria('texto'));

// ── A ligação ────────────────────────────────────────────────────────────────
const chamada = CapyChamada({
  aoEstado(e) {
    $('estado').textContent = ROTULOS[e] || e;
    $('palco').dataset.estado = e;
    $('btn-capivara').dataset.estado = e;   // a bolinha do avatar fica rosa quando ela fala
    sincronizarVideo();
    if (e === 'ouvindo') ligarMedidor();
    else if (e === 'desconectado') desligarMedidor();
    controles();
  },
  aoCota(minutos) {
    const c = $('cota');
    if (minutos == null) { c.textContent = ''; return; }
    const m = Math.max(0, Math.round(minutos));
    c.textContent = m + ' min';
    if (m <= 3) avisar('Você tem ' + m + ' min de voz neste mês. A chamada encerra sozinha quando acabar.');
  },
  aoFalaParcial(quem, texto, id) {
    const colado = noFim();
    escrever(linhaDe(quem, 'voz', id), texto);
    if (colado) rolar();
  },
  aoFala(quem, texto, id) {
    const colado = noFim();
    const reg = linhaDe(quem, 'voz', id);
    escrever(reg, texto);
    reg.p.classList.remove('viva');
    if (id) falas.delete(id);
    // Entra no histórico do chat escrito: é o que faz a conversa continuar
    // depois de desligar.
    historia.push({ role: quem === 'eu' ? 'user' : 'assistant', content: texto });
    if (colado) rolar();
  },
  aoUso() { $('cron').textContent = chamada.ligado() ? mmss(chamada.decorridoMs()) : ''; },
  aoErro(msg) { avisar(msg, true); controles(); },
  aoDesligar(motivo, dados) {
    registrarUso(dados.uso, dados.duracaoMs);
    anotarMemoria('voz');
    controles();
    $('cron').textContent = '';
    if (motivo === 'silencio') avisar('Encerrei depois de 3 minutos de silêncio.');
    else if (motivo === 'tempo') avisar('Encerrei no limite de 15 minutos.');
  },
});

// O custo é gravado SEMPRE, em todo desligamento, e por sendBeacon — que
// sobrevive ao unload. Até aqui só a entrevista.html gravava: uma conversa de
// voz comum queimava cota e não deixava rastro, então o teto mensal só enxergava
// metade do gasto real.
function registrarUso(uso, duracaoMs) {
  try {
    // No admin o uso aparece como "travel:encenacao:intensivo" quando o aluno
    // escolheu nivel ou estilo. Sem escolha, so a persona, como sempre foi.
    const n = nivelEfetivo(), e = estiloEfetivo();
    const cenario = n === 'auto' && e === 'livre' ? personaAtual : [personaAtual, e, n].join(':');
    const corpo = JSON.stringify({ cenario, uso, duracaoMs });
    const blob = new Blob([corpo], { type: 'application/json' });
    if (!(navigator.sendBeacon && navigator.sendBeacon('/api/conversa-uso', blob))) {
      fetch('/api/conversa-uso', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: corpo, keepalive: true,
      }).catch(() => {});
    }
  } catch (_) { /* medir é bônus: nunca atrapalha o aluno */ }
}

// ── Controles ────────────────────────────────────────────────────────────────
function controles() {
  const ligado = chamada.ligado(), pendente = chamada.pendente();
  const emChamada = ligado || pendente;
  const rec = gravando(), transc = gravacao.transcrevendo;
  const temTexto = !!$('entrada').value.trim();

  const b = $('ligar');
  b.className = 'acao' + (emChamada ? ' desligar' : '');
  b.setAttribute('aria-label', emChamada ? 'Encerrar a chamada' : 'Ligar para a Yara');
  b.title = emChamada ? 'Encerrar' : 'Ligar';
  b.querySelector('.ic-ligar').hidden = emChamada;
  b.querySelector('.ic-desligar').hidden = !emChamada;
  b.disabled = rec || transc;

  // A ponta direita e UM lugar so: microfone com a caixa vazia, seta de enviar
  // com texto — o padrao do WhatsApp. Na ligacao os dois somem: o aluno fala.
  const g = $('gravar');
  g.hidden = emChamada || (temTexto && !rec);
  g.className = 'acao' + (rec ? ' gravando' : '');
  g.setAttribute('aria-label', rec ? 'Parar e enviar o áudio' : 'Gravar um áudio');
  g.title = rec ? 'Parar e enviar' : 'Gravar um áudio';
  g.querySelector('.ic-mic').hidden = rec;
  g.querySelector('.ic-parar').hidden = !rec;
  g.disabled = transc;
  $('btn-enviar').hidden = emChamada || rec || !temTexto;

  // Digitar no meio de uma ligacao de voz nao tem semantica: a sessao Realtime
  // nao recebe o texto. Desabilitar e mais honesto que aceitar e engolir.
  $('entrada').disabled = emChamada || rec || transc;
  // Durante ligacao ou audio nao se troca capivara nem modo. O botao do topo
  // NAO fica `disabled`: a regra global apagaria o estado e o cronometro da
  // ligacao, que moram nele. Fica "travado" (aria-disabled) e explica no toque.
  const ocupado = emChamada || rec || transc;
  $('btn-modo').disabled = ocupado || !NIVEIS.length;
  const capi = $('btn-capivara');
  capi.classList.toggle('travado', ocupado || PERSONAS.length < 2);
  if (ocupado) capi.setAttribute('aria-disabled', 'true'); else capi.removeAttribute('aria-disabled');
  if (ocupado) fecharMenus(false);
  document.querySelector('.caixa').classList.toggle('gravando', rec);
  document.querySelector('.caixa').classList.toggle('transcrevendo', !!transc);

  const mudo = $('silenciar');
  mudo.hidden = !ligado;
  mudo.setAttribute('aria-pressed', String(chamada.mudo()));
  mudo.className = 'acao' + (chamada.mudo() ? ' desligar' : '');
  mudo.title = chamada.mudo() ? 'Ativar o microfone' : 'Silenciar';
  pintarChamariz();
}

$('silenciar').addEventListener('click', () => { chamada.silenciar(!chamada.mudo()); controles(); });

$('ligar').addEventListener('click', async () => {
  if (chamada.ligado() || chamada.pendente()) { chamada.desligar(); return; }
  if (gravando() || gravacao.transcrevendo) return;
  avisar('');
  fecharMenus(false);
  controles();
  // Nivel e estilo sao ids de lista fechada: o servidor valida e monta o prompt.
  const ok = await chamada.ligar({ cenario: personaAtual, lang: 'en', nivel: nivelEfetivo(), estilo: estiloEfetivo() });
  controles();
  if (ok) avisar('Você está falando com uma IA. Fale no seu ritmo — toque no telefone vermelho para encerrar.');
});


// ── Mandar áudio ─────────────────────────────────────────────────────────────
// O microfone GRAVA e manda a fala como mensagem, transcrita pelo mesmo
// /api/transcribe das aulas. A ligacao ao vivo e o botao de telefone.
//
// Nao usa o CapyMic do components.js: aquele pesa 106 KB e a trava dele e de
// 15s, feita para frase curta do Speak step (desde 23/set ela para e entrega o
// texto; antes descartava). Mensagem de chat e mais longa: aqui a trava e de
// 60s e tambem PARA e ENVIA.
const GRAVA_MAX_MS = 60000;
const gravacao = { stream: null, rec: null, partes: [], inicio: 0, relogio: 0, trava: 0, cancelada: false, transcrevendo: false };
const gravando = () => !!(gravacao.rec && gravacao.rec.state === 'recording');

function pintarRelogio() {
  const s = Math.floor((Date.now() - gravacao.inicio) / 1000);
  const falta = Math.max(0, Math.round((GRAVA_MAX_MS - (Date.now() - gravacao.inicio)) / 1000));
  $('gravacao-txt').textContent = 'Gravando ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') +
    (falta <= 10 ? ' \u00b7 envia sozinho em ' + falta + 's' : '');
}

async function comecarGravacao() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    toast('Este navegador n\u00e3o grava \u00e1udio. Escreva a mensagem.'); return;
  }
  try { gravacao.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (_) { toast('Permita o microfone para mandar \u00e1udio.'); return; }
  const tipo = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(x => MediaRecorder.isTypeSupported(x)) || '';
  gravacao.rec = new MediaRecorder(gravacao.stream, tipo ? { mimeType: tipo } : undefined);
  gravacao.partes = []; gravacao.cancelada = false;
  gravacao.rec.ondataavailable = e => { if (e.data && e.data.size) gravacao.partes.push(e.data); };
  gravacao.rec.onstop = aoPararGravacao;
  gravacao.rec.start();
  gravacao.inicio = Date.now();
  gravacao.relogio = setInterval(pintarRelogio, 250);
  gravacao.trava = setTimeout(() => pararGravacao(false), GRAVA_MAX_MS);
  pintarRelogio();
  controles();
}

function pararGravacao(cancelar) {
  if (!gravacao.rec) return;
  gravacao.cancelada = !!cancelar;
  clearTimeout(gravacao.trava); clearInterval(gravacao.relogio);
  if (gravacao.rec.state !== 'inactive') gravacao.rec.stop();
}

async function aoPararGravacao() {
  const rec = gravacao.rec, partes = gravacao.partes, cancelada = gravacao.cancelada;
  if (gravacao.stream) gravacao.stream.getTracks().forEach(x => x.stop());
  gravacao.stream = null; gravacao.rec = null;
  if (cancelada || !partes.length) { controles(); return; }
  const tipo = (rec && rec.mimeType) || 'audio/webm';
  gravacao.transcrevendo = true;
  $('gravacao-txt').textContent = 'Transcrevendo\u2026';
  controles();
  let texto = '';
  try { texto = await transcrever(new Blob(partes, { type: tipo }), tipo); }
  catch (e) { toast(e.message || 'N\u00e3o consegui entender o \u00e1udio.'); }
  gravacao.transcrevendo = false;
  controles();
  if (!texto.trim()) { if (!document.getElementById('toast').hidden) return; toast('N\u00e3o ouvi nada. Tente de novo.'); return; }
  entrada.value = texto.trim();
  ajustarAltura();
  enviar('voz');
}

async function transcrever(blob, tipo) {
  const base64 = await new Promise((ok, falha) => {
    const r = new FileReader();
    r.onloadend = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = falha;
    r.readAsDataURL(blob);
  });
  // A lingua em que o ALUNO fala com esta capivara: a francesa transcreve
  // frances; a Maia e a de iniciantes, que recebem portugues, detectam sozinhas
  // (escuta null) — forcar ingles embaralhava o portugues do aluno.
  // Total iniciante / iniciante (28/set): o aluno fala portugues, entao tambem
  // detecta sozinho, com qualquer capivara.
  const p = dadosDaPersona(personaAtual);
  const nivelPt = (dadosNivel(nivelEfetivo()) || {}).portugues === true;
  const escuta = nivelPt ? null
    : p && Object.prototype.hasOwnProperty.call(p, 'escuta') ? p.escuta : ((p && p.lang) || 'en');
  const r = await fetch('/api/transcribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify(escuta ? { audioBase64: base64, mimeType: tipo, lang: escuta } : { audioBase64: base64, mimeType: tipo }),
  });
  const d = await r.json().catch(() => ({}));
  // O servidor manda o CODIGO em `error` e o texto para humano em `message`.
  if (!r.ok || d.error) throw new Error(d.message || 'N\u00e3o consegui entender o \u00e1udio.');
  return d.text || '';
}

$('gravar').addEventListener('click', () => {
  if (gravacao.transcrevendo) return;
  if (gravando()) pararGravacao(false); else { fecharMenus(false); comecarGravacao(); }
});
$('cancelar-gravacao').addEventListener('click', () => pararGravacao(true));
// Sair da pagina gravando: solta o microfone (a luz vermelha do navegador apaga).
window.addEventListener('pagehide', () => pararGravacao(true));

// ── Enviar texto ─────────────────────────────────────────────────────────────
const entrada = $('entrada');
function ajustarAltura() {
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(entrada.scrollHeight, 144) + 'px';
}
entrada.addEventListener('input', () => { ajustarAltura(); controles(); });
entrada.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('compositor').requestSubmit(); }
});
$('compositor').addEventListener('submit', e => { e.preventDefault(); enviar(); });

async function enviar(canal) {
  const texto = entrada.value.trim();
  if (!texto || chamada.ligado() || chamada.pendente() || gravando()) return;
  entrada.value = '';
  ajustarAltura();
  controles();
  dizer('eu', canal === 'voz' ? 'voz' : 'texto', texto);
  historia.push({ role: 'user', content: texto });
  pensando(true);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ message: texto, userId, persona: personaAtual, nivel: nivelEfetivo(), estilo: estiloEfetivo(), history: historia.slice(-10) }),
    });
    const d = await r.json();
    const resposta = d.reply || d.message
      || (d.candidates && d.candidates[0] && d.candidates[0].content
          && d.candidates[0].content.parts && d.candidates[0].content.parts[0]
          && d.candidates[0].content.parts[0].text)
      || 'Não consegui responder agora. Tenta de novo?';
    pensando(false);
    dizer('ia', 'texto', resposta);
    // No chat escrito ela tambem "responde" no palco: o clipe falando toca pelo
    // tempo de leitura da resposta. E o uso mais comum da pagina.
    if (window.CapyPresence) CapyPresence.falarTexto(resposta);
    historia.push({ role: 'assistant', content: resposta });
  } catch (_) {
    pensando(false);
    dizer('ia', 'texto', 'Não consegui responder agora. Tenta de novo?');
  }
}

// ── Início ───────────────────────────────────────────────────────────────────
(async function iniciar() {
  aplicarPersona(personaInicial(), false);
  controles();

  try {
    const r = await fetch('/api/personas', { credentials: 'same-origin' });
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d.personas) && d.personas.length) {
        PERSONAS = d.personas;
        NIVEIS = Array.isArray(d.niveis) ? d.niveis : [];
        ESTILOS = Array.isArray(d.estilos) ? d.estilos : [];
        APELIDOS = Array.isArray(d.apelidos) ? d.apelidos : [];
        if (NIVEIS.length && ESTILOS.length) carregarModo();
        const pedida = (() => { try { return new URLSearchParams(location.search).get('persona') || (window.Store && Store.state && Store.state.aiPersona) || ''; } catch (_) { return ''; } })();
        aplicarPersona(personaInicial(), false);
        // Link antigo (?persona=iniciante) ou preferencia antiga: a URL e o Store
        // passam a mostrar o que vale agora (Yara + Total iniciante).
        if (APELIDOS.some(a => a.id === pedida)) { gravarUrl(); salvarPreferencias(); }
        else if (modoCarregado) gravarUrl();
      }
    }
  } catch (_) { /* sem menu, mas a página funciona */ }
  controles();

  // Mensagem escrita na home, entregue por sessionStorage. Consumida na leitura
  // (removeItem antes de usar): recarregar não reenvia a mesma frase.
  let primeira = '';
  try {
    primeira = sessionStorage.getItem('capyPrimeiraMensagem') || '';
    sessionStorage.removeItem('capyPrimeiraMensagem');
  } catch (_) { primeira = ''; }

  // Quem ainda nao descobriu o menu (o botao do topo esta pulsando) ganha a dica.
  const dicaCapivara = $('btn-capivara').classList.contains('chamar')
    ? '\nPara trocar de capivara, toque no meu nome lá em cima.' : '';
  dizer('ia', 'texto', 'Oi, ' + userName + '! Pode me escrever, mandar um áudio ou me ligar.' + dicaCapivara);

  if (primeira) {
    entrada.value = primeira.slice(0, 300);
    ajustarAltura(); controles();
    setTimeout(enviar, 500);
  }
})();
</script>

<script>
// Volta para a página anterior sem depender do estado do history.
// history.length pode vir 0, e a guarda de login reempurra a pessoa pra frente
// quando o back cai numa página protegida.
function capyVoltar() {
  var casa = '6_Home_Forest_Expedition.html';
  var inicio = location.href;
  var destino = casa;
  try {
    var ref = document.referrer;
    if (ref && new URL(ref).origin === location.origin && ref !== inicio) destino = ref;
  } catch (e) {}
  if (history.length > 1) {
    history.back();
    setTimeout(function () { if (location.href === inicio) location.href = destino; }, 400);
  } else {
    location.href = destino;
  }
}
</script>
