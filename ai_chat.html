<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Yara AI — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{navy:'#001f3f'},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>
* { font-family: 'Plus Jakarta Sans', sans-serif; }
html, body { height: 100%; overflow: hidden; background: #000; }

/* Speech bubble tail */
#speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 20px;
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 5px solid transparent;
  border-top: 13px solid rgba(255,255,255,.95);
}

#speech-bubble { transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }

/* Typing dots */
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
.dot { width:7px; height:7px; border-radius:50%; background:#cbd5e1; display:inline-block; }
.dot:nth-child(1){ animation:bounce .9s ease infinite 0s }
.dot:nth-child(2){ animation:bounce .9s ease infinite .15s }
.dot:nth-child(3){ animation:bounce .9s ease infinite .3s }

/* Mic wave */
@keyframes wave { 0%,100%{height:5px} 50%{height:18px} }
.wave-bar { width:3px; border-radius:99px; background:white; animation:wave .5s ease-in-out infinite; }

/* Pill entrance */
@keyframes pillIn { from{opacity:0;transform:translateY(8px) scale(.94)} to{opacity:1;transform:none} }
.pill-in { animation: pillIn .22s ease forwards; }

/* Input */
#chat-input:focus { outline: none; }
#chat-input { background: transparent; }
#chat-input::placeholder { color: rgba(255,255,255,.45); }
</style>
</head>
<body>

<!-- ── FULL SCREEN VIDEO ─────────────────────────────────────────────────────── -->
<video id="yara-video" autoplay loop muted playsinline
       class="fixed inset-0 w-full h-full object-cover object-top z-0">
  <source src="yara-chat.mp4" type="video/mp4"/>
</video>

<!-- Fallback image -->
<img id="yara-fallback" src="yara-avatar.png" alt="Yara"
     class="fixed inset-0 w-full h-full object-cover object-top z-0 hidden"
     onerror="this.src='yara.svg'"/>

<!-- ── TOP GRADIENT ──────────────────────────────────────────────────────────── -->
<div class="fixed top-0 left-0 right-0 h-28 z-10 pointer-events-none"
     style="background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 100%)"></div>

<!-- ── TOP BAR ───────────────────────────────────────────────────────────────── -->
<div class="fixed top-0 left-0 right-0 z-20 flex items-center justify-between px-4 pt-3 pb-2">
  <button onclick="history.length>1?history.back():location.href='6_Home_Forest_Expedition.html'"
          class="w-8 h-8 rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center active:scale-90 transition-all">
    <span class="material-symbols-outlined text-white" style="font-size:18px">arrow_back</span>
  </button>

  <div class="flex items-center gap-2 bg-white/10 backdrop-blur-md rounded-full px-3 py-1.5">
    <div class="relative">
      <img src="yara-avatar.png" alt="Yara" class="w-6 h-6 rounded-full object-cover" onerror="this.src='yara.svg'"/>
      <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 bg-emerald-400 rounded-full border border-black/30"></span>
    </div>
    <p class="text-white font-black text-xs">Yara AI</p>
    <span class="text-emerald-300 text-[10px] font-bold">• online</span>
  </div>

  <div class="w-8"></div>
</div>

<!-- ── SPEECH BUBBLE ─────────────────────────────────────────────────────────── -->
<div id="speech-bubble" class="fixed left-4 right-4 z-20 opacity-0 scale-95 pointer-events-none"
     style="bottom:140px; max-width:300px;">
  <div class="relative bg-white/95 backdrop-blur-md rounded-2xl rounded-bl-sm shadow-2xl px-4 py-3">
    <div id="typing-dots" class="flex items-center gap-1.5 py-0.5 hidden">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <p id="bubble-text" class="text-navy font-semibold text-sm leading-relaxed hidden"></p>
  </div>
</div>

<!-- ── USER PILL ─────────────────────────────────────────────────────────────── -->
<div id="user-pill" class="fixed right-4 z-20 hidden" style="bottom:140px;">
  <div class="bg-pink-500/90 backdrop-blur-md text-white rounded-2xl rounded-br-sm px-4 py-2.5 text-sm font-bold shadow-xl max-w-[220px]">
    <p id="user-pill-text" class="leading-snug"></p>
  </div>
</div>

<!-- ── MIC OVERLAY ───────────────────────────────────────────────────────────── -->
<div id="mic-wave" class="fixed inset-0 z-30 items-center justify-center hidden" style="background:rgba(0,0,0,.5);">
  <div class="bg-black/70 backdrop-blur-xl rounded-3xl px-10 py-8 flex flex-col items-center gap-4 border border-white/10">
    <div class="flex items-end gap-1.5 h-8">
      <div class="wave-bar" style="animation-delay:0s"></div>
      <div class="wave-bar" style="animation-delay:.1s"></div>
      <div class="wave-bar" style="animation-delay:.2s"></div>
      <div class="wave-bar" style="animation-delay:.05s"></div>
      <div class="wave-bar" style="animation-delay:.15s"></div>
    </div>
    <p class="text-white font-black text-sm">Ouvindo...</p>
    <button onclick="stopMic()" class="mt-2 w-12 h-12 bg-red-500 rounded-full flex items-center justify-center active:scale-90 transition-all">
      <span class="material-symbols-outlined text-white" style="font-size:22px">mic_off</span>
    </button>
  </div>
</div>

<!-- ── BOTTOM GRADIENT ───────────────────────────────────────────────────────── -->
<div class="fixed bottom-0 left-0 right-0 h-48 z-10 pointer-events-none"
     style="background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.3) 50%,transparent 100%)"></div>

<!-- ── BOTTOM BAR ────────────────────────────────────────────────────────────── -->
<div class="fixed bottom-0 left-0 right-0 z-20 px-4 pb-8 pt-2">
  <!-- Action row: mic + input + send + call -->
  <div class="flex items-center gap-2.5">

    <!-- Mic button -->
    <button id="mic-btn" onclick="startMic()"
            class="w-11 h-11 rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center active:scale-90 transition-all flex-shrink-0">
      <span class="material-symbols-outlined text-white" style="font-size:20px;font-variation-settings:'FILL' 1">mic</span>
    </button>

    <!-- Text input -->
    <div class="flex-1 flex items-center bg-white/15 backdrop-blur-md rounded-full px-4 py-2.5 gap-2">
      <input id="chat-input" type="text" placeholder="Escreva para Yara..."
             class="flex-1 text-white text-sm font-medium min-w-0"
             onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button onclick="sendMessage()"
              class="w-7 h-7 rounded-full bg-pink-500 flex items-center justify-center active:scale-90 transition-all flex-shrink-0">
        <span class="material-symbols-outlined text-white" style="font-size:15px;font-variation-settings:'FILL' 1">arrow_upward</span>
      </button>
    </div>

    <!-- Call button -->
    <button onclick="startCall()"
            class="w-11 h-11 rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center active:scale-90 transition-all flex-shrink-0">
      <span class="material-symbols-outlined text-white" style="font-size:20px;font-variation-settings:'FILL' 1">call</span>
    </button>

  </div>
</div>

<!-- ── TOAST ─────────────────────────────────────────────────────────────────── -->
<div id="toast" class="fixed bottom-36 left-1/2 -translate-x-1/2 z-50 hidden">
  <div class="bg-black/80 backdrop-blur-xl text-white text-xs font-bold px-4 py-2 rounded-full">
    <span id="toast-msg"></span>
  </div>
</div>

<script src="store.js"></script>
<script src="auth.js"></script>
<script>
// ── Helpers ────────────────────────────────────────────────────────────────────
function showBubble(text, isTyping) {
  const bubble = document.getElementById('speech-bubble');
  const dots   = document.getElementById('typing-dots');
  const txt    = document.getElementById('bubble-text');
  const pill   = document.getElementById('user-pill');
  pill.classList.add('hidden');
  if (isTyping) {
    dots.classList.remove('hidden'); txt.classList.add('hidden');
  } else {
    dots.classList.add('hidden'); txt.classList.remove('hidden');
    txt.textContent = text;
  }
  bubble.style.opacity = '0'; bubble.style.transform = 'scale(.95)';
  bubble.classList.remove('hidden');
  requestAnimationFrame(() => {
    bubble.style.opacity = '1'; bubble.style.transform = 'scale(1)';
  });
}

function hideBubble() {
  const bubble = document.getElementById('speech-bubble');
  bubble.style.opacity = '0'; bubble.style.transform = 'scale(.95)';
}

function showUserPill(text) {
  hideBubble();
  const pill = document.getElementById('user-pill');
  document.getElementById('user-pill-text').textContent = text;
  pill.classList.remove('hidden');
  pill.classList.add('pill-in');
  setTimeout(() => pill.classList.remove('pill-in'), 300);
}

function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.add('hidden'), dur);
}

// ── Video fallback ─────────────────────────────────────────────────────────────
const vid = document.getElementById('yara-video');
vid.addEventListener('error', () => {
  vid.classList.add('hidden');
  document.getElementById('yara-fallback').classList.remove('hidden');
});

// ── Session / user ─────────────────────────────────────────────────────────────
const session = JSON.parse(localStorage.getItem('capySession') || '{}');
const userId  = session?.id || 'guest';
const userName = session?.name || 'Explorer';

// ── Chat history ───────────────────────────────────────────────────────────────
const history = [];

// ── Greeting ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    showBubble(`Olá, ${userName}! 🐾 I'm Yara — ask me anything in English!`, false);
  }, 600);
});

// ── Send message ───────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  showUserPill(text);
  history.push({ role: 'user', content: text });
  setTimeout(() => showBubble('', true), 400);

  try {
    const res  = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, userId, history: history.slice(-8) })
    });
    const data = await res.json();
    const reply = data.reply || data.message || '...';
    history.push({ role: 'assistant', content: reply });
    showBubble(reply, false);
  } catch {
    showBubble('Ops! Tente novamente. 😅', false);
  }
}

// ── Mic ────────────────────────────────────────────────────────────────────────
let mediaRecorder, audioChunks = [];

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      document.getElementById('mic-wave').style.display = 'none';
      showToast('🎙️ Processando áudio...');
      // Transcription would go here via /api/transcribe
      showBubble('Funcionalidade de voz em breve! 🎤', false);
    };
    mediaRecorder.start();
    document.getElementById('mic-wave').style.display = 'flex';
  } catch {
    showToast('⚠️ Microfone não disponível');
  }
}

function stopMic() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  document.getElementById('mic-wave').style.display = 'none';
}

// ── Call ───────────────────────────────────────────────────────────────────────
function startCall() {
  showToast('📞 Chamada de voz em breve!');
}
</script>
</body>
</html>
