<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Word Match — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "navy":        "#001f3f",
          "navy-light":  "#002d5c",
          "pink-brand":  "#ec4899",
          "green-brand": "#10b981",
        },
        fontFamily: {
          "headline": ["Plus Jakarta Sans"],
          "body":     ["Be Vietnam Pro"],
          "label":    ["Lexend"]
        },
        borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .tile-correct  { animation: correctPulse 0.45s ease; }
  .tile-wrong    { animation: wrongShake 0.4s ease; }
  @keyframes correctPulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(16,185,129,.4); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    60%     { transform: translateX(8px); }
  }
</style>
</head>
<body class="bg-navy font-body text-white min-h-screen overflow-x-hidden">

<!-- Top Nav -->
<div id="top-nav-placeholder"></div>
<div id="side-nav-placeholder"></div>

<main class="md:pl-32 pt-28 pb-20 px-4 flex flex-col items-center gap-8 max-w-3xl mx-auto">

  <!-- Header -->
  <div class="w-full flex flex-col items-center gap-2 text-center">
    <span class="font-label text-green-brand text-sm font-bold uppercase tracking-widest">Mini-Game</span>
    <h1 class="font-headline text-5xl md:text-6xl font-black text-white">Word Match</h1>
    <p class="font-body text-slate-400 text-lg">Tap the image that matches the word!</p>
  </div>

  <!-- Stats bar -->
  <div class="w-full flex items-center justify-between bg-white/5 rounded-2xl px-6 py-4 border border-white/10">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-pink-brand text-2xl" style="font-variation-settings:'FILL' 1;">stars</span>
      <span id="score-display" class="font-headline font-black text-2xl text-white">0</span>
      <span class="font-label text-slate-400 text-sm">pts</span>
    </div>
    <div id="progress-display" class="font-label text-slate-400 text-sm font-bold">Round 1 / 6</div>
    <div id="hearts-display" class="flex gap-1"></div>
  </div>

  <!-- Target word card -->
  <div class="w-full bg-white/5 backdrop-blur-md rounded-[2rem] border border-white/10 p-8 flex flex-col items-center gap-3">
    <span class="font-label text-slate-400 text-xs uppercase tracking-widest">What does this word mean?</span>
    <h2 id="target-word" class="font-headline text-6xl md:text-7xl font-black text-white tracking-tight"></h2>
    <p id="target-pron" class="font-body text-pink-brand text-xl"></p>
  </div>

  <!-- Image tiles grid -->
  <div id="tiles-grid" class="w-full grid grid-cols-2 gap-4"></div>

  <!-- Feedback bar (hidden until answer) -->
  <div id="feedback-bar"
       class="w-full rounded-2xl px-8 py-5 flex items-center gap-4 text-lg font-label font-bold
              opacity-0 transition-opacity duration-300 pointer-events-none">
    <span id="feedback-icon" class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1;"></span>
    <span id="feedback-text"></span>
  </div>

</main>

<!-- Completion overlay (injected by JS) -->

<div id="mobile-nav-placeholder"></div>
<div id="footer-placeholder"></div>

<script src="store.js"></script>
<script src="levelup-overlay.js"></script>
<script src="badge-toast.js"></script>
<script src="components.js?v=2"></script>
<script>
  Components.mount('top-nav-placeholder', Components.renderTopNav('games'));
  Components.mount('side-nav-placeholder', Components.renderSideNav('games'));
  Components.mount('mobile-nav-placeholder', Components.renderMobileNav('games'));
  Components.mount('footer-placeholder', Components.renderFooter());

  // ── Game data (word + image pairs) ──────────────────────────────────────
  const CARDS = [
    { word: "Apple",    pron: "/ˈæp.əl/",      image: "", emoji: "🍎" },
    { word: "River",    pron: "/ˈrɪv.ər/",      image: "", emoji: "🌊" },
    { word: "Sun",      pron: "/sʌn/",           image: "", emoji: "☀️" },
    { word: "Mountain", pron: "/ˈmaʊn.tən/",    image: "", emoji: "⛰️" },
    { word: "Bird",     pron: "/bɜːrd/",         image: "", emoji: "🐦" },
    { word: "Tree",     pron: "/triː/",           image: "", emoji: "🌲" },
    { word: "Water",    pron: "/ˈwɔː.tər/",      image: "", emoji: "💧" },
    { word: "Flower",   pron: "/ˈflaʊ.ər/",      image: "", emoji: "🌸" },
    { word: "Fire",     pron: "/faɪər/",          image: "", emoji: "🔥" },
    { word: "Rain",     pron: "/reɪn/",           image: "", emoji: "🌧️" },
    { word: "Cat",      pron: "/kæt/",            image: "", emoji: "🐱" },
    { word: "Dog",      pron: "/dɒɡ/",            image: "", emoji: "🐶" },
    { word: "House",    pron: "/haʊs/",           image: "", emoji: "🏠" },
    { word: "Book",     pron: "/bʊk/",            image: "", emoji: "📚" },
    { word: "Star",     pron: "/stɑːr/",          image: "", emoji: "⭐" },
    { word: "Fish",     pron: "/fɪʃ/",            image: "", emoji: "🐟" },
  ];

  const TOTAL_ROUNDS = 6;
  const MAX_LIVES    = 3;

  let lives         = MAX_LIVES;
  let score         = 0;
  let round         = 0;
  let roundOrder    = [];   // shuffled indices of CARDS for this game
  let correctIdx    = -1;   // index in CARDS of the correct answer this round
  let waitingNext   = false;

  // ── Utilities ────────────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick4(correctCardIdx) {
    // Pick 3 distractors from the other cards
    const others = shuffle(CARDS.map((_, i) => i).filter(i => i !== correctCardIdx));
    const picks = [correctCardIdx, ...others.slice(0, 3)];
    return shuffle(picks);
  }

  // ── Render helpers ───────────────────────────────────────────────────────
  function renderHearts() {
    document.getElementById('hearts-display').innerHTML =
      Array.from({ length: MAX_LIVES }, (_, i) =>
        `<span class="material-symbols-outlined text-xl ${i < lives ? 'text-red-400' : 'text-white/20'}"
               style="${i < lives ? "font-variation-settings:'FILL' 1;" : ''}">favorite</span>`
      ).join('');
  }

  function renderRound() {
    if (round >= TOTAL_ROUNDS) { finishGame(); return; }

    waitingNext = false;
    correctIdx = roundOrder[round];
    const card = CARDS[correctIdx];
    const tileIndices = pick4(correctIdx);

    document.getElementById('target-word').textContent = card.word;
    document.getElementById('target-pron').textContent = card.pron;
    document.getElementById('progress-display').textContent = `Round ${round + 1} / ${TOTAL_ROUNDS}`;
    hideFeedback();

    document.getElementById('tiles-grid').innerHTML = tileIndices.map(idx => {
      const c = CARDS[idx];
      return `
        <button data-idx="${idx}"
                onclick="handleTile(this)"
                class="relative aspect-square rounded-[2rem] overflow-hidden border-4 border-white/10
                       hover:border-pink-brand hover:scale-[1.03] active:scale-95
                       transition-all duration-200 shadow-xl group">
          ${c.image
            ? `<img src="${c.image}" alt="${c.word}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"/>`
            : `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-navy-light to-navy text-7xl group-hover:scale-105 transition-transform duration-300">${c.emoji||'📖'}</div>`}
          <div class="absolute inset-0 bg-gradient-to-t from-navy/80 to-transparent"></div>
        </button>`;
    }).join('');
  }

  function showFeedback(correct, word) {
    const bar  = document.getElementById('feedback-bar');
    const icon = document.getElementById('feedback-icon');
    const text = document.getElementById('feedback-text');

    if (correct) {
      bar.className  = bar.className.replace(/bg-\S+/g, '').trim();
      bar.classList.add('bg-green-brand/20', 'border', 'border-green-brand/40');
      icon.textContent = 'check_circle';
      icon.className   = icon.className.replace(/text-\S+/g, 'text-green-brand');
      text.textContent = `Correct! That's "${word}"! +10 pts 🎉`;
    } else {
      bar.className  = bar.className.replace(/bg-\S+/g, '').trim();
      bar.classList.add('bg-red-500/20', 'border', 'border-red-500/40');
      icon.textContent = 'cancel';
      icon.className   = icon.className.replace(/text-\S+/g, 'text-red-400');
      text.textContent = `Not quite! The answer was "${word}". Try again!`;
    }
    bar.style.opacity = '1';
    bar.style.pointerEvents = 'auto';
  }

  function hideFeedback() {
    const bar = document.getElementById('feedback-bar');
    bar.style.opacity = '0';
    bar.style.pointerEvents = 'none';
  }

  // ── Game logic ───────────────────────────────────────────────────────────
  function handleTile(btn) {
    if (waitingNext) return;
    waitingNext = true;

    const chosenIdx = parseInt(btn.dataset.idx, 10);
    const isCorrect = chosenIdx === correctIdx;
    const correctCard = CARDS[correctIdx];

    // Disable all tiles
    document.querySelectorAll('#tiles-grid button').forEach(b => b.disabled = true);

    if (isCorrect) {
      score += 10;
      document.getElementById('score-display').textContent = score;
      btn.classList.add('tile-correct');
      btn.style.borderColor = '#10b981';
      showFeedback(true, correctCard.word);
      round++;
    } else {
      lives = Math.max(0, lives - 1);
      renderHearts();
      btn.classList.add('tile-wrong');
      btn.style.borderColor = '#ef4444';
      // Highlight correct answer
      document.querySelectorAll('#tiles-grid button').forEach(b => {
        if (parseInt(b.dataset.idx, 10) === correctIdx) {
          b.style.borderColor = '#10b981';
        }
      });
      showFeedback(false, correctCard.word);
      if (lives <= 0) {
        setTimeout(finishGame, 1200);
        return;
      }
      round++;
    }

    setTimeout(renderRound, 1400);
  }

  function finishGame() {
    const xpEarned = score;
    if (window.Store) {
      Store.addXP(xpEarned);
      Store.activateStreak();
      if (score >= 40) Store.unlockBadge('game_hero');
      Store.completeActivity('games');
    }

    const stars = score >= 50 ? 3 : score >= 30 ? 2 : 1;
    const starHTML = Array.from({ length: 3 }, (_, i) =>
      `<span class="material-symbols-outlined text-4xl ${i < stars ? 'text-yellow-400' : 'text-white/20'}"
             style="${i < stars ? "font-variation-settings:'FILL' 1;" : ''}">star</span>`
    ).join('');

    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
    overlay.innerHTML = `
      <div class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-pink-brand/60
                  rounded-[3rem] px-12 py-12 flex flex-col items-center gap-6 shadow-2xl
                  text-center max-w-sm mx-4 scale-0 opacity-0 transition-all duration-500"
           id="finish-card">
        <div class="w-24 h-24 rounded-full bg-pink-brand flex items-center justify-center shadow-lg shadow-pink-500/40">
          <span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings:'FILL' 1;">sports_esports</span>
        </div>
        <div>
          <p class="font-label text-pink-brand font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
          <h2 class="font-headline text-5xl font-black text-white mb-1">+${xpEarned} XP</h2>
          <p class="font-body text-slate-300">Score: <span class="text-white font-bold">${score} pts</span></p>
        </div>
        <div class="flex gap-2">${starHTML}</div>
        ${score >= 40 ? `<div class="bg-green-brand/20 border border-green-brand/30 rounded-2xl px-6 py-3">
          <p class="font-label text-green-brand text-sm font-bold">🏅 Badge Unlocked: Game Hero!</p>
        </div>` : ''}
        <div class="flex gap-3 flex-wrap justify-center">
          <button onclick="startGame()"
                  class="bg-white/10 hover:bg-white/20 text-white font-label font-bold
                         px-8 py-3 rounded-full text-base active:scale-95 transition-all border border-white/20">
            Play Again
          </button>
          <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
                  class="bg-pink-brand hover:bg-pink-600 text-white font-label font-bold
                         px-8 py-3 rounded-full text-base active:scale-95 transition-all shadow-lg shadow-pink-500/30">
            Back to Games
          </button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const card = document.getElementById('finish-card');
      card.style.transform = 'scale(1)';
      card.style.opacity   = '1';
      overlay.addEventListener('click', e => {
        if (e.target === overlay) overlay.remove();
      });
    }));
  }

  function startGame() {
    // Remove any leftover finish overlay
    const old = document.querySelector('.fixed.inset-0.z-\\[9000\\]');
    if (old) old.remove();

    lives  = MAX_LIVES;
    score  = 0;
    round  = 0;
    roundOrder = shuffle(CARDS.map((_, i) => i)).slice(0, TOTAL_ROUNDS);

    document.getElementById('score-display').textContent = '0';
    renderHearts();
    renderRound();
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', startGame);
</script>
</body>
</html>
