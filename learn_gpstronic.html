<script>
Components.mount('top-nav-placeholder', Components.renderTopNav('classes'));
Components.mount('side-nav-placeholder', Components.renderSideNav('classes'));
Components.mount('mobile-nav-placeholder', Components.renderMobileNav('classes'));

// ── Trilha GPS Tronic: 8 lições × 4 minis = 32 nós ──────────────────────────
const TRAIL_GPS = [
  { id:501, emoji:'🛰️', title:'GPS Basics Review' },
  { id:502, emoji:'🚜', title:'Tractor & Field Words' },
  { id:503, emoji:'📞', title:'Phone Greetings' },
  { id:504, emoji:'❓', title:'Customer Questions' },
  { id:505, emoji:'🔧', title:'What I Fixed Today' },
  { id:506, emoji:'📅', title:'Promising a Deadline' },
  { id:507, emoji:'🧩', title:'Ordering Parts' },
  { id:508, emoji:'🌾', title:'At the Farm' },
];
const TOTAL_NODES = TRAIL_GPS.length * 4;
const DAY_SUBS = ['Listen & Quiz','Game','Build & Speak','Chat with Yara'];

function miniDone(lessonId, miniNum) {
  if (window.Store && Store.state.completedLessons && Store.state.completedLessons.includes(lessonId)) return true;
  return window.Store ? Store.isMiniDone(lessonId, miniNum) : false;
}

function nextMini() {
  for (const l of TRAIL_GPS) for (let m = 1; m <= 4; m++)
    if (!miniDone(l.id, m)) return { lesson: l, mini: m };
  return null;
}

function openMini(lessonId, miniNum) {
  window.location.href = `lessons.html?lesson=${lessonId}&mini=${miniNum}&guided=1`;
}

function render() {
  const cont = document.getElementById('gps-trail');
  const next = nextMini();
  let done = 0, html = '';

  TRAIL_GPS.forEach(l => {
    let rows = '';
    for (let m = 1; m <= 4; m++) {
      const isDone = miniDone(l.id, m);
      if (isDone) done++;
      const isCurrent = next && next.lesson.id === l.id && next.mini === m;
      rows += `
        <button onclick="openMini(${l.id},${m})"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl border-2 text-left transition-all active:scale-[.98]
            ${isDone ? 'bg-emerald-50 border-emerald-200' : isCurrent ? 'bg-white border-emerald-400 node-current' : 'bg-white border-slate-100 hover:border-emerald-200'}">
          <span class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm flex-shrink-0
            ${isDone ? 'bg-emerald-500 text-white' : isCurrent ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
            ${isDone ? '✓' : 'D' + m}
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-black text-sm ${isDone ? 'text-emerald-700' : 'text-navy'}">Day ${m} — ${DAY_SUBS[m-1]}</span>
          </span>
          ${isCurrent ? '<span class="text-[10px] font-black bg-emerald-500 text-white px-2.5 py-1 rounded-full flex-shrink-0">COMEÇAR</span>' : ''}
        </button>`;
    }
    html += `
      <div class="card-in bg-white/70 border border-emerald-100 rounded-3xl p-4">
        <div class="flex items-center gap-2 mb-3 px-1">
          <span class="text-2xl">${l.emoji}</span>
          <span class="font-black text-navy">${l.title}</span>
        </div>
        <div class="space-y-2">${rows}</div>
      </div>`;
  });

  cont.innerHTML = html;
  document.getElementById('gps-progress-bar').style.width = Math.round(done / TOTAL_NODES * 100) + '%';
  document.getElementById('gps-progress-label').textContent = done + ' / ' + TOTAL_NODES;

  if (next) {
    const c = document.getElementById('gps-continue');
    c.classList.remove('hidden');
    document.getElementById('gps-cont-emoji').textContent = next.lesson.emoji;
    document.getElementById('gps-cont-title').textContent = next.lesson.title;
    document.getElementById('gps-cont-sub').textContent = `Day ${next.mini} — ${DAY_SUBS[next.mini-1]}`;
    document.getElementById('gps-cont-btn').onclick = () => openMini(next.lesson.id, next.mini);
    if (done === 0) document.querySelector('#gps-continue p').textContent = 'Comece por aqui';
  } else {
    document.getElementById('gps-done').classList.remove('hidden');
  }
}

render();
document.addEventListener('stateChanged', render);
</script>
