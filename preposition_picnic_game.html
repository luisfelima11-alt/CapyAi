<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001f3f">
  <title>Preposition Picnic — Capy Yara English</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&family=Lexend:wght@600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--navy:#001f3f;--deep:#001326;--pink:#ec4899;--green:#10b981;--leaf:#34d399;--sky:#38bdf8;--mist:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,rgba(16,185,129,.2),transparent 28rem),radial-gradient(circle at 92% 75%,rgba(236,72,153,.16),transparent 30rem),var(--navy);color:var(--mist);font-family:'Be Vietnam Pro',sans-serif}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}.shell{width:min(960px,calc(100% - 32px));margin:auto;padding:128px 0 72px}.back{display:inline-flex;align-items:center;gap:8px;color:#a7f3d0;text-decoration:none;font-weight:800}.hero{text-align:center;margin:32px auto 24px}.eyebrow{font:700 12px 'Lexend',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6ee7b7}h1{font:800 clamp(38px,8vw,72px)/.96 'Plus Jakarta Sans',sans-serif;margin:10px 0 14px;letter-spacing:-.055em}.hero p{max-width:620px;margin:auto;color:#a8bad0;line-height:1.65}
    .berries{display:flex;justify-content:center;gap:9px;margin-top:24px}.berry{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.08);font-size:17px}.berry.done{background:var(--green)}.berry.current{background:var(--pink);box-shadow:0 0 0 7px rgba(236,72,153,.15);transform:scale(1.12)}
    .panel{background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));border-radius:48px;padding:clamp(22px,5vw,44px);box-shadow:0 28px 80px rgba(0,0,0,.3);backdrop-filter:blur(16px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.counter,.score{font:700 13px 'Lexend',sans-serif;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08)}.score{color:#86efac}.hearts{color:#fda4af;margin-left:8px}.progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:18px 0 25px}.progress>div{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--pink));transition:width .35s ease}
    .scene{height:240px;border-radius:36px;background:linear-gradient(180deg,#b8edff 0 55%,#65d99c 55%);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 -20px 50px rgba(0,49,35,.16)}.scene::before{content:'☁️';position:absolute;top:20px;left:13%;font-size:45px;opacity:.8}.scene::after{content:'🌳';position:absolute;right:6%;bottom:18px;font-size:72px}.visual{position:relative;z-index:2;min-width:220px;min-height:150px;display:grid;place-items:center;font-size:64px;filter:drop-shadow(0 10px 7px rgba(0,0,0,.18))}.visual .small{font-size:48px}.stack{display:flex;flex-direction:column;align-items:center;line-height:.8}.row{display:flex;align-items:center;gap:16px}.overlap{position:relative;width:135px;height:120px}.overlap span{position:absolute}.overlap .back{font-size:92px;left:20px;top:22px}.overlap .front{font-size:45px;left:54px;top:53px}.behind .front{z-index:2;left:15px;top:26px}.behind .back{z-index:1;left:65px;top:18px}.above{display:flex;flex-direction:column;align-items:center;gap:26px}.below{display:flex;flex-direction:column-reverse;align-items:center;gap:20px}
    .question{text-align:center;font:800 clamp(22px,5vw,34px)/1.3 'Plus Jakarta Sans',sans-serif;margin:24px 0 8px;letter-spacing:-.02em}.hint{text-align:center;color:#94a9bd;margin:0 0 22px}.blank{color:#f9a8d4;border-bottom:5px solid var(--pink);padding:0 12px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.answer{min-height:62px;border:0;border-radius:22px;background:#fff;color:var(--navy);font:800 15px 'Lexend',sans-serif;padding:14px;cursor:pointer;box-shadow:0 8px 0 #b7c4d1;transition:transform .15s,box-shadow .15s,background .15s}.answer:hover{transform:translateY(-2px);box-shadow:0 10px 0 #b7c4d1}.answer:active{transform:translateY(5px);box-shadow:0 3px 0 #b7c4d1}.answer:disabled{cursor:default}.answer.correct{background:#34d399;color:#052e25;box-shadow:0 7px 0 #059669}.answer.wrong{background:#fb7185;color:#4c0519;box-shadow:0 7px 0 #be123c}
    .feedback{min-height:84px;margin-top:23px;padding:17px 20px;border-radius:24px;background:rgba(0,0,0,.18);color:#c7d5e3;line-height:1.55}.feedback strong{display:block;color:white;margin-bottom:4px}.feedback.good strong{color:#86efac}.feedback.bad strong{color:#fda4af}.next{display:none;width:100%;margin-top:16px;border:0;border-radius:999px;background:var(--pink);color:white;padding:16px 22px;font:800 15px 'Lexend',sans-serif;cursor:pointer}.next.show{display:block}
    .finish{text-align:center;padding:12px 0}.finish .emoji{font-size:76px}.finish h2{font:800 38px 'Plus Jakarta Sans',sans-serif;margin:10px 0}.finish .xp{font:800 26px 'Lexend',sans-serif;color:#86efac}.finish-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.finish-actions a,.finish-actions button{border:0;border-radius:999px;padding:14px 22px;color:white;text-decoration:none;font-weight:800;cursor:pointer}.again{background:var(--pink)}.more{background:rgba(255,255,255,.12)}
    @media(max-width:600px){.shell{width:min(100% - 20px,960px);padding-top:108px}.panel{border-radius:32px}.answers{grid-template-columns:1fr}.hero{margin-top:24px}.scene{height:205px}.visual{transform:scale(.86)}.answer{min-height:56px}.berries{gap:5px}.berry{width:29px;height:29px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}.berry.current{transform:none}}
  </style>
</head>
<body>
  <div id="top-nav-placeholder"></div><div id="side-nav-placeholder"></div>
  <main class="shell">
    <a class="back" href="5_Game_Pavilion_Forest_Edition.html">← Voltar ao Pavilhão</a>
    <header class="hero"><div class="eyebrow">Expedição visual</div><h1>Preposition Picnic 🧺</h1><p>Observe a cena do piquenique e escolha onde cada objeto está. Aprenda preposições enxergando a posição.</p><div id="berries" class="berries" aria-label="Progresso do piquenique"></div></header>
    <section id="game-panel" class="panel" aria-live="polite">
      <div class="topline"><span id="round" class="counter">Cena 1 de 10</span><span class="score"><span id="score">0 XP</span><span id="hearts" class="hearts">♥ ♥ ♥</span></span></div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <div id="scene" class="scene"><div id="visual" class="visual"></div></div>
      <h2 id="question" class="question"></h2><p id="hint" class="hint"></p><div id="answers" class="answers"></div>
      <div id="feedback" class="feedback">Olhe a posição dos objetos antes de responder.</div><button id="next" class="next">Próxima cena →</button>
    </section>
  </main>
  <div id="mobile-nav-placeholder"></div>
  <script src="auth-secure.js?v=auth20260918"></script>
<script src="store.js?v=xpfix"></script><script src="components.js?v=push2"></script>
  <script>
    Components.mount('top-nav-placeholder',Components.renderTopNav('games'));Components.mount('side-nav-placeholder',Components.renderSideNav('games'));Components.mount('mobile-nav-placeholder',Components.renderMobileNav('games'));
    const ALL=['on','under','in','next to','between','behind','in front of','above','near'];
    const ITEMS=[
      {visual:'<div class="stack"><span class="small">🍓</span><span>🧺</span></div>',sentence:'The strawberry is ___ the basket.',pt:'O morango está sobre a cesta.',answer:'on',rule:'Use on quando algo está sobre uma superfície e a toca.'},
      {visual:'<div class="below"><span class="small">🍓</span><span>🧺</span></div>',sentence:'The strawberry is ___ the basket.',pt:'O morango está embaixo da cesta.',answer:'under',rule:'Under significa embaixo de algo.'},
      {visual:'<div class="overlap"><span class="back">🧺</span><span class="front">🍓</span></div>',sentence:'The strawberry is ___ the basket.',pt:'O morango está dentro da cesta.',answer:'in',rule:'Use in quando algo está dentro de um espaço ou recipiente.'},
      {visual:'<div class="row"><span>🧺</span><span class="small">🍓</span></div>',sentence:'The strawberry is ___ the basket.',pt:'O morango está ao lado da cesta.',answer:'next to',rule:'Next to significa bem ao lado.'},
      {visual:'<div class="row"><span>🌳</span><span class="small">🧺</span><span>🌳</span></div>',sentence:'The basket is ___ the trees.',pt:'A cesta está entre as árvores.',answer:'between',rule:'Between é usado quando algo fica no meio de duas coisas.'},
      {visual:'<div class="overlap behind"><span class="front">🧺</span><span class="back">🐿️</span></div>',sentence:'The squirrel is ___ the basket.',pt:'O esquilo está atrás da cesta.',answer:'behind',rule:'Behind significa atrás, escondido pela posição de outro objeto.'},
      {visual:'<div class="overlap behind"><span class="front">🐿️</span><span class="back">🧺</span></div>',sentence:'The squirrel is ___ the basket.',pt:'O esquilo está na frente da cesta.',answer:'in front of',rule:'In front of indica uma posição à frente de algo.'},
      {visual:'<div class="above"><span class="small">🦋</span><span>🌼</span></div>',sentence:'The butterfly is ___ the flower.',pt:'A borboleta está acima da flor.',answer:'above',rule:'Above significa acima, sem necessariamente tocar.'},
      {visual:'<div class="row"><span>🧺</span><span class="small">🌼</span></div>',sentence:'The flower is ___ the basket.',pt:'A flor está perto da cesta.',answer:'near',rule:'Near significa perto, mas não exige que os objetos estejam lado a lado.'},
      {visual:'<div class="stack"><span class="small">🥪</span><span>🧺</span></div>',sentence:'The sandwich is ___ the basket.',pt:'O sanduíche está sobre a cesta.',answer:'on',rule:'On indica contato com a superfície.'},
      {visual:'<div class="row"><span>🧃</span><span>🧺</span></div>',sentence:'The juice is ___ the basket.',pt:'O suco está ao lado da cesta.',answer:'next to',rule:'Next to é a escolha mais precisa para objetos lado a lado.'},
      {visual:'<div class="overlap"><span class="back">🎒</span><span class="front">📖</span></div>',sentence:'The book is ___ the backpack.',pt:'O livro está dentro da mochila.',answer:'in',rule:'In descreve algo contido dentro de outro objeto.'},
      {visual:'<div class="below"><span class="small">⚽</span><span>🪑</span></div>',sentence:'The ball is ___ the chair.',pt:'A bola está embaixo da cadeira.',answer:'under',rule:'Under indica que a bola está em uma posição inferior à cadeira.'},
      {visual:'<div class="row"><span>🌼</span><span class="small">🐞</span><span>🌼</span></div>',sentence:'The ladybug is ___ the flowers.',pt:'A joaninha está entre as flores.',answer:'between',rule:'Between coloca a joaninha no meio de duas flores.'}
    ];
    const $=id=>document.getElementById(id),shuffle=list=>[...list].sort(()=>Math.random()-.5);let deck=[],step=0,points=0,lives=3,locked=false;
    function choicesFor(answer){return shuffle([answer,...shuffle(ALL.filter(x=>x!==answer)).slice(0,3)])}
    function buildBerries(){$('berries').innerHTML=Array.from({length:10},(_,i)=>`<span class="berry ${i<step?'done':i===step?'current':''}">${i<step?'✓':'🍓'}</span>`).join('')}
    function speak(text,answer){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text.replace('___',answer));u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
    function render(){if(step>=10||lives<=0)return finish();locked=false;buildBerries();const item=deck[step];$('round').textContent=`Cena ${step+1} de 10`;$('score').textContent=`${points} XP`;$('hearts').textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'♡').join(' ');$('progress-bar').style.width=`${(step+1)*10}%`;$('visual').innerHTML=item.visual;$('question').innerHTML=item.sentence.replace('___','<span class="blank">___</span>');$('hint').textContent=item.pt;$('answers').innerHTML=choicesFor(item.answer).map(answer=>`<button class="answer" data-answer="${answer}">${answer}</button>`).join('');$('answers').querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>choose(button,item)));$('feedback').className='feedback';$('feedback').textContent='Olhe a posição dos objetos antes de responder.';$('next').classList.remove('show')}
    function choose(button,item){if(locked)return;locked=true;const correct=button.dataset.answer===item.answer;$('answers').querySelectorAll('button').forEach(btn=>{btn.disabled=true;if(btn.dataset.answer===item.answer)btn.classList.add('correct')});if(correct){points+=12;$('feedback').innerHTML=`<strong>Encontrou! +12 XP</strong>${item.rule}`;$('feedback').className='feedback good'}else{lives--;button.classList.add('wrong');$('hearts').textContent=Array.from({length:3},(_,i)=>i<lives?'♥':'♡').join(' ');$('feedback').innerHTML=`<strong>A resposta é “${item.answer}”.</strong>${item.rule}`;$('feedback').className='feedback bad'}speak(item.sentence,item.answer);$('next').textContent=lives<=0?'Ver resultado →':'Próxima cena →';$('next').classList.add('show');$('next').focus()}
    function saveResult(){try{const stats=JSON.parse(localStorage.getItem('capyGameStats')||'{}');const old=stats.preposition_picnic||{};stats.preposition_picnic={plays:(old.plays||0)+1,best:Math.max(old.best||0,points),lastPlayed:Date.now()};localStorage.setItem('capyGameStats',JSON.stringify(stats))}catch(e){}}
    function finish(){buildBerries();saveResult();if(window.Store){Store.addXP(points);Store.completeActivity('games')}const complete=step>=10;$('game-panel').innerHTML=`<div class="finish"><div class="emoji">${complete?'🧺':'🌱'}</div><h2>${complete?'Piquenique completo!':'Boa tentativa!'}</h2><p>${complete?'Você encontrou todos os objetos da floresta.':'Você já aprendeu novas posições. Tente mais uma vez!'}</p><div class="xp">+${points} XP</div><div class="finish-actions"><button class="again" onclick="location.reload()">Jogar novamente</button><a class="more" href="5_Game_Pavilion_Forest_Edition.html">Ver mais jogos</a></div></div>`}
    $('next').addEventListener('click',()=>{step++;render()});deck=shuffle(ITEMS).slice(0,10);render();
  </script>
<script src="celebration.js?v=cel3"></script>
<script src="game-celebra.js?v=gc1"></script>
</body>
</html>
