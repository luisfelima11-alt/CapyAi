<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Página não encontrada — Capy English</title>
<!-- Servida pelo vercel.json (último "routes") e pelo dev-server para qualquer
     endereço que não existe. Caminhos absolutos: ela aparece em /qualquer/coisa. -->
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<style>
  :root { --navy: #001f3f; --rosa: #ec4899; --verde: #10b981; --cinza: #64748b; --fundo: #f4f6fb; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--fundo);
         font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--navy); }
  main { width: 100%; max-width: 440px; background: #fff; border-radius: 3rem; padding: 40px 28px 32px; text-align: center;
         box-shadow: 0 30px 60px -20px rgba(0, 31, 63, .18); }
  .yara { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 20px;
          box-shadow: 0 0 0 8px #fce7f3; }
  .codigo { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--rosa); }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.2; margin: 8px 0 10px; }
  p { color: var(--cinza); font-weight: 500; line-height: 1.5; }
  .acoes { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
  .botao { display: block; border-radius: 9999px; padding: 14px 20px; font-weight: 800; text-decoration: none; transition: transform .15s; }
  .botao:active { transform: scale(.98); }
  .principal { background: var(--rosa); color: #fff; box-shadow: 0 10px 24px rgba(236, 72, 153, .35); }
  .secundario { background: var(--fundo); color: var(--navy); }
  .trilha { display: inline-block; margin-top: 18px; color: var(--verde); font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="yara" src="/logo-capy.png?v=lg2" alt="" width="96" height="96"/>
  <p class="codigo">ERRO 404</p>
  <h1>Ops! Essa trilha não existe.</h1>
  <p>A página que você procurou mudou de lugar ou nunca existiu. A Yara te leva de volta.</p>
  <div class="acoes">
    <a class="botao principal" href="/">Ir para o início</a>
    <a class="botao secundario" href="/classes.html">Ver os cursos</a>
  </div>
  <a class="trilha" href="/learn.html">ou continue a trilha diária →</a>
</main>
</body>
</html>
