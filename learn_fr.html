// ── Trilha de Francês: 12 lições × 4 minis ─────────────────────────────────
// Os ids batem com LESSONS_FR (lessons_fr_data.js, ids 201-212), que já é
// carregado por lessons.html — esta página só é a porta de entrada que faltava.
const TRAIL_FR = [
  { id:201, emoji:'👋', title:'Les Salutations' },
  { id:202, emoji:'🔢', title:'Les Chiffres (1-10)' },
  { id:203, emoji:'🎨', title:'Les Couleurs' },
  { id:204, emoji:'👨‍👩‍👧‍👦', title:'La Famille' },
  { id:205, emoji:'✨', title:'Être & Avoir' },
  { id:206, emoji:'🥐', title:'La Nourriture' },
  { id:207, emoji:'📅', title:'Les Jours et les Mois' },
  { id:208, emoji:'⏰', title:"L'Heure" },
  { id:209, emoji:'🌦️', title:'La Météo' },
  { id:210, emoji:'🧭', title:'Les Directions' },
  { id:211, emoji:'🛍️', title:'Les Vêtements' },
  { id:212, emoji:'⏪', title:'Le Passé Composé' },
];
const TOTAL_NODES = TRAIL_FR.length * 4;
const DAY_SUBS = ['Écoute & Quiz','Jeu','Construis & Parle','Chat avec Yara'];

function miniDone(lessonId, miniNum) {
  if (window.Store && Store.state.completedLessons && Store.state.completedLessons.includes(lessonId)) return true;
  return window.Store ? Store.isMiniDone(lessonId, miniNum) : false;
}

function nextMini() {
  for (const l of TRAIL_FR) for (let m = 1; m <= 4; m++)
    if (!miniDone(l.id, m)) return { lesson: l, mini: m };
  return null;
}

function openMini(lessonId, miniNum) {
  window.location.href = `lessons.html?lesson=${lessonId}&mini=${miniNum}&guided=1`;
}

function render() {
  const cont = document.getElementById('fr-trail');
  const next = nextMini();
  let done = 0, html = '';

  TRAIL_FR.forEach(l => {
    let rows = '';
    for (let m = 1; m <= 4; m++) {
      const isDone = miniDone(l.id, m);
      if (isDone) done++;
      const isCurrent = next && next.lesson.id === l.id && next.mini === m;
      rows += `
        <button onclick="openMini(${l.id},${m})"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl border-2 text-left transition-all active:scale-[.98]
            ${isDone ? 'bg-blue-50 border-blue-200' : isCurrent ? 'bg-white border-blue-400 node-current' : 'bg-white border-slate-100 hover:border-blue-200'}">
          <span class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm flex-shrink-0
            ${isDone ? 'bg-blue-600 text-white' : isCurrent ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-400'}">
            ${isDone ? '✓' : 'J' + m}
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-black text-sm ${isDone ? 'text-blue-700' : 'text-navy'}">Jour ${m} — ${DAY_SUBS[m-1]}</span>
          </span>
          ${isCurrent ? '<span class="text-[10px] font-black bg-blue-600 text-white px-2.5 py-1 rounded-full flex-shrink-0">COMEÇAR</span>' : ''}
        </button>`;
    }
    html += `
      <div class="card-in bg-white/70 border border-blue-100 rounded-3xl p-4">
        <div class="flex items-center gap-2 mb-3 px-1">
          <span class="text-2xl">${l.emoji}</span>
          <span class="font-black text-navy">${l.title}</span>
        </div>
        <div class="space-y-2">${rows}</div>
      </div>`;
  });

  cont.innerHTML = html;
  document.getElementById('fr-progress-bar').style.width = Math.round(done / TOTAL_NODES * 100) + '%';
  document.getElementById('fr-progress-label').textContent = done + ' / ' + TOTAL_NODES;

  if (next) {
    const c = document.getElementById('fr-continue');
    c.classList.remove('hidden');
    document.getElementById('fr-cont-emoji').textContent = next.lesson.emoji;
    document.getElementById('fr-cont-title').textContent = next.lesson.title;
    document.getElementById('fr-cont-sub').textContent = `Jour ${next.mini} — ${DAY_SUBS[next.mini-1]}`;
    document.getElementById('fr-cont-btn').onclick = () => openMini(next.lesson.id, next.mini);
    if (done === 0) document.querySelector('#fr-continue p').textContent = 'Comece por aqui';
  } else {
    document.getElementById('fr-done').classList.remove('hidden');
  }
}

render();
document.addEventListener('stateChanged', render);
</script>
