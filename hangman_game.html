<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}

  /* Letter key */
  .key-btn {
    width:38px; height:38px; border-radius:10px; border:1.5px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.08); color:#fff; cursor:pointer;
    font-family:'Lexend',sans-serif; font-weight:700; font-size:0.9rem;
    transition:all 0.1s; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .key-btn:active { transform:scale(0.9); }
  .key-btn.correct { background:rgba(16,185,129,0.35); border-color:#10b981; color:#6ee7b7; }
  .key-btn.wrong   { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); cursor:default; }

  /* Word blanks */
  .blank {
    width:32px; height:40px; border-bottom:3px solid rgba(255,255,255,0.3);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px;
    font-family:'Lexend',sans-serif; font-weight:700; font-size:1.3rem; color:#fff;
  }
  .blank.revealed { border-color:#10b981; color:#6ee7b7; }
  .blank.reveal-anim { animation:revealLetter 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both; }

  /* Hearts */
  .heart { font-size:1.5rem; transition:all 0.3s; }
  .heart.lost { opacity:0.2; transform:scale(0.8); filter:grayscale(1); }

  /* Yara SVG stages */
  #yara-stage { transition:all 0.4s; }

  @keyframes fadeUp       { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes revealLetter { 0%{transform:scale(0) rotate(-10deg)} 80%{transform:scale(1.2)} 100%{transform:scale(1)} }
  @keyframes shake        { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  @keyframes confettiFall { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(180px) rotate(360deg);opacity:0} }

  .fade-up { animation:fadeUp 0.4s ease both; }
  .shake   { animation:shake 0.4s ease; }

  .confetti-piece{position:fixed;pointer-events:none;z-index:9999;width:9px;height:9px;border-radius:2px;animation:confettiFall 1.1s ease-out forwards;}
</style>

const MAX_WRONG = 6;
const YARA_STAGES = ['🐾','😟','😬','😰','😱','🥺','💀'];
const KEYBOARD_ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];

// ── State ──────────────────────────────────────────────────────────────────────
let shuffled     = [...WORDS].sort(() => Math.random() - 0.5);
let roundIdx     = 0;
let wrongCount   = 0;
let guessed      = new Set();
let wrongLetters = [];
let score        = 0;

document.getElementById('total-rounds').textContent = shuffled.length;

// ── Boot ───────────────────────────────────────────────────────────────────────
buildKeyboard();
startRound();

function startRound() {
  const entry = shuffled[roundIdx];
  wrongCount   = 0;
  guessed      = new Set();
  wrongLetters = [];

  document.getElementById('round-disp').textContent     = roundIdx + 1;
  document.getElementById('category-label').textContent = entry.cat;
  document.getElementById('hint-text').textContent      = entry.hint;
  document.getElementById('wrong-letters').textContent  = '—';
  document.getElementById('wrong-count').textContent    = '0 wrong';
  document.getElementById('yara-stage').textContent     = YARA_STAGES[0];

  renderHearts();
  renderBlanks();
  resetKeyboard();
}

function renderHearts() {
  document.getElementById('hearts-row').innerHTML =
    Array.from({length: MAX_WRONG}, (_, i) =>
      `<span class="heart${i < wrongCount ? ' lost' : ''}">❤️</span>`
    ).join('');
}

function renderBlanks() {
  const word = shuffled[roundIdx].word;
  document.getElementById('blanks-row').innerHTML = word.split('').map((ch, i) => {
    const rev = guessed.has(ch);
    return `<div class="blank${rev ? ' revealed' : ''}" id="blank-${i}">${rev ? ch : ''}</div>`;
  }).join('');
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = KEYBOARD_ROWS.map(row =>
    `<div class="flex justify-center gap-1.5">${
      row.split('').map(l =>
        `<button class="key-btn" id="key-${l}" onclick="guess('${l}')">${l}</button>`
      ).join('')
    }</div>`
  ).join('');
}

function resetKeyboard() {
  document.querySelectorAll('.key-btn').forEach(btn => {
    btn.classList.remove('correct','wrong');
    btn.disabled = false;
  });
}

// ── Guess ──────────────────────────────────────────────────────────────────────
function guess(letter) {
  if (guessed.has(letter)) return;
  guessed.add(letter);

  const btn = document.getElementById(`key-${letter}`);
  btn.disabled = true;

  const word = shuffled[roundIdx].word;

  if (word.includes(letter)) {
    btn.classList.add('correct');
    // Reveal blanks
    word.split('').forEach((ch, i) => {
      if (ch === letter) {
        const el = document.getElementById(`blank-${i}`);
        el.textContent = ch;
        el.classList.add('revealed','reveal-anim');
        setTimeout(() => el.classList.remove('reveal-anim'), 400);
      }
    });

    // Check win
    if (word.split('').every(ch => guessed.has(ch))) {
      const pts = 20 + (MAX_WRONG - wrongCount) * 5;
      score += pts;
      document.getElementById('score-disp').textContent = score;
      setTimeout(() => roundResult(true, pts), 500);
    }
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongLetters.push(letter);

    document.getElementById('yara-stage').textContent     = YARA_STAGES[Math.min(wrongCount, YARA_STAGES.length-1)];
    document.getElementById('wrong-letters').textContent  = wrongLetters.join(' ') || '—';
    document.getElementById('wrong-count').textContent    = wrongCount + ' wrong';
    renderHearts();

    // Shake blanks
    const blanksRow = document.getElementById('blanks-row');
    blanksRow.classList.add('shake');
    setTimeout(() => blanksRow.classList.remove('shake'), 400);

    if (wrongCount >= MAX_WRONG) {
      setTimeout(() => roundResult(false, 0), 400);
    }
  }
}

// Physical keyboard support
document.addEventListener('keydown', e => {
  const l = e.key.toUpperCase();
  if (/^[A-Z]$/.test(l) && !document.getElementById(`key-${l}`)?.disabled) guess(l);
});

// ── Round result ───────────────────────────────────────────────────────────────
function roundResult(won, pts) {
  const word  = shuffled[roundIdx].word;
  const isLast = roundIdx + 1 >= shuffled.length;

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/50 backdrop-blur-sm';

  if (won && !isLast) {
    launchConfetti();
    overlay.innerHTML = `
      <div class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-emerald-500/50
           rounded-[2.5rem] px-10 py-8 flex flex-col items-center gap-4 shadow-2xl text-center max-w-xs mx-4">
        <div class="text-6xl">🎉</div>
        <h3 class="font-headline text-3xl font-black text-white">Correct!</h3>
        <p class="font-headline text-2xl text-emerald-400 font-black">${word}</p>
        <p class="font-body text-slate-300 text-sm">+${pts} points!</p>
        <button onclick="this.closest('.fixed').remove(); nextRound()"
                class="bg-emerald-500 hover:bg-emerald-400 text-white font-label font-bold px-8 py-3 rounded-full active:scale-95 transition-all mt-1">
          Next Word →
        </button>
      </div>`;
  } else if (!won && !isLast) {
    overlay.innerHTML = `
      <div class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-red-500/50
           rounded-[2.5rem] px-10 py-8 flex flex-col items-center gap-4 shadow-2xl text-center max-w-xs mx-4">
        <div class="text-6xl">💀</div>
        <h3 class="font-headline text-3xl font-black text-white">Oops!</h3>
        <p class="font-body text-slate-300">The word was:</p>
        <p class="font-headline text-2xl text-red-400 font-black">${word}</p>
        <button onclick="this.closest('.fixed').remove(); nextRound()"
                class="bg-emerald-500 hover:bg-emerald-400 text-white font-label font-bold px-8 py-3 rounded-full active:scale-95 transition-all mt-1">
          Next Word →
        </button>
      </div>`;
  } else {
    // Final round
    showGameOver(won, word);
    overlay.remove();
    return;
  }

  document.body.appendChild(overlay);
}

function nextRound() {
  roundIdx++;
  startRound();
}

// ── Game over ──────────────────────────────────────────────────────────────────
function showGameOver(lastWon, lastWord) {
  const correct = shuffled.filter((_, i) => i < roundIdx + (lastWon ? 1 : 0)).length;
  const stars = correct >= shuffled.length * 0.8 ? 3 : correct >= shuffled.length * 0.5 ? 2 : 1;
  const xp    = stars === 3 ? 40 : stars === 2 ? 25 : 10;

  if (window.Store) {
    Store.addXP(xp);
    Store.completeActivity('games');
    if (stars === 3) Store.unlockBadge('game_hero');
  }
  if (stars >= 2) launchConfetti();

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-emerald-500/40
         rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-7xl">🌿</div>
      <div>
        <p class="font-label text-emerald-400 font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
        <h2 class="font-headline text-5xl font-black text-white mb-1">${score} pts</h2>
        <p class="font-body text-slate-300">${correct}/${shuffled.length} words guessed</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-slate-600'}"
          style="font-variation-settings:'FILL' ${i<=stars?1:0};">star</span>`).join('')}
      </div>
      <p class="font-body text-slate-400 text-sm">+${xp} XP earned!</p>
      <div class="flex gap-3">
        <button onclick="location.reload()"
                class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">
          Play Again 🔄
        </button>
        <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
                class="bg-emerald-500 hover:bg-emerald-400 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg">
          Games 🌿
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f = document.getElementById('fin');
    f.style.transform='scale(1)'; f.style.opacity='1';
  }));
}

function launchConfetti() {
  const colors=['#10b981','#ec4899','#06b6d4','#facc15','#818cf8'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[i%colors.length]};
      animation-delay:${Math.random()*0.6}s;animation-duration:${0.9+Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
}
</script>
</body>
