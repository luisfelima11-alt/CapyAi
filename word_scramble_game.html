<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Word Scramble — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config={darkMode:"class",theme:{extend:{
  colors:{"navy":"#001f3f","navy-light":"#002d5c","pink-brand":"#ec4899","green-brand":"#10b981"},
  fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
  borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
}}}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}

  /* Letter tiles */
  .tile {
    width:52px; height:56px; border-radius:14px; cursor:pointer;
    font-family:'Lexend',sans-serif; font-weight:700; font-size:1.4rem;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.15); color:#fff;
    transition:all 0.15s; user-select:none; -webkit-tap-highlight-color:transparent;
    background:rgba(255,255,255,0.1);
  }
  .tile:hover  { transform:translateY(-3px); background:rgba(255,255,255,0.18); }
  .tile:active { transform:scale(0.9); }
  .tile.used   { opacity:0; pointer-events:none; }

  /* Answer slots */
  .slot {
    width:52px; height:56px; border-radius:14px;
    font-family:'Lexend',sans-serif; font-weight:700; font-size:1.4rem;
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.2); color:#fff;
    background:rgba(255,255,255,0.05); cursor:pointer;
    transition:all 0.15s; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .slot.filled { background:rgba(99,102,241,0.3); border-color:#818cf8; cursor:pointer; }
  .slot.correct{ background:rgba(16,185,129,0.3); border-color:#10b981; color:#6ee7b7; cursor:default; }
  .slot.wrong  { background:rgba(244,63,94,0.3);  border-color:#f43f5e; animation:shake 0.35s ease; }

  /* Hearts */
  .heart { font-size:1.4rem; transition:all 0.3s; }
  .heart.lost { opacity:0.2; filter:grayscale(1); }

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{0%{transform:scale(0.6)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  @keyframes bounceIn{0%{transform:scale(0) rotate(-10deg)}70%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(200px) rotate(360deg);opacity:0}}

  .fade-up{animation:fadeUp 0.4s ease both;}
  .pop-in {animation:popIn  0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;}
  .bounce-in{animation:bounceIn 0.45s cubic-bezier(0.175,0.885,0.32,1.275) both;}
  .confetti-piece{position:fixed;pointer-events:none;z-index:9999;width:9px;height:9px;border-radius:2px;animation:confettiFall 1.1s ease-out forwards;}
</style>
</head>
<body class="bg-navy font-body text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center gap-4 px-5 py-4 border-b border-white/10 bg-navy/90 backdrop-blur sticky top-0 z-50">
  <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-90">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <div class="flex-1">
    <p class="font-label text-xs text-fuchsia-400 uppercase tracking-widest font-bold">Word Scramble</p>
    <h1 class="font-headline font-bold text-white text-lg leading-none">Unscramble It! 🔀</h1>
  </div>
  <div id="hearts-header" class="flex gap-1"></div>
  <div class="bg-white/10 border border-white/15 rounded-full px-4 py-2 font-label font-bold text-sm">
    <span id="score-disp">0</span> pts
  </div>
</header>

<main class="flex-1 flex flex-col gap-5 px-4 py-6 max-w-md mx-auto w-full">

  <!-- Progress pills -->
  <div class="flex gap-1.5 fade-up" id="progress-pips"></div>

  <!-- Word card -->
  <div class="bg-gradient-to-br from-fuchsia-950 to-navy-light border border-fuchsia-500/20 rounded-[2.5rem] p-8 flex flex-col items-center gap-4 pop-in" id="word-card">
    <!-- Emoji + category -->
    <div class="text-6xl" id="word-emoji">❓</div>
    <p class="font-label text-xs text-fuchsia-400 uppercase tracking-widest font-bold" id="word-category"></p>
    <!-- Hint -->
    <p class="font-body text-slate-300 text-sm text-center" id="word-hint"></p>

    <!-- Answer slots row -->
    <div class="flex flex-wrap gap-2 justify-center mt-2" id="slots-row"></div>
  </div>

  <!-- Scrambled tiles -->
  <div>
    <p class="font-label text-xs text-slate-400 uppercase tracking-widest font-bold mb-3 px-1 fade-up">Tap to place letters</p>
    <div class="flex flex-wrap gap-2 justify-center fade-up" id="tiles-row"></div>
  </div>

  <!-- Action row -->
  <div class="flex gap-3 fade-up">
    <button onclick="clearAnswer()"
            class="flex-1 py-3 bg-white/8 hover:bg-white/15 border border-white/15 text-slate-400 font-label font-bold rounded-2xl active:scale-95 transition-all text-sm flex items-center justify-center gap-1">
      <span class="material-symbols-outlined text-base">backspace</span> Clear
    </button>
    <button onclick="checkAnswer()"
            class="flex-2 px-8 py-3 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-label font-bold rounded-2xl active:scale-95 transition-all shadow-lg shadow-fuchsia-500/30 text-sm">
      Check ✓
    </button>
    <button onclick="skipWord()"
            class="flex-1 py-3 bg-white/8 hover:bg-white/15 border border-white/15 text-slate-400 font-label font-bold rounded-2xl active:scale-95 transition-all text-sm">
      Skip →
    </button>
  </div>

  <!-- Feedback -->
  <div id="feedback-box" class="hidden bg-navy-light border border-white/10 rounded-2xl px-6 py-4 flex items-center gap-3 fade-up">
    <span class="text-3xl" id="feedback-emoji">✅</span>
    <p class="font-body text-slate-300 text-sm" id="feedback-text"></p>
  </div>

</main>

<script src="store.js?v=c52d7db"></script>
<script src="levelup-overlay.js?v=c52d7db"></script>
<script src="badge-toast.js?v=c52d7db"></script>
<script>
// ── Word bank ──────────────────────────────────────────────────────────────────
const WORDS = [
  {word:'APPLE',   emoji:'🍎', cat:'Food',    hint:'A red or green fruit'},
  {word:'TIGER',   emoji:'🐯', cat:'Animals', hint:'A big orange cat with stripes'},
  {word:'FLOWER',  emoji:'🌸', cat:'Nature',  hint:'It grows in gardens and smells nice'},
  {word:'BRIDGE',  emoji:'🌉', cat:'Places',  hint:'You cross it to get over water'},
  {word:'CLOUD',   emoji:'☁️', cat:'Weather', hint:'White and fluffy in the sky'},
  {word:'DRAGON',  emoji:'🐉', cat:'Fantasy', hint:'A fire-breathing magical creature'},
  {word:'FOREST',  emoji:'🌳', cat:'Nature',  hint:'A place with lots of trees'},
  {word:'GARDEN',  emoji:'🌻', cat:'Places',  hint:'Where you grow plants and flowers'},
  {word:'HELMET',  emoji:'⛑️', cat:'Safety',  hint:'Protects your head'},
  {word:'ISLAND',  emoji:'🏝️', cat:'Places',  hint:'Land surrounded by water'},
  {word:'JUNGLE',  emoji:'🌿', cat:'Nature',  hint:'A very thick, hot forest'},
  {word:'KITTEN',  emoji:'🐱', cat:'Animals', hint:'A baby cat'},
  {word:'LEMON',   emoji:'🍋', cat:'Food',    hint:'A sour yellow fruit'},
  {word:'MONKEY',  emoji:'🐒', cat:'Animals', hint:'It climbs trees and loves bananas'},
  {word:'NEST',    emoji:'🪺', cat:'Nature',  hint:'Where birds lay their eggs'},
  {word:'ORANGE',  emoji:'🍊', cat:'Food',    hint:'A round, juicy citrus fruit'},
  {word:'PARROT',  emoji:'🦜', cat:'Animals', hint:'A colourful bird that can talk'},
  {word:'QUEEN',   emoji:'👸', cat:'Fantasy', hint:'She wears a crown and rules a kingdom'},
  {word:'RABBIT',  emoji:'🐰', cat:'Animals', hint:'It has long ears and loves carrots'},
  {word:'ROCKET',  emoji:'🚀', cat:'Space',   hint:'It flies to outer space'},
];

const MAX_WRONG = 3;

// ── State ──────────────────────────────────────────────────────────────────────
let shuffledWords = [...WORDS].sort(() => Math.random() - 0.5).slice(0, 10);
let wordIdx       = 0;
let wrongCount    = 0;
let score         = 0;
let answer        = [];   // array of {letter, tileIdx}

// ── Boot ───────────────────────────────────────────────────────────────────────
buildPips();
loadWord();

// ── Pip bar ────────────────────────────────────────────────────────────────────
function buildPips() {
  document.getElementById('progress-pips').innerHTML = shuffledWords.map((_, i) =>
    `<div id="pip-${i}" class="h-2 flex-1 rounded-full bg-white/15"></div>`
  ).join('');
}

function updatePips() {
  shuffledWords.forEach((_, i) => {
    const el = document.getElementById(`pip-${i}`);
    el.className = `h-2 flex-1 rounded-full ${i < wordIdx ? 'bg-fuchsia-500' : i === wordIdx ? 'bg-fuchsia-400' : 'bg-white/15'}`;
  });
}

// ── Load word ──────────────────────────────────────────────────────────────────
function loadWord() {
  answer     = [];
  wrongCount = 0;
  const entry = shuffledWords[wordIdx];

  document.getElementById('word-emoji').textContent    = entry.emoji;
  document.getElementById('word-category').textContent = entry.cat;
  document.getElementById('word-hint').textContent     = entry.hint;
  document.getElementById('feedback-box').classList.add('hidden');

  updatePips();
  renderHearts();
  renderSlots();
  renderTiles(scramble(entry.word));

  // Animate card
  const card = document.getElementById('word-card');
  card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
}

// ── Scramble ───────────────────────────────────────────────────────────────────
function scramble(word) {
  const letters = word.split('');
  // Keep scrambling until order differs from original
  let result;
  let attempts = 0;
  do {
    result = [...letters].sort(() => Math.random() - 0.5);
    attempts++;
  } while (result.join('') === word && attempts < 20);
  return result;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderHearts() {
  document.getElementById('hearts-header').innerHTML =
    Array.from({length: MAX_WRONG}, (_, i) =>
      `<span class="heart${i < wrongCount ? ' lost' : ''}">❤️</span>`
    ).join('');
}

function renderSlots() {
  const len = shuffledWords[wordIdx].word.length;
  document.getElementById('slots-row').innerHTML = Array.from({length: len}, (_, i) =>
    `<div class="slot" id="slot-${i}" onclick="removeFromSlot(${i})"></div>`
  ).join('');
}

function renderTiles(letters) {
  document.getElementById('tiles-row').innerHTML = letters.map((l, i) =>
    `<div class="tile" id="tile-${i}" onclick="placeLetter('${l}', ${i})">${l}</div>`
  ).join('');
}

// ── Interaction ────────────────────────────────────────────────────────────────
function placeLetter(letter, tileIdx) {
  const nextSlotIdx = answer.length;
  const word = shuffledWords[wordIdx].word;
  if (nextSlotIdx >= word.length) return;

  answer.push({letter, tileIdx});

  const tile = document.getElementById(`tile-${tileIdx}`);
  tile.classList.add('used');

  const slot = document.getElementById(`slot-${nextSlotIdx}`);
  slot.textContent = letter;
  slot.classList.add('filled');

  // Auto-check when all slots filled
  if (answer.length === word.length) {
    setTimeout(checkAnswer, 300);
  }
}

function removeFromSlot(slotIdx) {
  if (slotIdx >= answer.length) return;
  // Remove all answers from slotIdx onwards (keep order)
  const removed = answer.splice(slotIdx);
  removed.forEach(({tileIdx}) => {
    const tile = document.getElementById(`tile-${tileIdx}`);
    if (tile) tile.classList.remove('used');
  });
  // Re-render slots from slotIdx
  for (let i = slotIdx; i < shuffledWords[wordIdx].word.length; i++) {
    const slot = document.getElementById(`slot-${i}`);
    if (i < answer.length) {
      slot.textContent = answer[i].letter;
      slot.classList.add('filled');
    } else {
      slot.textContent = '';
      slot.classList.remove('filled','correct','wrong');
    }
  }
}

function clearAnswer() {
  answer.forEach(({tileIdx}) => {
    const tile = document.getElementById(`tile-${tileIdx}`);
    if (tile) tile.classList.remove('used');
  });
  answer = [];
  renderSlots();
}

// ── Check ──────────────────────────────────────────────────────────────────────
function checkAnswer() {
  if (answer.length < shuffledWords[wordIdx].word.length) {
    showFeedback('⚠️', 'Fill all the letters first!');
    return;
  }

  const word    = shuffledWords[wordIdx].word;
  const attempt = answer.map(a => a.letter).join('');

  if (attempt === word) {
    // Correct
    document.querySelectorAll('.slot').forEach(s => { s.classList.remove('filled'); s.classList.add('correct'); });
    const pts = 10 + (MAX_WRONG - wrongCount) * 5;
    score += pts;
    document.getElementById('score-disp').textContent = score;
    launchConfetti();
    showFeedback('🎉', `Correct! +${pts} points!`);
    setTimeout(nextWord, 1400);
  } else {
    // Wrong
    wrongCount++;
    renderHearts();
    document.querySelectorAll('.slot.filled').forEach(s => { s.classList.add('wrong'); setTimeout(() => s.classList.remove('wrong'), 400); });
    clearAnswer();

    if (wrongCount >= MAX_WRONG) {
      showFeedback('💡', `The word was: ${word}`);
      setTimeout(nextWord, 1800);
    } else {
      showFeedback('❌', `Not quite! ${MAX_WRONG - wrongCount} chance${MAX_WRONG - wrongCount !== 1 ? 's' : ''} left.`);
    }
  }
}

function skipWord() {
  showFeedback('💡', `The word was: ${shuffledWords[wordIdx].word}`);
  setTimeout(nextWord, 1500);
}

function nextWord() {
  wordIdx++;
  if (wordIdx >= shuffledWords.length) {
    showGameOver();
  } else {
    loadWord();
    document.getElementById('feedback-box').classList.add('hidden');
  }
}

function showFeedback(emoji, text) {
  document.getElementById('feedback-emoji').textContent = emoji;
  document.getElementById('feedback-text').textContent  = text;
  document.getElementById('feedback-box').classList.remove('hidden');
}

// ── Game Over ──────────────────────────────────────────────────────────────────
function showGameOver() {
  const stars = score >= 80 ? 3 : score >= 50 ? 2 : 1;
  const xp    = stars === 3 ? 40 : stars === 2 ? 25 : 10;

  if (window.Store) { Store.addXP(xp); Store.completeActivity('games'); if (stars === 3) Store.unlockBadge('game_hero'); }
  if (stars >= 2) launchConfetti();

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-fuchsia-500/40
         rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-7xl">🔀</div>
      <div>
        <p class="font-label text-fuchsia-400 font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
        <h2 class="font-headline text-5xl font-black text-white mb-1">${score} pts</h2>
        <p class="font-body text-slate-300">${wordIdx}/${shuffledWords.length} words unscrambled</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-slate-600'}" style="font-variation-settings:'FILL' ${i<=stars?1:0};">star</span>`).join('')}
      </div>
      <p class="font-body text-slate-400 text-sm">+${xp} XP earned!</p>
      <div class="flex gap-3">
        <button onclick="location.reload()" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">Play Again 🔄</button>
        <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'" class="bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-fuchsia-500/30">Games 🌿</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const f=document.getElementById('fin'); f.style.transform='scale(1)'; f.style.opacity='1'; }));
}

function launchConfetti() {
  const colors=['#a855f7','#ec4899','#06b6d4','#facc15','#10b981'];
  for(let i=0;i<35;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[i%colors.length]};animation-delay:${Math.random()*0.6}s;animation-duration:${0.9+Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2000);
  }
}
</script>
</body>
</html>
