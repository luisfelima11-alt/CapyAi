<body class="bg-[#001f3f] text-white min-h-screen"><div id="top-nav-placeholder"></div><div id="side-nav-placeholder"></div><main class="md:pl-32 pt-28 pb-24 px-5 max-w-3xl mx-auto"><a href="5_Game_Pavilion_Forest_Edition.html" class="text-fuchsia-300 font-bold">← Pavilhão</a><header class="text-center mt-7"><p class="text-fuchsia-300 text-xs font-black uppercase tracking-[.2em]">Monte a frase</p><h1 class="text-4xl sm:text-6xl font-black mt-2">Phrase Path</h1><p class="text-slate-400 mt-3">Coloque as peças na ordem certa para abrir o próximo trecho.</p></header><section class="bg-white/5 border border-white/10 rounded-[2rem] p-5 sm:p-8 mt-8"><div class="flex justify-between font-bold"><span id="round">1 / 7</span><span id="score" class="text-emerald-300">0 XP</span></div><p id="hint" class="text-center text-fuchsia-200 font-bold mt-7"></p><div id="built" class="min-h-24 mt-4 rounded-2xl bg-black/20 border-2 border-dashed border-white/15 p-4 flex flex-wrap content-center justify-center gap-2"></div><div id="bank" class="flex flex-wrap justify-center gap-3 mt-5"></div><div class="flex justify-center gap-3 mt-6"><button id="clear" class="px-5 py-3 rounded-full bg-white/10 font-black">Limpar</button><button id="check" class="px-6 py-3 rounded-full bg-fuchsia-500 font-black">Conferir frase</button></div><p id="feedback" class="text-center font-black mt-4 min-h-6" aria-live="polite"></p></section></main><div id="mobile-nav-placeholder"></div><script src="auth-secure.js?v=auth20260918"></script>

Components.mount('top-nav-placeholder',Components.renderTopNav('games'));Components.mount('side-nav-placeholder',Components.renderSideNav('games'));Components.mount('mobile-nav-placeholder',Components.renderMobileNav('games'));
const PHRASES=[['I','like','to','read'],['She','is','my','teacher'],['We','go','to','school'],['Where','is','the','station'],['They','play','in','the','park'],['I','would','like','some','water'],['The','book','is','on','the','table'],['Can','you','help','me'],['He','wakes','up','early']];const HINTS=['Eu gosto de ler.','Ela é minha professora.','Nós vamos à escola.','Onde fica a estação?','Eles brincam no parque.','Eu gostaria de água.','O livro está sobre a mesa.','Você pode me ajudar?','Ele acorda cedo.'];let order=[],step=0,points=0,chosen=[];const shuffle=a=>[...a].sort(()=>Math.random()-.5);function render(){if(step>=7)return finish();chosen=[];const idx=order[step],words=PHRASES[idx];round.textContent=`${step+1} / 7`;score.textContent=`${points} XP`;hint.textContent=HINTS[idx];built.innerHTML='';bank.innerHTML=shuffle(words.map((w,i)=>({w,i}))).map(x=>`<button class="word px-4 py-3 rounded-xl bg-white/10 hover:bg-fuchsia-500 font-black" data-i="${x.i}">${x.w}</button>`).join('');bank.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b,words))}function pick(btn,words){chosen.push({i:+btn.dataset.i,w:btn.textContent});btn.disabled=true;btn.classList.add('opacity-30');built.innerHTML=chosen.map((x,n)=>`<button onclick="removeWord(${n})" class="word px-4 py-3 rounded-xl bg-fuchsia-500 font-black">${x.w}</button>`).join('')}function removeWord(n){chosen.splice(n,1);renderChosen()}function renderChosen(){const idx=order[step],words=PHRASES[idx];bank.querySelectorAll('button').forEach(b=>{const used=chosen.some(x=>x.i===+b.dataset.i);b.disabled=used;b.classList.toggle('opacity-30',used)});built.innerHTML=chosen.map((x,n)=>`<button onclick="removeWord(${n})" class="word px-4 py-3 rounded-xl bg-fuchsia-500 font-black">${x.w}</button>`).join('')}clear.onclick=()=>{chosen=[];renderChosen()};check.onclick=()=>{const target=PHRASES[order[step]].join(' '),answer=chosen.map(x=>x.w).join(' '),ok=answer===target;if(ok){points+=12;feedback.textContent='Caminho aberto! +12 XP';feedback.className='text-center font-black mt-4 min-h-6 text-emerald-300';setTimeout(()=>{step++;feedback.textContent='';render()},900)}else{feedback.textContent='Ainda não. Toque nas peças para reorganizar.';feedback.className='text-center font-black mt-4 min-h-6 text-amber-300'}};function finish(){if(window.Store){Store.addXP(points);Store.completeActivity('games');Store.activateStreak()}document.querySelector('section').innerHTML=`<div class="text-center py-8"><div class="text-7xl">🧩</div><h2 class="text-4xl font-black mt-4">Trilha completa!</h2><p class="text-fuchsia-300 text-2xl font-black mt-2">+${points} XP</p><div class="flex justify-center gap-3 mt-7"><button onclick="location.reload()" class="bg-white/10 px-6 py-3 rounded-full font-black">Jogar novamente</button><a href="5_Game_Pavilion_Forest_Edition.html" class="bg-fuchsia-500 px-6 py-3 rounded-full font-black">Mais games</a></div></div>`}order=shuffle(PHRASES.map((_,i)=>i));render();</script><script src="celebration.js?v=cel3"></script>
