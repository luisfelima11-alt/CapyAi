const ITEMS=[['bridge','ponte','🌉'],['cloud','nuvem','☁️'],['kitchen','cozinha','🍳'],['ticket','passagem','🎫'],['teacher','professor','🧑‍🏫'],['morning','manhã','🌅'],['market','mercado','🧺'],['journey','viagem','🧭'],['window','janela','🪟'],['flower','flor','🌸'],['question','pergunta','❓'],['answer','resposta','✅']];let order=[],step=0,points=0,locked=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(){const u=new SpeechSynthesisUtterance(order[step][0]);u.lang='en-US';u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)}function render(){if(step>=8)return finish();locked=false;const correct=order[step],opts=shuffle([correct,...shuffle(ITEMS.filter(x=>x!==correct)).slice(0,3)]);round.textContent=`${step+1} / 8`;score.textContent=`${points} XP`;bar.style.width=`${(step+1)/8*100}%`;answers.innerHTML=opts.map(x=>`<button class="answer rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 font-black px-4 py-4" data-word="${x[0]}">${x[2]} ${x[1]}</button>`).join('');feedback.textContent='';answers.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b,correct));setTimeout(speak,250)}function choose(btn,correct){if(locked)return;locked=true;const ok=btn.dataset.word===correct[0];if(ok){points+=10;btn.classList.add('bg-emerald-500');feedback.textContent='Muito bem! +10 XP';feedback.className='text-center font-black mt-5 min-h-6 text-emerald-300'}else{btn.classList.add('bg-red-500');feedback.textContent=`Era “${correct[1]}”. Ouça mais uma vez.`;feedback.className='text-center font-black mt-5 min-h-6 text-red-300';speak()}setTimeout(()=>{step++;render()},1100)}function finish(){if(window.Store){Store.addXP(points);Store.completeActivity('games');Store.activateStreak()}document.querySelector('section').innerHTML=`<div class="text-center py-8"><div class="text-7xl">🏁</div><h2 class="text-4xl font-black mt-4">Sprint concluído!</h2><p class="text-sky-300 text-2xl font-black mt-2">+${points} XP</p><div class="flex justify-center gap-3 mt-7"><button onclick="start()" class="bg-white/10 px-6 py-3 rounded-full font-black">Jogar novamente</button><a href="5_Game_Pavilion_Forest_Edition.html" class="bg-sky-500 px-6 py-3 rounded-full font-black">Mais games</a></div></div>`}function start(){location.reload()}listen.onclick=speak;order=shuffle(ITEMS);render();</script><script src="celebration.js?v=cel3"></script>
