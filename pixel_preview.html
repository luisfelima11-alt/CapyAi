<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body { background:#0a1628; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; gap:40px; flex-wrap:wrap; }
  .card { display:flex; flex-direction:column; align-items:center; gap:12px; }
  p { color:#94a3b8; font-family:sans-serif; font-size:13px; font-weight:600; }
  canvas { image-rendering:pixelated; border-radius:50%; }
  .badge { width:90px; height:90px; border-radius:50%; background:#fff; border:4px solid #ec4899; display:flex; align-items:center; justify-content:center; box-shadow:0 0 24px rgba(236,72,153,.5); }
</style>
</head>
<body>
<script>
// Color palette
const T = null; // transparent
const colors = {
  P:'#FF69B4', // pink beret light
  p:'#C2185B', // pink beret dark
  D:'#4A2810', // dark brown outline
  B:'#8B5E3C', // brown body
  b:'#A0714F', // medium brown
  M:'#C49A6C', // muzzle tan
  N:'#1A0500', // near-black eyes/nose
  W:'#F5E6D3', // white eye
};

// 16x16 pixel art — front-facing capybara with pink beret
const grid = [
  [T,T,T,'p','P','P','P','P','P','P','P','p',T,T,T,T],
  [T,T,'p','P','P','P','P','P','P','P','P','P','p',T,T,T],
  [T,'p','P','P','P','P','P','P','P','P','P','P','P','p',T,T],
  [T,'p','p','p','p','p','p','p','p','p','p','p','p','p',T,T],
  [T,T,'D','D','D','D','D','D','D','D','D','D','D',T,T,T],
  [T,'D','B','B','B','B','B','B','B','B','B','B','B','D',T,T],
  ['D','D','B','B','B','B','B','B','B','B','B','B','B','D','D',T],
  ['D','B','B','B','W','N','B','B','B','N','W','B','B','B','B','D'],
  ['D','B','B','B','N','N','B','B','B','N','N','B','B','B','B','D'],
  ['D','B','B','M','M','M','M','M','M','M','M','M','B','B','B','D'],
  ['D','B','B','M','N','N','N','N','N','N','N','M','B','B','B','D'],
  ['D','D','B','B','b','M','M','M','M','M','b','B','B','D','D',T],
  [T,'D','D','B','B','B','B','B','B','B','B','B','D','D',T,T],
  [T,T,'D','D','D','D','D','D','D','D','D','D','D',T,T,T],
  [T,T,T,'D','D','D','D','D','D','D','D','D',T,T,T,T],
  [T,T,T,T,T,T,T,T,T,T,T,T,T,T,T,T],
];

function drawCapy(canvas, scale) {
  const S = scale;
  canvas.width  = 16 * S;
  canvas.height = 16 * S;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < 16; r++) {
    for (let c = 0; c < 16; c++) {
      const key = grid[r][c];
      if (!key) continue;
      ctx.fillStyle = colors[key];
      ctx.fillRect(c * S, r * S, S, S);
    }
  }
}

// Render three sizes
window.onload = () => {
  const sizes = [
    { scale:4,  label:'Small (64px)' },
    { scale:8,  label:'Medium (128px)' },
    { scale:14, label:'Large (224px)' },
  ];

  sizes.forEach(({scale, label}) => {
    const card = document.createElement('div');
    card.className = 'card';

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.style.width  = (16 * scale + 16) + 'px';
    badge.style.height = (16 * scale + 16) + 'px';

    const cv = document.createElement('canvas');
    drawCapy(cv, scale);
    badge.appendChild(cv);

    const lbl = document.createElement('p');
    lbl.textContent = label;

    card.appendChild(badge);
    card.appendChild(lbl);
    document.body.appendChild(card);
  });
};
</script>
</body>
</html>
