<main class="md:pl-24 pb-32 md:pb-12 pt-20">
  <div class="max-w-2xl mx-auto px-4">

    <!-- Header -->
    <a href="classes_agro.html" class="inline-flex items-center gap-1 text-slate-400 hover:text-emerald-600 text-sm font-bold transition-colors mb-4">← Voltar ao curso</a>
    <div class="bg-gradient-to-br from-navy via-emerald-950 to-green-900 text-white rounded-3xl p-6 mb-6 card-in">
      <div class="flex items-center gap-3 mb-2">
        <span class="text-4xl">🌱</span>
        <div>
          <h1 class="text-2xl font-black">Prática Diária Agro English</h1>
          <p class="text-emerald-200/80 text-sm font-bold">28 unidades · 112 mini-lições do básico ao campo, GPS e agronomia</p>
        </div>
      </div>
      <div class="flex items-center gap-3 mt-4">
        <div class="flex-1 bg-white/10 rounded-full h-3 overflow-hidden">
          <div id="agro-progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-green-300 rounded-full transition-all" style="width:0%"></div>

    <!-- Continue card -->
    <div id="agro-continue" class="hidden card-in bg-white border-2 border-emerald-200 rounded-3xl p-5 mb-8 shadow-sm">

        <button id="agro-cont-btn" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white font-black px-6 py-3 rounded-2xl hover:scale-105 active:scale-95 transition-all">▶ Continuar</button>

    <!-- Trail -->

    <!-- All done -->

      <p class="font-black text-xl mb-1">Prática completa!</p>
      <p class="text-emerald-100 text-sm">Você treinou todas as 28 unidades (112 mini-lições). Continue revisitando pra manter o inglês afiado!</p>

<div id="mobile-nav-placeholder"></div>

<script src="capy-skins.js?v=skins1"></script>
<script src="auth-secure.js?v=skins1"></script>
<script src="store.js?v=xpfix"></script>
<script src="streak-overlay.js?v=land1"></script>
<script src="components.js?v=som2"></script>
<script src="yara-widget.js?v=yw7"></script>
<script>
Components.mount('top-nav-placeholder', Components.renderTopNav('classes'));
Components.mount('side-nav-placeholder', Components.renderSideNav('classes'));
Components.mount('mobile-nav-placeholder', Components.renderMobileNav('classes'));

// ── Trilha Agro English: 28 lições × 4 minis = 112 nós ────────────────────
const TRAIL_AGRO = [
  { id:701, emoji:'👋', title:'Hello & Good Morning', block:'Bloco 1 · Primeiros Passos (Aulas 1–3)' },
  { id:702, emoji:'😊', title:'How Are You?' },
  { id:703, emoji:'👉', title:'What Is This? What Is That?' },
  { id:704, emoji:'🔢', title:'Numbers 1 to 12' },
  { id:705, emoji:'🎨', title:'Colors' },
  { id:706, emoji:'🔤', title:'My Name Is… (the alphabet)' },
  { id:707, emoji:'🏡', title:'The Farm and the Workshop', block:'Bloco 2 · Fazenda, Rotina & Máquinas (Aulas 4–8)' },
  { id:708, emoji:'⏰', title:'Days and Time' },
  { id:709, emoji:'👨‍👩‍👧', title:'Family and People' },
  { id:710, emoji:'🍽️', title:'Food and the Crops' },
  { id:711, emoji:'🔧', title:'Tools and Machines' },
  { id:712, emoji:'🙏', title:'Please, Thank You and Sorry' },
  { id:713, emoji:'💼', title:'What Do You Do? (Work & Study)', block:'Bloco 3 · Trabalho, Lazer, Clima & Cabine (Aulas 5–12)' },
  { id:714, emoji:'🌅', title:'Every Day at Six (Daily Routine)' },
  { id:715, emoji:'⚽', title:'Do You Like Soccer? (Sports & Free Time)' },
  { id:716, emoji:'🎸', title:'Country Music, Movies & Friends' },
  { id:717, emoji:'🚜', title:'Can You Drive a Tractor?' },
  { id:718, emoji:'🌦️', title:'The Weather Today (Sun, Rain & Frost)' },
  { id:719, emoji:'📡', title:'GPS & Screens in the Cab' },
  { id:720, emoji:'🚛', title:'Trucks, Tires & the Road' },
  { id:721, emoji:'🔧', title:"I'm Working Right Now", block:'Bloco 4 · Agronomia, Peças, Passado & Futuro (Aulas 11–20)' },
  { id:722, emoji:'🌱', title:'Planting, Seeds & the Soil' },
  { id:723, emoji:'💦', title:'Spraying & Crop Protection' },
  { id:724, emoji:'💰', title:'How Much Is This Part?' },
  { id:725, emoji:'📅', title:'Yesterday at the Farm (Was & Were)' },
  { id:726, emoji:'🛻', title:'I Went to the Field (Past Actions)' },
  { id:727, emoji:'🏁', title:'Faster, Bigger, Better (Comparing Machines)' },
  { id:728, emoji:'🎓', title:'Next Harvest & My Future in Agronomy' },
];
const TOTAL_NODES = TRAIL_AGRO.length * 4;
const DAY_SUBS = ['Listen & Quiz','Game','Build & Speak','Chat with Yara'];

function miniDone(lessonId, miniNum) {
  if (window.Store && Store.state.completedLessons && Store.state.completedLessons.includes(lessonId)) return true;
  return window.Store ? Store.isMiniDone(lessonId, miniNum) : false;
}

function nextMini() {
  for (const l of TRAIL_AGRO) for (let m = 1; m <= 4; m++)
    if (!miniDone(l.id, m)) return { lesson: l, mini: m };
  return null;
}

function openMini(lessonId, miniNum) {
  window.location.href = `lessons.html?lesson=${lessonId}&mini=${miniNum}&guided=1`;
}

function render() {
  const cont = document.getElementById('agro-trail');
  const next = nextMini();
  let done = 0, html = '';

  TRAIL_AGRO.forEach((l, idx) => {
    if (l.block) {
      html += `<div class="pt-4 pb-1 px-2"><span class="inline-block text-xs font-black uppercase tracking-wider text-emerald-700 bg-emerald-100/80 border border-emerald-200 px-3 py-1 rounded-full">${l.block}</span></div>`;
    }
    let rows = '';
    for (let m = 1; m <= 4; m++) {
      const isDone = miniDone(l.id, m);
      if (isDone) done++;
      const isCurrent = next && next.lesson.id === l.id && next.mini === m;
      rows += `
        <button onclick="openMini(${l.id},${m})"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl border-2 text-left transition-all active:scale-[.98]
            ${isDone ? 'bg-emerald-50 border-emerald-200' : isCurrent ? 'bg-white border-emerald-400 node-current' : 'bg-white border-slate-100 hover:border-emerald-200'}">
          <span class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm flex-shrink-0
            ${isDone ? 'bg-emerald-500 text-white' : isCurrent ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}">
            ${isDone ? '✓' : 'D' + m}
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-black text-sm ${isDone ? 'text-emerald-700' : 'text-navy'}">Day ${m} — ${DAY_SUBS[m-1]}</span>
          </span>
          ${isCurrent ? '<span class="text-[10px] font-black bg-emerald-500 text-white px-2.5 py-1 rounded-full flex-shrink-0">COMEÇAR</span>' : ''}
        </button>`;
    }
    html += `
      <div class="card-in bg-white/70 border border-emerald-100 rounded-3xl p-4">
        <div class="flex items-center gap-2 mb-3 px-1">
          <span class="text-2xl">${l.emoji}</span>
          <span class="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg">#${idx + 1}</span>
          <span class="font-black text-navy">${l.title}</span>
        </div>
        <div class="space-y-2">${rows}</div>
      </div>`;

    if ((idx + 1) % 10 === 0) {
      const bloco = ((idx + 1) / 10) <= 1 ? 1 : 2;
      html += `
        <div class="card-in bg-gradient-to-r from-green-600 to-emerald-700 text-white rounded-3xl p-5 shadow-lg my-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div class="flex items-center gap-3.5">
            <span class="text-3xl">⚡</span>
            <div>
              <span class="text-[10px] font-black uppercase tracking-widest bg-white/20 px-2.5 py-0.5 rounded-full">Checkpoint · Unidades ${idx - 8} a ${idx + 1}</span>
              <p class="font-black text-base mt-0.5">Mini-Prova ${bloco} — Agro English (15 min)</p>
              <p class="text-xs text-green-100">Teste prático a cada 10 unidades com expressões da fazenda, máquinas, Listening e Speaking.</p>
            </div>
          </div>
          <a href="mini_prova.html?curso=agro&bloco=${bloco}" class="w-full sm:w-auto text-center bg-white text-green-900 font-black text-xs px-4 py-2.5 rounded-xl shadow hover:bg-green-50 transition shrink-0">
            ⚡ Fazer Mini-Prova →
          </a>
        </div>`;
    }
  });

  html += `
    <div class="card-in bg-gradient-to-br from-green-950 via-emerald-900 to-lime-950 text-white rounded-3xl p-6 shadow-xl mt-4 border-2 border-green-400 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <span class="text-4xl">🏆</span>
        <div>
          <span class="text-[10px] font-black uppercase tracking-widest bg-green-400/20 text-green-200 px-2.5 py-0.5 rounded-full border border-green-400/30">Avaliação Final · 30 Minutos · 40 Questões</span>
          <p class="font-black text-lg mt-0.5">Prova Final — Agro English</p>
          <p class="text-xs text-green-100">Expressões de fazenda, máquinas agrícolas, plantio, colheita, Listening e Speaking no campo.</p>
        </div>
      </div>
      <a href="agro_prova.html" class="w-full sm:w-auto text-center bg-gradient-to-r from-green-400 to-emerald-400 text-navy font-black text-xs sm:text-sm px-5 py-3 rounded-xl shadow-lg hover:scale-105 transition shrink-0">
        🚀 Fazer Prova Final →
      </a>
    </div>`;

  cont.innerHTML = html;
  document.getElementById('agro-progress-bar').style.width = Math.round(done / TOTAL_NODES * 100) + '%';
  document.getElementById('agro-progress-label').textContent = done + ' / ' + TOTAL_NODES;

  if (next) {
    const c = document.getElementById('agro-continue');
    c.classList.remove('hidden');
    document.getElementById('agro-cont-emoji').textContent = next.lesson.emoji;
    document.getElementById('agro-cont-title').textContent = next.lesson.title;
    document.getElementById('agro-cont-sub').textContent = `Day ${next.mini} — ${DAY_SUBS[next.mini-1]}`;
    document.getElementById('agro-cont-btn').onclick = () => openMini(next.lesson.id, next.mini);
    if (done === 0) document.querySelector('#agro-continue p').textContent = 'Comece por aqui';
  } else {
    document.getElementById('agro-done').classList.remove('hidden');
  }
}

render();
document.addEventListener('stateChanged', render);
</script>
</body>
</html>
