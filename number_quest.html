<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Number Quest — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config={darkMode:"class",theme:{extend:{
  colors:{"navy":"#001f3f","navy-light":"#002d5c","pink-brand":"#ec4899","green-brand":"#10b981"},
  fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
  borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
}}}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{0%{transform:scale(0.6)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  @keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(200px) rotate(360deg);opacity:0}}

  .fade-up{animation:fadeUp 0.4s ease both;}
  .pop-in{animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275) both;}
  .bounce-item{animation:bounce 0.6s ease;}
  .shake{animation:shake 0.35s ease;}

  /* Mode tabs */
  .mode-tab{
    flex:1;padding:12px 8px;border-radius:1.25rem;cursor:pointer;
    font-family:'Lexend',sans-serif;font-weight:700;font-size:0.8rem;text-align:center;
    background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);color:#94a3b8;
    transition:all 0.15s;-webkit-tap-highlight-color:transparent;
  }
  .mode-tab.active{background:rgba(251,146,60,0.3);border-color:#fb923c;color:#fed7aa;}

  /* Answer options */
  .ans-btn{
    padding:18px 12px;border-radius:1.5rem;cursor:pointer;
    font-family:'Lexend',sans-serif;font-weight:700;font-size:1.1rem;text-align:center;
    background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.12);color:#fff;
    transition:all 0.15s;-webkit-tap-highlight-color:transparent;
  }
  .ans-btn:hover:not(:disabled){background:rgba(255,255,255,0.16);transform:translateY(-2px);}
  .ans-btn:active:not(:disabled){transform:scale(0.95);}
  .ans-btn.correct{background:rgba(16,185,129,0.3);border-color:#10b981;color:#6ee7b7;}
  .ans-btn.wrong  {background:rgba(244,63,94,0.25);border-color:#f43f5e;color:#fca5a5;}

  /* Count dots */
  .count-dot{width:28px;height:28px;border-radius:50%;background:rgba(251,146,60,0.5);border:2px solid #fb923c;display:inline-block;margin:3px;}
  .count-dot.highlight{background:#fb923c;box-shadow:0 0 12px #fb923c80;}

  .confetti-piece{position:fixed;pointer-events:none;z-index:9999;width:9px;height:9px;border-radius:2px;animation:confettiFall 1.1s ease-out forwards;}
</style>
</head>
<body class="bg-navy font-body text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center gap-4 px-5 py-4 border-b border-white/10 bg-navy/90 backdrop-blur sticky top-0 z-50">
  <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-90">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <div class="flex-1">
    <p class="font-label text-xs text-orange-400 uppercase tracking-widest font-bold">Number Quest</p>
    <h1 class="font-headline font-bold text-white text-lg leading-none">Count &amp; Learn! 🔢</h1>
  </div>
  <div class="bg-white/10 border border-white/15 rounded-full px-4 py-2 font-label font-bold text-sm">
    <span id="score-disp">0</span> pts
  </div>
  <div class="bg-orange-500/20 border border-orange-500/40 rounded-full px-4 py-2 font-label font-bold text-sm text-orange-300">
    Q <span id="q-num">1</span>/10
  </div>
</header>

<main class="flex-1 flex flex-col gap-5 px-4 py-5 max-w-md mx-auto w-full">

  <!-- Mode tabs -->
  <div class="flex gap-2 fade-up" id="mode-tabs">
    <button class="mode-tab active" onclick="setMode('count',this)">🔢 Count</button>
    <button class="mode-tab" onclick="setMode('words',this)">📝 Word</button>
    <button class="mode-tab" onclick="setMode('math',this)">➕ Math</button>
    <button class="mode-tab" onclick="setMode('order',this)">📶 Order</button>
  </div>

  <!-- Progress bar -->
  <div class="h-2 bg-white/10 rounded-full overflow-hidden fade-up">
    <div id="prog-bar" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 rounded-full transition-all duration-500 w-0"></div>
  </div>

  <!-- Question card -->
  <div id="q-card" class="bg-gradient-to-br from-orange-950 to-navy-light border border-orange-500/20 rounded-[2.5rem] p-8 flex flex-col items-center gap-5 min-h-[220px] pop-in">
    <p class="font-label text-xs text-orange-400 uppercase tracking-widest font-bold" id="q-type-label">Count the objects</p>
    <div id="q-visual" class="text-center"></div>
    <p class="font-headline font-bold text-white text-2xl text-center" id="q-text"></p>
  </div>

  <!-- Answer grid -->
  <div class="grid grid-cols-2 gap-3 fade-up" id="ans-grid"></div>

  <!-- Feedback -->
  <div id="feedback" class="hidden bg-navy-light border border-white/10 rounded-2xl px-6 py-4 flex items-center gap-3 fade-up">
    <span class="text-3xl" id="fb-emoji">✅</span>
    <p class="font-body text-slate-300 text-sm" id="fb-text"></p>
  </div>

</main>

<script src="store.js"></script>
<script src="levelup-overlay.js"></script>
<script src="badge-toast.js"></script>
<script>
// ── Number data ────────────────────────────────────────────────────────────────
const NUMBER_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine',
                      'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const EMOJIS = ['🍎','🐱','⭐','🌸','🎈','🦋','🍕','🐸','🏀','🎵','🍦','🌈','🦄','🎁','🐬'];

// ── State ──────────────────────────────────────────────────────────────────────
let mode      = 'count';
let qNum      = 0;
let score     = 0;
let answered  = false;
const TOTAL   = 10;

// ── Boot ───────────────────────────────────────────────────────────────────────
nextQuestion();

// ── Mode ───────────────────────────────────────────────────────────────────────
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  qNum = 0; score = 0;
  document.getElementById('score-disp').textContent = 0;
  document.getElementById('feedback').classList.add('hidden');
  nextQuestion();
}

// ── Generate question ──────────────────────────────────────────────────────────
function nextQuestion() {
  answered = false;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('q-num').textContent = qNum + 1;
  document.getElementById('prog-bar').style.width = `${(qNum / TOTAL) * 100}%`;

  if (mode === 'count')  genCountQ();
  else if (mode === 'words') genWordQ();
  else if (mode === 'math')  genMathQ();
  else if (mode === 'order') genOrderQ();

  // Animate card
  const card = document.getElementById('q-card');
  card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
}

// ── COUNT: see dots/emojis, pick the number ───────────────────────────────────
function genCountQ() {
  const n    = Math.floor(Math.random() * 10) + 1;
  const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  document.getElementById('q-type-label').textContent = 'How many?';
  document.getElementById('q-visual').innerHTML = Array.from({length:n}, () =>
    `<span class="text-3xl">${emoji}</span>`
  ).join(' ');
  document.getElementById('q-text').textContent = '';
  renderAnswerGrid([n], () => {
    const opts = new Set([n]);
    while(opts.size < 4){ opts.add(Math.max(1, n + Math.floor(Math.random()*5) - 2)); }
    return [...opts].sort(() => Math.random()-0.5);
  }, n, v => String(v));
}

// ── WORDS: see number, pick the word ─────────────────────────────────────────
function genWordQ() {
  const n = Math.floor(Math.random() * 20) + 1;
  document.getElementById('q-type-label').textContent = 'What is the word for this number?';
  document.getElementById('q-visual').innerHTML = `<span class="font-headline text-8xl font-black text-orange-400">${n}</span>`;
  document.getElementById('q-text').textContent = '';

  const opts = new Set([n]);
  while(opts.size < 4){ opts.add(Math.floor(Math.random()*20)+1); }
  const shuffled = [...opts].sort(()=>Math.random()-0.5);
  renderAnswerGrid(null, ()=>shuffled, n, v => NUMBER_WORDS[v]);
}

// ── MATH: simple addition/subtraction ────────────────────────────────────────
function genMathQ() {
  const isAdd = Math.random() > 0.4;
  let a, b, ans;
  if (isAdd) {
    a = Math.floor(Math.random()*9)+1;
    b = Math.floor(Math.random()*9)+1;
    ans = a + b;
  } else {
    ans = Math.floor(Math.random()*9)+1;
    b   = Math.floor(Math.random()*(ans))+1;
    a   = ans + b;
  }
  const sym = isAdd ? '+' : '−';
  document.getElementById('q-type-label').textContent = isAdd ? 'Add the numbers!' : 'Subtract!';
  document.getElementById('q-visual').innerHTML = `
    <div class="flex items-center gap-4 justify-center">
      <span class="font-headline text-6xl font-black text-orange-400">${a}</span>
      <span class="font-headline text-4xl font-black text-white">${sym}</span>
      <span class="font-headline text-6xl font-black text-orange-400">${b}</span>
      <span class="font-headline text-4xl font-black text-white">=</span>
      <span class="font-headline text-6xl font-black text-white/30">?</span>
    </div>`;
  document.getElementById('q-text').textContent = '';

  const opts = new Set([ans]);
  while(opts.size < 4){ opts.add(Math.max(1, ans + Math.floor(Math.random()*7)-3)); }
  const shuffled = [...opts].sort(()=>Math.random()-0.5);
  renderAnswerGrid(null, ()=>shuffled, ans, v=>String(v));
}

// ── ORDER: what comes next? ────────────────────────────────────────────────────
function genOrderQ() {
  const start = Math.floor(Math.random()*15)+1;
  const seq   = [start, start+1, start+2, start+3];
  const missing = Math.floor(Math.random()*4); // which one is missing
  const ans   = seq[missing];
  const display = seq.map((n,i) => i === missing ? '?' : String(n));

  document.getElementById('q-type-label').textContent = 'What number is missing?';
  document.getElementById('q-visual').innerHTML = `
    <div class="flex gap-3 justify-center flex-wrap">
      ${display.map(n => `
        <div class="w-16 h-16 rounded-2xl flex items-center justify-center font-headline font-black text-2xl
             ${n==='?' ? 'bg-orange-500/20 border-2 border-orange-500 text-orange-400' : 'bg-navy border border-white/20 text-white'}">
          ${n}
        </div>`).join('')}
    </div>`;
  document.getElementById('q-text').textContent = '';

  const opts = new Set([ans]);
  while(opts.size < 4){ opts.add(Math.max(1, ans + Math.floor(Math.random()*7)-3)); }
  const shuffled = [...opts].sort(()=>Math.random()-0.5);
  renderAnswerGrid(null, ()=>shuffled, ans, v=>String(v));
}

// ── Render answer grid ─────────────────────────────────────────────────────────
function renderAnswerGrid(_, getOpts, correct, labelFn) {
  const opts = getOpts();
  document.getElementById('ans-grid').innerHTML = opts.map(v =>
    `<button class="ans-btn" onclick="checkAns(this, ${v}, ${correct})">${labelFn(v)}</button>`
  ).join('');
}

function checkAns(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);

  if (chosen === correct) {
    btn.classList.add('correct');
    score += 10;
    document.getElementById('score-disp').textContent = score;
    document.getElementById('fb-emoji').textContent = '✅';
    document.getElementById('fb-text').textContent  = `Correct! The answer is ${correct}. 🌟`;
    launchConfetti(8);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn').forEach(b => { if (+b.textContent === correct || b.textContent === NUMBER_WORDS[correct] || b.textContent === String(correct)) b.classList.add('correct'); });
    document.getElementById('fb-emoji').textContent = '💡';
    document.getElementById('fb-text').textContent  = `Not quite! The answer is ${correct}.`;
  }

  document.getElementById('feedback').classList.remove('hidden');

  qNum++;
  if (qNum >= TOTAL) {
    setTimeout(showGameOver, 1200);
  } else {
    setTimeout(() => {
      document.getElementById('feedback').classList.add('hidden');
      nextQuestion();
    }, 1300);
  }
}

// ── Game over ──────────────────────────────────────────────────────────────────
function showGameOver() {
  const stars = score >= 80 ? 3 : score >= 50 ? 2 : 1;
  const xp    = stars === 3 ? 40 : stars === 2 ? 25 : 10;
  if (window.Store) { Store.addXP(xp); Store.completeActivity('games'); Store.completeActivity('number_quest'); if (stars === 3) Store.unlockBadge('number_wizard'); }
  if (stars >= 2) launchConfetti(40);

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-orange-500/40
         rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-7xl">🔢</div>
      <div>
        <p class="font-label text-orange-400 font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
        <h2 class="font-headline text-5xl font-black text-white mb-1">${score} pts</h2>
        <p class="font-body text-slate-300">${score/10}/${TOTAL} correct</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-slate-600'}" style="font-variation-settings:'FILL' ${i<=stars?1:0};">star</span>`).join('')}
      </div>
      <p class="font-body text-slate-400 text-sm">+${xp} XP earned!</p>
      <div class="flex gap-3">
        <button onclick="location.reload()" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">Play Again 🔄</button>
        <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'" class="bg-orange-500 hover:bg-orange-400 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-orange-500/30">Games 🌿</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const f=document.getElementById('fin'); f.style.transform='scale(1)'; f.style.opacity='1'; }));
}

function launchConfetti(count=35) {
  const colors=['#fb923c','#ec4899','#06b6d4','#facc15','#10b981'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${colors[i%colors.length]};animation-delay:${Math.random()*0.6}s;animation-duration:${0.9+Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2000);
  }
}
</script>
</body>
</html>
