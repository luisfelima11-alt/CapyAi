<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Matching Pairs — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{"primary":"#001f3f","secondary":"#ec4899","tertiary":"#10b981","surface-container":"#002a54"},
    fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
    borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
  }}
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

  /* Card flip */
  .card-wrap { perspective: 600px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  .card-wrap.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
  }
  .card-back-face  { background: linear-gradient(135deg, #002a54, #001f3f); border: 2px solid rgba(255,255,255,0.1); }
  .card-front-face { transform: rotateY(180deg); border: 2px solid rgba(255,255,255,0.15);
                     background: linear-gradient(135deg, #0a3060, #002a54); }
  .card-wrap.matched .card-front-face { border-color: #10b981; background: linear-gradient(135deg,rgba(16,185,129,0.2),rgba(16,185,129,0.05)); }
  .card-wrap.matched .card-inner { transform: rotateY(180deg); }

  /* Animations */
  @keyframes matched-pop { 0%{transform:rotateY(180deg)scale(1)} 40%{transform:rotateY(180deg)scale(1.12)} 100%{transform:rotateY(180deg)scale(1)} }
  @keyframes wrong-shake  { 0%,100%{transform:rotateY(180deg)translateX(0)} 25%{transform:rotateY(180deg)translateX(-6px)} 75%{transform:rotateY(180deg)translateX(6px)} }
  .do-match { animation: matched-pop 0.4s ease; }
  .do-wrong  { animation: wrong-shake 0.35s ease; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .fade-up { animation: fadeUp 0.4s ease both; }

  @keyframes spark { 0%{opacity:1;transform:translate(0,0)scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0)} }
  .spark { position:fixed; width:9px; height:9px; border-radius:50%; animation:spark 0.85s ease forwards; pointer-events:none; z-index:9999; }

  /* Timer ring */
  #timer-ring { transition: stroke-dashoffset 1s linear; }

  /* Progress bar */
  #prog-fill { transition: width 0.5s ease; }
</style>
</head>
<body class="bg-primary font-body text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center gap-4 px-6 py-4 border-b border-white/10 bg-primary/90 backdrop-blur flex-shrink-0">
  <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <div>
    <p class="font-label text-xs text-cyan-400 uppercase tracking-widest font-bold">Matching Pairs</p>
    <h1 class="font-headline font-bold text-white text-lg leading-none">Find the matches! 🃏</h1>
  </div>
  <div class="ml-auto flex items-center gap-4">
    <!-- Timer ring -->
    <div class="relative w-12 h-12">
      <svg viewBox="0 0 48 48" class="w-full h-full -rotate-90">
        <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
        <circle id="timer-ring" cx="24" cy="24" r="20" fill="none" stroke="#06b6d4" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="125.7" stroke-dashoffset="0"/>
      </svg>
      <span id="timer-txt" class="absolute inset-0 flex items-center justify-center font-headline font-black text-sm text-white">60</span>
    </div>
    <div class="bg-white/10 border border-white/15 rounded-full px-4 py-2 font-label font-bold text-sm">
      <span id="score-disp">0</span> pts
    </div>
  </div>
</header>

<div class="h-1.5 bg-white/10">
  <div id="prog-fill" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 w-0"></div>
</div>

<!-- Round label -->
<div class="text-center py-4 fade-up">
  <p class="font-label text-cyan-400 text-sm font-bold uppercase tracking-widest" id="round-lbl">Round 1 — Match the word to the emoji!</p>
</div>

<!-- Card grid -->
<main class="flex-1 flex items-center justify-center px-4 pb-8">
  <div id="card-grid" class="grid gap-3 w-full max-w-lg" style="grid-template-columns: repeat(4, 1fr);">
    <!-- cards injected by JS -->
  </div>
</main>

<script src="store.js?v=c52d7db"></script>
<script src="levelup-overlay.js?v=c52d7db"></script>
<script src="badge-toast.js?v=c52d7db"></script>
<script>
// ── Card pairs ────────────────────────────────────────────────────────────────
const ALL_PAIRS = [
  { word:'Cat',       emoji:'🐱' }, { word:'Dog',       emoji:'🐶' },
  { word:'Sun',       emoji:'☀️' }, { word:'Tree',      emoji:'🌳' },
  { word:'Fish',      emoji:'🐟' }, { word:'Bird',      emoji:'🐦' },
  { word:'Cake',      emoji:'🎂' }, { word:'Star',      emoji:'⭐' },
  { word:'Rain',      emoji:'🌧️' }, { word:'Frog',      emoji:'🐸' },
  { word:'Apple',     emoji:'🍎' }, { word:'Moon',      emoji:'🌙' },
];

const ROUNDS = [
  { pairs: 4, time: 60, label: 'Round 1 — Match the word to the emoji!' },
  { pairs: 6, time: 75, label: 'Round 2 — More pairs, can you find them?' },
  { pairs: 8, time: 90, label: 'Round 3 — Expert level! 💪' },
];

// ── State ─────────────────────────────────────────────────────────────────────
let round        = 0;
let score        = 0;
let matchedCount = 0;
let flipped      = [];   // at most 2 card elements
let locked       = false; // prevent clicking during check
let timerInterval = null;
let timeLeft     = 60;

// ── Boot ──────────────────────────────────────────────────────────────────────
startRound();

function startRound() {
  matchedCount = 0;
  flipped      = [];
  locked       = false;
  const cfg    = ROUNDS[round];
  timeLeft     = cfg.time;

  document.getElementById('round-lbl').textContent = cfg.label;
  document.getElementById('prog-fill').style.width = `${(round / ROUNDS.length) * 100}%`;
  updateTimerRing();

  // Pick random pairs
  const chosen = [...ALL_PAIRS].sort(() => Math.random() - 0.5).slice(0, cfg.pairs);

  // Build cards array: one word card + one emoji card per pair
  const cards = [];
  chosen.forEach((p, i) => {
    cards.push({ id: i, type: 'word',  content: p.word,  pairId: i });
    cards.push({ id: i, type: 'emoji', content: p.emoji, pairId: i });
  });
  cards.sort(() => Math.random() - 0.5);

  // Adjust grid columns
  const cols = cfg.pairs <= 4 ? 4 : cfg.pairs <= 6 ? 4 : 4;
  document.getElementById('card-grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  // Render
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  cards.forEach((card, idx) => {
    const wrap = document.createElement('div');
    wrap.className    = 'card-wrap fade-up';
    wrap.style.animationDelay = `${idx * 0.04}s`;
    wrap.style.height = '100px';
    wrap.dataset.pairId = card.pairId;
    wrap.dataset.type   = card.type;
    wrap.dataset.content = card.content;

    wrap.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back-face">
          <span class="material-symbols-outlined text-3xl text-cyan-500/40" style="font-variation-settings:'FILL' 1;">style</span>
        </div>
        <div class="card-face card-front-face flex-col gap-1">
          ${card.type === 'emoji'
            ? `<span class="text-4xl">${card.content}</span>`
            : `<span class="font-headline font-black text-white text-lg">${card.content}</span>`
          }
        </div>
      </div>`;

    wrap.addEventListener('click', () => flipCard(wrap));
    grid.appendChild(wrap);
  });

  // Start timer
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
}

// ── Timer ─────────────────────────────────────────────────────────────────────
function tickTimer() {
  timeLeft--;
  document.getElementById('timer-txt').textContent = timeLeft;
  updateTimerRing();
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    showRoundEnd(false);
  }
}

function updateTimerRing() {
  const cfg  = ROUNDS[round];
  const pct  = timeLeft / cfg.time;
  const circ = 125.7;
  document.getElementById('timer-ring').style.strokeDashoffset = circ * (1 - pct);
  document.getElementById('timer-ring').setAttribute('stroke', timeLeft <= 10 ? '#ef4444' : '#06b6d4');
}

// ── Flip a card ───────────────────────────────────────────────────────────────
function flipCard(card) {
  if (locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    locked = true;
    setTimeout(checkMatch, 600);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const sameId   = a.dataset.pairId === b.dataset.pairId;
  const diffType = a.dataset.type   !== b.dataset.type;

  if (sameId && diffType) {
    // ✅ Match!
    a.classList.add('matched'); b.classList.add('matched');
    a.classList.add('do-match'); b.classList.add('do-match');
    setTimeout(() => { a.classList.remove('do-match'); b.classList.remove('do-match'); }, 450);

    const pts = Math.ceil(timeLeft / 5) + 5;
    score += pts;
    document.getElementById('score-disp').textContent = score;
    launchSparksAt(a);
    matchedCount++;

    flipped = [];
    locked  = false;

    if (matchedCount === ROUNDS[round].pairs) {
      clearInterval(timerInterval);
      setTimeout(() => showRoundEnd(true), 700);
    }
  } else {
    // ❌ No match
    a.classList.add('do-wrong'); b.classList.add('do-wrong');
    setTimeout(() => {
      a.classList.remove('flipped','do-wrong');
      b.classList.remove('flipped','do-wrong');
      flipped = [];
      locked  = false;
    }, 900);
  }
}

// ── Round end ─────────────────────────────────────────────────────────────────
function showRoundEnd(success) {
  const isLastRound = round >= ROUNDS.length - 1;

  if (success && !isLastRound) {
    // Brief success toast, advance
    showToast(`✅ Round ${round+1} complete! +bonus 🎉`, '#10b981');
    round++;
    setTimeout(startRound, 1500);
    return;
  }

  // Final / time-out overlay
  const xpEarned = Math.round(score / 5) + 10;
  const stars    = success ? 3 : matchedCount >= ROUNDS[round].pairs / 2 ? 2 : 1;

  if (window.Store) {
    Store.addXP(xpEarned);
    Store.activateStreak();
    Store.completeActivity('games');
    if (stars === 3) Store.unlockBadge('game_hero');
  }

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-cyan-500/60
         rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-7xl">${success ? '🏆' : '⏰'}</div>
      <div>
        <p class="font-label text-cyan-400 font-bold text-sm uppercase tracking-widest mb-1">
          ${success ? 'All Matched!' : "Time's Up!"}
        </p>
        <h2 class="font-headline text-5xl font-black text-white mb-1">+${xpEarned} XP</h2>
        <p class="font-body text-slate-300">Score: ${score} pts · ${matchedCount}/${ROUNDS[round].pairs} pairs found</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-white/20'}"
             style="font-variation-settings:'FILL' 1;">star</span>`).join('')}
      </div>
      ${stars===3?'<div class="bg-cyan-500/20 border border-cyan-500/40 rounded-xl px-4 py-2 text-cyan-300 font-label font-bold text-sm">🏅 Game Hero badge unlocked!</div>':''}
      <div class="flex gap-3 flex-wrap justify-center">
        <button onclick="restartGame()" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">Play Again 🔄</button>
        <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
                class="bg-cyan-500 hover:bg-cyan-400 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-cyan-500/30">Games 🌿</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f=document.getElementById('fin');
    f.style.transform='scale(1)'; f.style.opacity='1';
  }));
  launchSparksAt(document.getElementById('card-grid'));
}

function restartGame() {
  round = 0; score = 0;
  document.getElementById('score-disp').textContent = '0';
  document.querySelectorAll('[class*="fixed"]').forEach(el => { if(el.id!=='badge-toast-container') el.remove(); });
  startRound();
}

// ── Toast banner ──────────────────────────────────────────────────────────────
function showToast(msg, color) {
  const t = document.createElement('div');
  t.className = 'fixed top-24 left-1/2 -translate-x-1/2 z-50 font-label font-bold px-8 py-3 rounded-full shadow-xl text-white fade-up';
  t.style.background = color;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1400);
}

// ── Sparks ────────────────────────────────────────────────────────────────────
function launchSparksAt(el) {
  const colors = ['#06b6d4','#10b981','#f59e0b','#ec4899','#a855f7'];
  const rect   = el?.getBoundingClientRect() || { left: window.innerWidth/2, top: window.innerHeight/2, width:0, height:0 };
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  for (let i = 0; i < 14; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    const a = (i/14)*360, d = 50+Math.random()*70;
    sp.style.setProperty('--tx',`${Math.cos(a*Math.PI/180)*d}px`);
    sp.style.setProperty('--ty',`${Math.sin(a*Math.PI/180)*d}px`);
    sp.style.background = colors[i%colors.length];
    sp.style.left = cx+'px'; sp.style.top = cy+'px';
    document.body.appendChild(sp);
    setTimeout(()=>sp.remove(), 950);
  }
}
</script>
</body>
</html>
