<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sound Seekers — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config={darkMode:"class",theme:{extend:{
    colors:{"navy":"#001f3f","navy-light":"#002d5c","pink-brand":"#ec4899","green-brand":"#10b981"},
    fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
    borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"}
  }}}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .clue-card { animation: clueIn .5s cubic-bezier(.34,1.56,.64,1) both; }
  .tile-pop   { animation: tilePop .35s ease; }
  .tile-shake { animation: tileShake .4s ease; }
  @keyframes clueIn     { from{opacity:0;transform:scale(.85) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes tilePop    { 0%{transform:scale(1)} 45%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes tileShake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .sound-wave span { display:inline-block; animation: wave 1s ease-in-out infinite; }
  .sound-wave span:nth-child(2){animation-delay:.15s}
  .sound-wave span:nth-child(3){animation-delay:.3s}
  .sound-wave span:nth-child(4){animation-delay:.45s}
  .sound-wave span:nth-child(5){animation-delay:.6s}
  @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(2.2)} }
</style>
</head>
<body class="bg-navy font-body text-white min-h-screen overflow-x-hidden">
<div id="top-nav-placeholder"></div>
<div id="side-nav-placeholder"></div>

<main class="md:pl-32 pt-28 pb-20 px-4 flex flex-col items-center gap-8 max-w-2xl mx-auto">

  <!-- Header -->
  <div class="text-center">
    <span class="font-label text-sky-400 text-sm font-bold uppercase tracking-widest">Mini-Game</span>
    <h1 class="font-headline text-5xl md:text-6xl font-black text-white mt-1">Sound Seekers</h1>
    <p class="font-body text-slate-400 text-lg mt-1">Read the clue and find the matching picture!</p>
  </div>

  <!-- Stats bar -->
  <div class="w-full flex items-center justify-between bg-white/5 rounded-2xl px-6 py-4 border border-white/10">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-sky-400 text-2xl" style="font-variation-settings:'FILL' 1;">hearing</span>
      <span id="score-display" class="font-headline font-black text-2xl">0</span>
      <span class="font-label text-slate-400 text-sm">pts</span>
    </div>
    <span id="round-display" class="font-label text-slate-400 text-sm font-bold">Clue 1 / 8</span>
    <div id="hearts-display" class="flex gap-1"></div>
  </div>

  <!-- Clue card -->
  <div id="clue-card"
       class="clue-card w-full bg-gradient-to-br from-sky-900/60 to-navy rounded-[2.5rem]
              border border-sky-500/30 p-10 flex flex-col items-center gap-6 shadow-2xl">
    <!-- Animated sound icon -->
    <div class="flex items-end gap-1 h-10 sound-wave">
      <span class="w-1.5 rounded-full bg-sky-400 h-3"></span>
      <span class="w-1.5 rounded-full bg-sky-400 h-5"></span>
      <span class="w-1.5 rounded-full bg-sky-400 h-8"></span>
      <span class="w-1.5 rounded-full bg-sky-400 h-5"></span>
      <span class="w-1.5 rounded-full bg-sky-400 h-3"></span>
    </div>
    <div id="clue-emoji" class="text-7xl select-none">🎵</div>
    <p id="clue-text"
       class="font-headline text-2xl md:text-3xl font-bold text-white text-center leading-snug max-w-md">
      Loading clue…
    </p>
    <p id="clue-category" class="font-label text-sky-400 text-xs uppercase tracking-widest font-bold"></p>
  </div>

  <!-- Image tiles -->
  <div id="tiles-grid" class="w-full grid grid-cols-2 gap-5"></div>

  <!-- Feedback -->
  <div id="feedback-bar"
       class="w-full rounded-2xl px-8 py-5 flex items-center gap-4 text-lg font-label font-bold
              opacity-0 transition-opacity duration-300">
    <span id="feedback-icon" class="material-symbols-outlined text-3xl" style="font-variation-settings:'FILL' 1;"></span>
    <span id="feedback-text"></span>
  </div>

</main>

<div id="mobile-nav-placeholder"></div>
<div id="footer-placeholder"></div>

<script src="store.js"></script>
<script src="levelup-overlay.js"></script>
<script src="badge-toast.js"></script>
<script src="components.js?v=2"></script>
<script>
  Components.mount('top-nav-placeholder', Components.renderTopNav('games'));
  Components.mount('side-nav-placeholder', Components.renderSideNav('games'));
  Components.mount('mobile-nav-placeholder', Components.renderMobileNav('games'));
  Components.mount('footer-placeholder', Components.renderFooter());

  // ── Clue bank ─────────────────────────────────────────────────────────────
  // Each clue points to a correct SUBJECT and 3 distractors (by name)
  const SUBJECTS = {
    Apple:    { emoji:'🍎', image:'' },
    River:    { emoji:'🌊', image:'https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?auto=format&fit=crop&q=80&w=400&h=400' },
    Sun:      { emoji:'☀️', image:'https://images.unsplash.com/photo-1533316238634-118805fdbac9?auto=format&fit=crop&q=80&w=400&h=400' },
    Mountain: { emoji:'🏔️', image:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=400&h=400' },
    Bird:     { emoji:'🐦', image:'https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&q=80&w=400&h=400' },
    Tree:     { emoji:'🌳', image:'https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&q=80&w=400&h=400' },
    Flower:   { emoji:'🌸', image:'https://images.unsplash.com/photo-1490750967868-88df5691cc5e?auto=format&fit=crop&q=80&w=400&h=400' },
    Rain:     { emoji:'🌧️', image:'https://images.unsplash.com/photo-1428592953211-077101b2021b?auto=format&fit=crop&q=80&w=400&h=400' },
  };

  const CLUES = [
    { correct:'Bird',     emoji:'🐦', category:'Nature Sound', text:'"Tweet tweet! I wake up the whole forest every morning and soar through the sky with wings."', distractors:['Tree','Flower','River'] },
    { correct:'River',    emoji:'🌊', category:'Water Sound',  text:'"Splash! Gurgle! Fish swim inside me, and I flow from mountains all the way to the sea."', distractors:['Rain','Mountain','Apple'] },
    { correct:'Rain',     emoji:'🌧️', category:'Weather Sound', text:'"Pitter-patter, pitter-patter! I fall from clouds and make puddles on the ground."', distractors:['River','Sun','Flower'] },
    { correct:'Sun',      emoji:'☀️', category:'Nature Clue',  text:'"I am big, bright, and warm. Every morning I rise and give light to the whole world!"', distractors:['Mountain','Star','Tree'] },
    { correct:'Tree',     emoji:'🌳', category:'Forest Clue',  text:'"Rustle, rustle! I grow tall, my leaves dance in the wind, and birds build nests in me."', distractors:['Flower','Mountain','Apple'] },
    { correct:'Flower',   emoji:'🌸', category:'Garden Clue',  text:'"Bees love to visit me! I have colourful petals and a sweet scent that fills the meadow."', distractors:['Tree','Apple','River'] },
    { correct:'Mountain', emoji:'🏔️', category:'Earth Clue',  text:'"I am very tall and covered with snow at the top. Climbers love to reach my peak!"', distractors:['Tree','River','Sun'] },
    { correct:'Apple',    emoji:'🍎', category:'Food Clue',    text:'"Crunch! I am round, red or green, and I grow on trees. Yara loves to eat me for a snack!"', distractors:['Flower','Bird','Rain'] },
  ];

  const TOTAL_ROUNDS = CLUES.length, MAX_LIVES = 3;
  let lives=MAX_LIVES, score=0, round=0, clueOrder=[], correctName='', waitingNext=false;

  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function renderHearts(){
    document.getElementById('hearts-display').innerHTML=
      Array.from({length:MAX_LIVES},(_,i)=>
        `<span class="material-symbols-outlined text-xl ${i<lives?'text-red-400':'text-white/20'}"
               style="${i<lives?"font-variation-settings:'FILL' 1;":""}">favorite</span>`
      ).join('');
  }

  function renderRound(){
    if(round>=TOTAL_ROUNDS){finishGame();return;}
    waitingNext=false;hideFeedback();

    const clue=CLUES[clueOrder[round]];
    correctName=clue.correct;

    // Update clue card
    document.getElementById('clue-emoji').textContent=clue.emoji;
    document.getElementById('clue-text').textContent=clue.text;
    document.getElementById('clue-category').textContent=clue.category;
    document.getElementById('round-display').textContent=`Clue ${round+1} / ${TOTAL_ROUNDS}`;

    // Re-animate clue card
    const card=document.getElementById('clue-card');
    card.classList.remove('clue-card');
    void card.offsetWidth;
    card.classList.add('clue-card');

    // Build 4 tiles: correct + 3 distractors
    const names=shuffle([clue.correct,...clue.distractors]);
    document.getElementById('tiles-grid').innerHTML=names.map(name=>{
      const s=SUBJECTS[name]||{emoji:'❓',image:''};
      return `<button data-name="${name}" onclick="handleTile(this)"
                      class="relative aspect-square rounded-[2rem] overflow-hidden border-4 border-white/10
                             hover:border-sky-400 hover:scale-[1.03] active:scale-95
                             transition-all duration-200 shadow-xl group">
        ${s.image
          ? `<img src="${s.image}" alt="${name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"/>`
          : `<div class="w-full h-full flex items-center justify-center text-6xl bg-navy-light">${s.emoji}</div>`
        }
        <div class="absolute inset-0 bg-gradient-to-t from-navy/80 to-transparent"></div>
        <span class="absolute bottom-3 left-0 right-0 text-center font-label text-xs font-bold text-white/80 uppercase tracking-wider">${name}</span>
      </button>`;
    }).join('');
  }

  function handleTile(btn){
    if(waitingNext)return;
    waitingNext=true;
    document.querySelectorAll('#tiles-grid button').forEach(b=>b.disabled=true);

    const isCorrect=btn.dataset.name===correctName;
    if(isCorrect){
      score+=10;
      document.getElementById('score-display').textContent=score;
      btn.classList.add('tile-pop');
      btn.style.borderColor='#10b981';
      showFeedback(true,`🎉 Correct! That's a ${correctName}!`);
      round++;
    } else {
      lives=Math.max(0,lives-1); renderHearts();
      btn.classList.add('tile-shake');
      btn.style.borderColor='#ef4444';
      document.querySelectorAll('#tiles-grid button').forEach(b=>{
        if(b.dataset.name===correctName) b.style.borderColor='#10b981';
      });
      showFeedback(false,`Not quite! The answer was "${correctName}".`);
      round++;
      if(lives<=0){setTimeout(finishGame,1200);return;}
    }
    setTimeout(renderRound,1500);
  }

  function showFeedback(correct,msg){
    const bar=document.getElementById('feedback-bar');
    const icon=document.getElementById('feedback-icon');
    bar.className=bar.className.replace(/bg-\S+/g,'').replace(/border\S*/g,'').trim();
    if(correct){bar.classList.add('bg-green-brand/20','border','border-green-brand/40');icon.textContent='check_circle';icon.style.color='#10b981';}
    else{bar.classList.add('bg-red-500/20','border','border-red-500/40');icon.textContent='cancel';icon.style.color='#f87171';}
    document.getElementById('feedback-text').textContent=msg;
    bar.style.opacity='1';
  }

  function hideFeedback(){document.getElementById('feedback-bar').style.opacity='0';}

  function finishGame(){
    const xp=score;
    if(window.Store){Store.addXP(xp);Store.activateStreak();Store.completeActivity('games');if(stars>=3)Store.unlockBadge('word_wizard');}
    const stars=score>=70?3:score>=40?2:1;
    const starHTML=Array.from({length:3},(_,i)=>
      `<span class="material-symbols-outlined text-4xl ${i<stars?'text-yellow-400':'text-white/20'}"
             style="${i<stars?"font-variation-settings:'FILL' 1;":""}">star</span>`
    ).join('');
    const overlay=document.createElement('div');
    overlay.className='fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
    overlay.innerHTML=`
      <div class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-sky-400/60
                  rounded-[3rem] px-12 py-12 flex flex-col items-center gap-6 shadow-2xl
                  text-center max-w-sm mx-4 scale-0 opacity-0 transition-all duration-500" id="finish-card">
        <div class="w-24 h-24 rounded-full bg-sky-500 flex items-center justify-center shadow-lg shadow-sky-500/40">
          <span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings:'FILL' 1;">hearing</span>
        </div>
        <div>
          <p class="font-label text-sky-400 font-bold text-sm uppercase tracking-widest mb-1">Seeker Complete!</p>
          <h2 class="font-headline text-5xl font-black text-white mb-1">+${xp} XP</h2>
          <p class="font-body text-slate-300">Score: <span class="text-white font-bold">${score} pts</span></p>
        </div>
        <div class="flex gap-2">${starHTML}</div>
        <div class="flex gap-3 flex-wrap justify-center">
          <button onclick="startGame()" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-8 py-3 rounded-full text-base active:scale-95 transition-all border border-white/20">Play Again</button>
          <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'" class="bg-sky-500 hover:bg-sky-600 text-white font-label font-bold px-8 py-3 rounded-full text-base active:scale-95 transition-all shadow-lg">Back to Games</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=document.getElementById('finish-card');c.style.transform='scale(1)';c.style.opacity='1';}));
  }

  function startGame(){
    document.querySelectorAll('.fixed.inset-0').forEach(e=>e.remove());
    lives=MAX_LIVES;score=0;round=0;
    clueOrder=shuffle(CLUES.map((_,i)=>i));
    document.getElementById('score-display').textContent='0';
    renderHearts();renderRound();
  }

  document.addEventListener('DOMContentLoaded',startGame);
</script>
</body>
</html>
