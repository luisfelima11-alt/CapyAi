<body>
  <main>
    <div aria-hidden="true" style="font-size:46px">🐾</div>
    <h1>Crie uma nova senha</h1>
    <p>Use pelo menos 12 caracteres. Sua senha anterior não será reutilizada.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button type="submit">Salvar nova senha</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="auth-secure.js?v=sec2"></script>
