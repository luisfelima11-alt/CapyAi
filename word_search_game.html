<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Word Search — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{"navy":"#001f3f","navy-light":"#002d5c","pink-brand":"#ec4899","green-brand":"#10b981"},
    fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
    borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
  }}
}
</script>
<style>
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}

  /* Grid cells */
  #grid-wrap { display:grid; gap:4px; user-select:none; touch-action:none; }
  .cell {
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:1; border-radius:10px; cursor:pointer;
    font-family:'Lexend',sans-serif; font-weight:700; font-size:1rem;
    background:rgba(255,255,255,0.07); color:#fff;
    border:1.5px solid rgba(255,255,255,0.1);
    transition:background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color:transparent;
  }
  .cell.selecting  { background:rgba(236,72,153,0.5); border-color:#ec4899; transform:scale(1.08); }
  .cell.found      { background:rgba(16,185,129,0.35); border-color:#10b981; color:#6ee7b7; }
  .cell.found.new  { animation:cellPop 0.35s cubic-bezier(0.175,0.885,0.32,1.275) both; }

  /* Word list chips */
  .word-chip {
    font-family:'Lexend',sans-serif; font-weight:700; font-size:0.8rem;
    padding:5px 14px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.15);
    color:#cbd5e1; transition:all 0.2s;
  }
  .word-chip.found {
    background:rgba(16,185,129,0.2); border-color:#10b981; color:#6ee7b7;
    text-decoration:line-through; text-decoration-color:#10b981;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes cellPop{ 0%{transform:scale(0.8)} 80%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes confettiFall{ 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(180px) rotate(360deg);opacity:0} }

  .fade-up { animation:fadeUp 0.4s ease both; }

  .confetti-piece{
    position:fixed;pointer-events:none;z-index:9999;
    width:9px;height:9px;border-radius:2px;
    animation:confettiFall 1.1s ease-out forwards;
  }

  /* Timer ring */
  #timer-ring { transition:stroke-dashoffset 1s linear; }
</style>
</head>
<body class="bg-navy font-body text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center gap-4 px-5 py-4 border-b border-white/10 bg-navy/90 backdrop-blur sticky top-0 z-50 flex-shrink-0">
  <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all active:scale-90">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <div class="flex-1">
    <p class="font-label text-xs text-teal-400 uppercase tracking-widest font-bold">Word Search</p>
    <h1 class="font-headline font-bold text-white text-lg leading-none">Find the Words! 🔍</h1>
  </div>
  <!-- Timer -->
  <div class="relative w-12 h-12">
    <svg class="w-full h-full -rotate-90" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
      <circle id="timer-ring" cx="24" cy="24" r="20" fill="none" stroke="#10b981" stroke-width="4"
              stroke-dasharray="125.66" stroke-dashoffset="0" stroke-linecap="round"/>
    </svg>
    <span id="timer-text" class="absolute inset-0 flex items-center justify-center font-label font-bold text-sm">90</span>
  </div>
  <!-- Score -->
  <div class="bg-white/10 border border-white/15 rounded-full px-4 py-2 font-label font-bold text-sm">
    <span id="score-disp">0</span> pts
  </div>
</header>

<main class="flex-1 flex flex-col gap-4 px-4 py-5 max-w-lg mx-auto w-full">

  <!-- Round indicator -->
  <div class="flex items-center justify-between fade-up">
    <div class="flex gap-1.5" id="round-pips"></div>
    <p class="font-label text-xs text-slate-400 font-bold uppercase tracking-widest" id="round-label">Round 1 of 3</p>
  </div>

  <!-- Word chips -->
  <div class="flex flex-wrap gap-2 fade-up" id="word-list"></div>

  <!-- Grid -->
  <div id="grid-wrap" class="fade-up mx-auto w-full max-w-[380px]" style="animation-delay:0.1s"></div>

  <!-- Found count -->
  <p class="text-center font-label text-sm text-slate-400 fade-up" id="found-label">
    Found <span id="found-count">0</span> of <span id="total-count">0</span> words
  </p>

</main>

<script src="store.js"></script>
<script src="levelup-overlay.js"></script>
<script src="badge-toast.js"></script>
<script>
// ── Word Sets per round ────────────────────────────────────────────────────────
const ROUNDS = [
  { label:'Animals 🐾',    words:['CAT','DOG','BIRD','FISH','BEAR'] },
  { label:'Colors 🎨',     words:['RED','BLUE','GREEN','PINK','GOLD'] },
  { label:'Forest 🌳',     words:['TREE','LEAF','RAIN','WIND','FROG'] },
];

const GRID_SIZE = 10;
const TIMER_MAX = 90;

// ── State ──────────────────────────────────────────────────────────────────────
let currentRound  = 0;
let grid          = [];      // 2D array of letters
let placements    = {};      // word → [{r,c}]
let selecting     = false;
let selectCells   = [];      // [{r,c}] currently dragging
let foundWords    = new Set();
let score         = 0;
let timeLeft      = TIMER_MAX;
let timerInterval = null;
let roundScores   = [];

// ── Boot ───────────────────────────────────────────────────────────────────────
renderRoundPips();
startRound(0);

// ── Round management ──────────────────────────────────────────────────────────
function startRound(idx) {
  currentRound = idx;
  foundWords   = new Set();
  selectCells  = [];
  selecting    = false;
  timeLeft     = TIMER_MAX;

  clearInterval(timerInterval);

  document.getElementById('round-label').textContent = `Round ${idx + 1} of ${ROUNDS.length}`;
  document.getElementById('found-count').textContent = 0;
  document.getElementById('total-count').textContent = ROUNDS[idx].words.length;

  buildGrid(ROUNDS[idx].words);
  renderGrid();
  renderWordList();
  updateRoundPips();
  startTimer();
}

function renderRoundPips() {
  document.getElementById('round-pips').innerHTML = ROUNDS.map((_, i) =>
    `<div id="pip-${i}" class="w-2.5 h-2.5 rounded-full bg-white/20"></div>`
  ).join('');
}

function updateRoundPips() {
  ROUNDS.forEach((_, i) => {
    const el = document.getElementById(`pip-${i}`);
    el.className = `w-2.5 h-2.5 rounded-full ${i < currentRound ? 'bg-green-brand' : i === currentRound ? 'bg-teal-400' : 'bg-white/20'}`;
  });
}

// ── Grid building ──────────────────────────────────────────────────────────────
const DIRS = [
  [0,1],[1,0],[1,1],[0,-1],[-1,0],[-1,-1],[1,-1],[-1,1] // 8 directions
];

function buildGrid(words) {
  // Empty grid
  grid = Array.from({length:GRID_SIZE}, () => Array(GRID_SIZE).fill(''));
  placements = {};

  for (const word of words) {
    let placed = false;
    for (let attempt = 0; attempt < 200 && !placed; attempt++) {
      const [dr, dc] = DIRS[Math.floor(Math.random() * 4)]; // only 4 main directions for readability
      const r0 = Math.floor(Math.random() * GRID_SIZE);
      const c0 = Math.floor(Math.random() * GRID_SIZE);
      const cells = [];
      let ok = true;
      for (let i = 0; i < word.length; i++) {
        const r = r0 + dr * i, c = c0 + dc * i;
        if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) { ok = false; break; }
        if (grid[r][c] !== '' && grid[r][c] !== word[i])        { ok = false; break; }
        cells.push({r, c});
      }
      if (ok) {
        cells.forEach((pos, i) => { grid[pos.r][pos.c] = word[i]; });
        placements[word] = cells;
        placed = true;
      }
    }
  }

  // Fill remaining with random uppercase letters
  const alpha = 'ABCDEFGHIJKLMNOPRSTUVWY';
  for (let r = 0; r < GRID_SIZE; r++)
    for (let c = 0; c < GRID_SIZE; c++)
      if (!grid[r][c]) grid[r][c] = alpha[Math.floor(Math.random() * alpha.length)];
}

// ── Render ─────────────────────────────────────────────────────────────────────
function renderGrid() {
  const wrap = document.getElementById('grid-wrap');
  wrap.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
  wrap.innerHTML = '';

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className  = 'cell';
      cell.textContent = grid[r][c];
      cell.dataset.r   = r;
      cell.dataset.c   = c;

      // Touch & mouse events
      cell.addEventListener('mousedown',  e => { e.preventDefault(); startSelect(r, c); });
      cell.addEventListener('mouseenter', e => { if (selecting) extendSelect(r, c); });
      cell.addEventListener('touchstart', e => { e.preventDefault(); startSelect(r, c); }, {passive:false});
      cell.addEventListener('touchmove',  e => {
        e.preventDefault();
        const t = e.touches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        if (el && el.classList.contains('cell')) extendSelect(+el.dataset.r, +el.dataset.c);
      }, {passive:false});

      wrap.appendChild(cell);
    }
  }

  document.addEventListener('mouseup',  endSelect);
  document.addEventListener('touchend', endSelect);
}

function renderWordList() {
  document.getElementById('word-list').innerHTML = ROUNDS[currentRound].words.map(w =>
    `<span class="word-chip${foundWords.has(w) ? ' found' : ''}" id="chip-${w}">${w}</span>`
  ).join('');
}

function getCellEl(r, c) {
  return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
}

// ── Selection ──────────────────────────────────────────────────────────────────
function startSelect(r, c) {
  selecting    = true;
  selectCells  = [{r, c}];
  highlightSelecting();
}

function extendSelect(r, c) {
  if (!selecting) return;
  // Only extend in a straight line from the first cell
  const first = selectCells[0];
  const dr = r - first.r, dc = c - first.c;

  // Must be along one of the 8 directions
  if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return;

  const len = Math.max(Math.abs(dr), Math.abs(dc)) + 1;
  const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
  const stepC = dc === 0 ? 0 : dc / Math.abs(dc);

  const cells = [];
  for (let i = 0; i < len; i++) cells.push({r: first.r + stepR*i, c: first.c + stepC*i});

  selectCells = cells;
  highlightSelecting();
}

function endSelect() {
  if (!selecting) return;
  selecting = false;
  checkSelection();
  // Clear selection highlight (keep found cells green)
  document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
  selectCells = [];
}

function highlightSelecting() {
  document.querySelectorAll('.cell').forEach(el => {
    if (!el.classList.contains('found')) el.classList.remove('selecting');
  });
  selectCells.forEach(({r,c}) => {
    const el = getCellEl(r, c);
    if (el && !el.classList.contains('found')) el.classList.add('selecting');
  });
}

// ── Check if selection matches a word ─────────────────────────────────────────
function checkSelection() {
  const selected = selectCells.map(({r,c}) => grid[r][c]).join('');
  const reversed = selected.split('').reverse().join('');

  for (const word of ROUNDS[currentRound].words) {
    if (foundWords.has(word)) continue;
    if (selected === word || reversed === word) {
      markFound(word);
      return;
    }
  }
}

function markFound(word) {
  foundWords.add(word);
  const pts = 10 + Math.floor(timeLeft / 10);
  score += pts;
  document.getElementById('score-disp').textContent = score;

  // Green cells
  placements[word].forEach(({r,c}) => {
    const el = getCellEl(r, c);
    el.classList.remove('selecting');
    el.classList.add('found', 'new');
    setTimeout(() => el.classList.remove('new'), 400);
  });

  // Chip
  const chip = document.getElementById(`chip-${word}`);
  if (chip) chip.classList.add('found');

  document.getElementById('found-count').textContent = foundWords.size;

  // Check all found
  if (foundWords.size === ROUNDS[currentRound].words.length) {
    clearInterval(timerInterval);
    setTimeout(() => advanceRound(true), 600);
  }
}

// ── Timer ──────────────────────────────────────────────────────────────────────
function startTimer() {
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      advanceRound(false);
    }
  }, 1000);
}

function updateTimerUI() {
  const pct = timeLeft / TIMER_MAX;
  const circumference = 125.66;
  document.getElementById('timer-ring').style.strokeDashoffset = circumference * (1 - pct);
  document.getElementById('timer-ring').style.stroke = timeLeft <= 15 ? '#f43f5e' : '#10b981';
  document.getElementById('timer-text').textContent = timeLeft;
  document.getElementById('timer-text').style.color = timeLeft <= 15 ? '#f87171' : '#fff';
}

// ── Round advance ──────────────────────────────────────────────────────────────
function advanceRound(completed) {
  roundScores.push({ found: foundWords.size, total: ROUNDS[currentRound].words.length, completed });

  if (currentRound + 1 < ROUNDS.length) {
    showRoundComplete(completed, () => startRound(currentRound + 1));
  } else {
    showGameOver();
  }
}

function showRoundComplete(completed, onNext) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/50 backdrop-blur-sm';
  const emoji = completed ? '🎉' : '⏰';
  const msg   = completed ? 'All words found!' : `Found ${foundWords.size}/${ROUNDS[currentRound].words.length}`;
  overlay.innerHTML = `
    <div class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-teal-500/50
         rounded-[2.5rem] px-10 py-8 flex flex-col items-center gap-4 shadow-2xl text-center max-w-xs mx-4">
      <div class="text-6xl">${emoji}</div>
      <h3 class="font-headline text-3xl font-black text-white">${completed ? 'Round Clear!' : 'Time\'s Up!'}</h3>
      <p class="font-body text-slate-300">${msg}</p>
      <button onclick="this.closest('.fixed').remove(); (${onNext.toString()})()"
              class="bg-teal-500 hover:bg-teal-400 text-white font-label font-bold px-8 py-3 rounded-full active:scale-95 transition-all mt-2">
        Next Round →
      </button>
    </div>`;
  document.body.appendChild(overlay);
}

// ── Game Over ──────────────────────────────────────────────────────────────────
function showGameOver() {
  const totalFound = roundScores.reduce((s,r) => s + r.found, 0);
  const totalWords = roundScores.reduce((s,r) => s + r.total, 0);
  const allComplete = roundScores.every(r => r.completed);
  const stars = allComplete ? 3 : totalFound >= totalWords * 0.7 ? 2 : 1;

  // XP & badge
  const xpAward = stars === 3 ? 40 : stars === 2 ? 25 : 10;
  if (window.Store) {
    Store.addXP(xpAward);
    Store.completeActivity('games');
    if (stars === 3) Store.unlockBadge('game_hero');
  }

  if (stars === 3) launchConfetti();

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
  overlay.innerHTML = `
    <div id="fin" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-teal-500/40
         rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
         scale-0 opacity-0 transition-all duration-500">
      <div class="text-7xl">🔍</div>
      <div>
        <p class="font-label text-teal-400 font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
        <h2 class="font-headline text-5xl font-black text-white mb-1">${score} pts</h2>
        <p class="font-body text-slate-300">${totalFound}/${totalWords} words found</p>
      </div>
      <div class="flex gap-1">
        ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-slate-600'}"
          style="font-variation-settings:'FILL' ${i<=stars?1:0};">star</span>`).join('')}
      </div>
      <p class="font-body text-slate-400 text-sm">+${xpAward} XP earned!</p>
      <div class="flex gap-3">
        <button onclick="location.reload()"
                class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">
          Play Again 🔄
        </button>
        <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
                class="bg-teal-500 hover:bg-teal-400 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-teal-500/30">
          Games 🌿
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f = document.getElementById('fin');
    f.style.transform='scale(1)'; f.style.opacity='1';
  }));
}

function launchConfetti() {
  const colors = ['#10b981','#ec4899','#06b6d4','#facc15','#818cf8'];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${Math.random()*100}vw;top:-10px;background:${colors[i%colors.length]};
      animation-delay:${Math.random()*0.7}s;animation-duration:${0.9+Math.random()*0.6}s;
      transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2000);
  }
}
</script>
</body>
</html>
