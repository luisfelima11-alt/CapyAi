<script src="store.js?v=xpfix"></script><script src="components.js?v=sec1"></script><script>Components.mount('top-nav-placeholder',Components.renderTopNav('games'));Components.mount('side-nav-placeholder',Components.renderSideNav('games'));Components.mount('mobile-nav-placeholder',Components.renderMobileNav('games'));const D=[{q:'Hi! How are you?',a:'I am great, thanks!',o:['Blue is my favorite.','At seven o’clock.']},{q:'Excuse me, where is the station?',a:'It is next to the bank.',o:['I like sandwiches.','Yes, I can swim.']},{q:'Would you like some tea?',a:'Yes, please.',o:['It is very tall.','My name is Leo.']},{q:'What time do you wake up?',a:'At seven o’clock.',o:['In the kitchen.','Two tickets, please.']},{q:'Can you help me?',a:'Of course!',o:['It is raining.','I am twelve.']},{q:'How much is this?',a:'It is ten dollars.',o:['Tomorrow morning.','She is my sister.']},{q:'What do you do for fun?',a:'I like reading.',o:['Turn left here.','It is on the table.']},{q:'See you tomorrow!',a:'See you!',o:['You are welcome.','A glass of water.']},{q:'Thank you very much!',a:'You are welcome!',o:['I go by bus.','It is cloudy.']}];let order=[],step=0,points=0,locked=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function render(){if(step>=8)return finish();locked=false;const d=order[step];round.textContent=`${step+1} / 8`;score.textContent=`${points} XP`;prompt.textContent=d.q;choices.innerHTML=shuffle([d.a,...d.o]).map(x=>`<button class="choice text-left rounded-2xl bg-white/10 hover:bg-emerald-500 border border-white/10 px-5 py-4 font-black" data-ok="${x===d.a}">${x}</button>`).join('');choices.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b,d));feedback.textContent=''}function choose(btn,d){if(locked)return;locked=true;const ok=btn.dataset.ok==='true';if(ok){points+=12;btn.classList.add('bg-emerald-500');feedback.textContent='Resposta natural! +12 XP';feedback.className='text-center font-black min-h-6 mt-5 text-emerald-300'}else{btn.classList.add('bg-red-500');feedback.textContent=`Uma resposta melhor seria: “${d.a}”`;feedback.className='text-center font-black min-h-6 mt-5 text-amber-300'}setTimeout(()=>{step++;render()},1100)}function finish(){if(window.Store){Store.addXP(points);Store.completeActivity('games');Store.activateStreak()}document.querySelector('section').innerHTML=`<div class="text-center py-8"><div class="text-7xl">💬</div><h2 class="text-4xl font-black mt-4">Conversa concluída!</h2><p class="text-emerald-300 text-2xl font-black mt-2">+${points} XP</p><div class="flex justify-center gap-3 mt-7"><button onclick="location.reload()" class="bg-white/10 px-6 py-3 rounded-full font-black">Jogar novamente</button><a href="5_Game_Pavilion_Forest_Edition.html" class="bg-emerald-500 px-6 py-3 rounded-full font-black">Mais games</a></div></div>`}order=shuffle(D).slice(0,8);render();</script><script src="celebration.js?v=cel3"></script>
