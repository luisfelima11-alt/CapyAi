<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sentence Builder — Capy Yara Adventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{"primary":"#001f3f","secondary":"#ec4899","tertiary":"#10b981","surface-container":"#002a54"},
    fontFamily:{"headline":["Plus Jakarta Sans"],"body":["Be Vietnam Pro"],"label":["Lexend"]},
    borderRadius:{"DEFAULT":"1rem","lg":"2rem","xl":"3rem","full":"9999px"},
  }}
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }

  /* Word tile */
  .word-tile {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 1rem;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff; user-select: none;
    transition: transform 0.15s, opacity 0.15s, background 0.15s;
  }
  .word-tile:hover  { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .word-tile:active { transform: scale(0.94); }
  .word-tile.used   { opacity: 0.3; pointer-events: none; cursor: default; }

  /* Answer slot */
  .answer-slot {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 80px; padding: 10px 16px; border-radius: 999px;
    border: 2px dashed rgba(255,255,255,0.3);
    font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 1rem;
    color: rgba(255,255,255,0.4); cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .answer-slot.filled {
    background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.5);
    color: #fff;
  }
  .answer-slot.filled:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }

  /* Animations */
  @keyframes slideUp    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes correctBg  { 0%{background:#10b981} 100%{background:transparent} }
  @keyframes wrongShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
  @keyframes tileIn     { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }

  .slide-up  { animation: slideUp 0.4s ease both; }
  .tile-in   { animation: tileIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275) both; }
  .wrong-shake { animation: wrongShake 0.4s ease; }

  /* Heart */
  .heart { transition: transform 0.2s; }
  .heart.lost { transform: scale(0); opacity: 0; }

  /* Progress bar */
  #prog-bar { transition: width 0.5s ease; }

  /* Confetti */
  @keyframes spark { 0%{opacity:1;transform:translate(0,0)scale(1)} 100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0)} }
  .spark { position:fixed; width:8px; height:8px; border-radius:50%; animation:spark 0.8s ease forwards; pointer-events:none; z-index:9999; }
</style>
</head>
<body class="bg-primary font-body text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="flex items-center gap-4 px-6 py-4 border-b border-white/10 flex-shrink-0 bg-primary/90 backdrop-blur">
  <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all">
    <span class="material-symbols-outlined text-xl">arrow_back</span>
  </button>
  <div>
    <p class="font-label text-xs text-purple-400 uppercase tracking-widest font-bold">Sentence Builder</p>
    <h1 class="font-headline font-bold text-white text-lg leading-none">Put the words in order! 📝</h1>
  </div>
  <!-- Score + lives -->
  <div class="ml-auto flex items-center gap-4">
    <div class="flex gap-1" id="hearts">
      <span class="material-symbols-outlined heart text-red-400 text-2xl" style="font-variation-settings:'FILL' 1;" data-heart="1">favorite</span>
      <span class="material-symbols-outlined heart text-red-400 text-2xl" style="font-variation-settings:'FILL' 1;" data-heart="2">favorite</span>
      <span class="material-symbols-outlined heart text-red-400 text-2xl" style="font-variation-settings:'FILL' 1;" data-heart="3">favorite</span>
    </div>
    <div class="bg-white/10 border border-white/15 rounded-full px-4 py-2 font-label font-bold">
      <span id="score-display">0</span> pts
    </div>
  </div>
</header>

<!-- Progress bar -->
<div class="h-1.5 w-full bg-white/10">
  <div id="prog-bar" class="h-full bg-gradient-to-r from-purple-500 to-pink-500 w-0"></div>
</div>

<!-- Main -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-10 gap-10">

  <!-- Round / image hint -->
  <div class="text-center slide-up" id="top-area">
    <p class="font-label text-purple-400 text-sm font-bold uppercase tracking-widest mb-2" id="round-label">Round 1 of 8</p>
    <div class="text-6xl mb-4" id="sentence-emoji">🌳</div>
    <p class="font-body text-slate-400 text-sm" id="sentence-hint">Arrange the words to make a sentence!</p>
  </div>

  <!-- Answer slots -->
  <div id="answer-row" class="flex flex-wrap gap-3 justify-center min-h-[56px] items-center
       bg-white/5 border border-white/10 rounded-2xl px-6 py-4 w-full max-w-2xl slide-up">
    <p class="text-white/30 font-label text-sm" id="slots-placeholder">Tap words below to build the sentence…</p>
  </div>

  <!-- Feedback -->
  <div id="feedback" class="hidden font-label font-bold text-lg text-center slide-up px-6 py-3 rounded-xl w-full max-w-2xl"></div>

  <!-- Word bank -->
  <div id="word-bank" class="flex flex-wrap gap-3 justify-center max-w-2xl slide-up"></div>

  <!-- Controls -->
  <div class="flex gap-4 mt-2">
    <button onclick="clearAnswer()" class="flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white font-label font-bold px-6 py-3 rounded-full border border-white/20 active:scale-95 transition-all">
      <span class="material-symbols-outlined text-sm">backspace</span> Clear
    </button>
    <button onclick="checkAnswer()" id="check-btn"
            class="flex items-center gap-2 bg-purple-500 hover:bg-purple-400 text-white font-label font-bold px-8 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-purple-500/30">
      <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1;">check_circle</span> Check!
    </button>
  </div>
</main>

<script src="store.js"></script>
<script src="levelup-overlay.js"></script>
<script src="badge-toast.js"></script>
<script>
// ── Sentences ─────────────────────────────────────────────────────────────────
const SENTENCES = [
    { words: ['The', 'cat', 'is', 'big'],           emoji: '🐱', hint: 'Describe the cat!' },
    { words: ['I', 'like', 'red', 'apples'],        emoji: '🍎', hint: 'What do you like?' },
    { words: ['She', 'has', 'a', 'dog'],            emoji: '🐶', hint: 'What does she have?' },
    { words: ['The', 'bird', 'can', 'fly'],         emoji: '🐦', hint: 'What can the bird do?' },
    { words: ['We', 'see', 'three', 'stars'],       emoji: '⭐', hint: 'What do we see?' },
    { words: ['He', 'runs', 'in', 'the', 'park'],  emoji: '🏃', hint: 'Where does he run?' },
    { words: ['My', 'fish', 'is', 'orange'],        emoji: '🐟', hint: 'Describe the fish!' },
    { words: ['They', 'play', 'in', 'the', 'rain'], emoji: '🌧️', hint: 'Where do they play?' },
];

// ── State ─────────────────────────────────────────────────────────────────────
let currentRound  = 0;
let score         = 0;
let lives         = 3;
let answered      = false;
let answerSlots   = [];   // array of { word, slotEl }
let bankTiles     = [];   // all word tile buttons

// ── Render round ──────────────────────────────────────────────────────────────
function renderRound() {
    answered = false;
    answerSlots = [];
    bankTiles = [];

    const s = SENTENCES[currentRound];
    document.getElementById('round-label').textContent  = `Round ${currentRound + 1} of ${SENTENCES.length}`;
    document.getElementById('sentence-emoji').textContent = s.emoji;
    document.getElementById('sentence-hint').textContent  = s.hint;

    // Progress bar
    document.getElementById('prog-bar').style.width = `${((currentRound) / SENTENCES.length) * 100}%`;

    // Feedback
    const fb = document.getElementById('feedback');
    fb.classList.add('hidden');

    // Clear answer row & show placeholder
    const row = document.getElementById('answer-row');
    row.innerHTML = '<p class="text-white/30 font-label text-sm" id="slots-placeholder">Tap words below to build the sentence…</p>';

    // Shuffle words for bank
    const shuffled = [...s.words].sort(() => Math.random() - 0.5);

    // Word bank
    const bank = document.getElementById('word-bank');
    bank.innerHTML = '';
    shuffled.forEach((word, i) => {
        const btn = document.createElement('button');
        btn.className = `word-tile tile-in`;
        btn.style.animationDelay = `${i * 0.06}s`;
        btn.textContent = word;
        btn.dataset.word = word;
        btn.dataset.idx  = i;
        btn.onclick = () => pickWord(btn);
        bank.appendChild(btn);
        bankTiles.push(btn);
    });

    document.getElementById('check-btn').disabled = false;
}

// ── Pick a word from bank ─────────────────────────────────────────────────────
function pickWord(btn) {
    if (answered || btn.classList.contains('used')) return;

    btn.classList.add('used');
    const word = btn.dataset.word;

    // Remove placeholder
    const ph = document.getElementById('slots-placeholder');
    if (ph) ph.remove();

    // Create answer slot
    const row  = document.getElementById('answer-row');
    const slot = document.createElement('button');
    slot.className   = 'answer-slot filled tile-in';
    slot.textContent = word;
    slot.dataset.word = word;
    slot.dataset.tileIdx = btn.dataset.idx;
    slot.onclick = () => removeSlot(slot, btn);
    row.appendChild(slot);
    answerSlots.push(slot);
}

// ── Remove a word from the answer row ────────────────────────────────────────
function removeSlot(slot, origBtn) {
    if (answered) return;
    slot.remove();
    answerSlots = answerSlots.filter(s => s !== slot);
    origBtn.classList.remove('used');

    // Re-add placeholder if empty
    if (answerSlots.length === 0) {
        const row = document.getElementById('answer-row');
        row.innerHTML = '<p class="text-white/30 font-label text-sm" id="slots-placeholder">Tap words below to build the sentence…</p>';
    }
}

// ── Clear answer ──────────────────────────────────────────────────────────────
function clearAnswer() {
    answerSlots.forEach(s => s.remove());
    answerSlots = [];
    bankTiles.forEach(b => b.classList.remove('used'));
    const row = document.getElementById('answer-row');
    row.innerHTML = '<p class="text-white/30 font-label text-sm" id="slots-placeholder">Tap words below to build the sentence…</p>';
}

// ── Check answer ──────────────────────────────────────────────────────────────
function checkAnswer() {
    if (answered) return;
    if (answerSlots.length === 0) return;

    const attempt = answerSlots.map(s => s.dataset.word).join(' ');
    const correct  = SENTENCES[currentRound].words.join(' ');
    const isCorrect = attempt === correct;
    answered = true;

    const fb = document.getElementById('feedback');
    fb.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/40',
                                   'bg-red-500/20',    'text-red-300',     'border-red-500/40');
    fb.classList.add('border');

    if (isCorrect) {
        const pts = 15;
        score += pts;
        document.getElementById('score-display').textContent = score;
        fb.textContent = `✅ Perfect! "${correct}" 🎉`;
        fb.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/40');
        launchSparks();
        // Highlight slots green
        answerSlots.forEach(s => { s.style.background='rgba(16,185,129,0.3)'; s.style.borderColor='#10b981'; });
        setTimeout(nextRound, 1500);
    } else {
        lives--;
        updateHearts();
        fb.textContent = `❌ Try again! The sentence is: "${correct}"`;
        fb.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
        document.getElementById('answer-row').classList.add('wrong-shake');
        setTimeout(() => document.getElementById('answer-row').classList.remove('wrong-shake'), 450);
        if (lives <= 0) {
            setTimeout(showGameOver, 1800);
        } else {
            setTimeout(() => { clearAnswer(); answered = false; }, 2000);
        }
    }
}

// ── Hearts ────────────────────────────────────────────────────────────────────
function updateHearts() {
    const hearts = document.querySelectorAll('[data-heart]');
    hearts.forEach(h => {
        if (parseInt(h.dataset.heart) > lives) h.classList.add('lost');
    });
}

// ── Advance ───────────────────────────────────────────────────────────────────
function nextRound() {
    currentRound++;
    if (currentRound >= SENTENCES.length) {
        showResults();
    } else {
        renderRound();
    }
}

// ── Sparks ────────────────────────────────────────────────────────────────────
function launchSparks() {
    const colors = ['#10b981','#ec4899','#f59e0b','#a855f7','#3b82f6'];
    for (let i = 0; i < 14; i++) {
        const sp = document.createElement('div');
        sp.className = 'spark';
        const angle = (i / 14) * 360;
        const dist  = 60 + Math.random() * 60;
        sp.style.setProperty('--tx', `${Math.cos(angle*Math.PI/180)*dist}px`);
        sp.style.setProperty('--ty', `${Math.sin(angle*Math.PI/180)*dist}px`);
        sp.style.background = colors[i % colors.length];
        sp.style.left = '50vw'; sp.style.top = '50vh';
        document.body.appendChild(sp);
        setTimeout(() => sp.remove(), 900);
    }
}

// ── Results overlay ───────────────────────────────────────────────────────────
function showResults() {
    const total   = SENTENCES.length;
    const pct     = score / (total * 15);
    const xpEarned = Math.round(pct * 40) + 10;
    const stars    = pct >= 0.85 ? 3 : pct >= 0.5 ? 2 : 1;

    if (window.Store) {
        Store.addXP(xpEarned);
        Store.activateStreak();
        Store.completeActivity('games');
        if (score >= 90) Store.unlockBadge('grammar_star');
    }

    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-[9000] flex items-center justify-center bg-black/60 backdrop-blur-sm';
    overlay.innerHTML = `
      <div id="result-card" class="bg-gradient-to-br from-[#001f3f] to-slate-900 border-2 border-purple-500/60
           rounded-[3rem] px-10 py-10 flex flex-col items-center gap-5 shadow-2xl text-center max-w-sm mx-4
           scale-0 opacity-0 transition-all duration-500">
        <div class="w-24 h-24 rounded-full ${stars===3?'bg-yellow-400 shadow-yellow-400/40':stars===2?'bg-purple-500 shadow-purple-500/40':'bg-pink-500 shadow-pink-500/40'} flex items-center justify-center shadow-xl">
          <span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings:'FILL' 1;">
            ${stars===3?'emoji_events':'star'}
          </span>
        </div>
        <div>
          <p class="font-label text-purple-400 font-bold text-sm uppercase tracking-widest mb-1">Game Over!</p>
          <h2 class="font-headline text-5xl font-black text-white mb-1">+${xpEarned} XP</h2>
          <p class="font-body text-slate-300">Score: ${score} / ${total * 15} points</p>
        </div>
        <div class="flex gap-1">
          ${[1,2,3].map(i=>`<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-white/20'}" style="font-variation-settings:'FILL' 1;">star</span>`).join('')}
        </div>
        ${score>=90?`<div class="bg-purple-500/20 border border-purple-500/40 rounded-xl px-4 py-2 text-purple-300 font-label font-bold text-sm">🏅 Grammar Star badge unlocked!</div>`:''}
        <div class="flex gap-3 flex-wrap justify-center">
          <button onclick="location.reload()" class="bg-white/10 hover:bg-white/20 text-white font-label font-bold px-7 py-3 rounded-full border border-white/20 active:scale-95 transition-all">Play Again</button>
          <button onclick="window.location.href='5_Game_Pavilion_Forest_Edition.html'" class="bg-purple-500 hover:bg-purple-600 text-white font-label font-bold px-7 py-3 rounded-full active:scale-95 transition-all shadow-lg shadow-purple-500/30">Back 🌿</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => requestAnimationFrame(() => {
        const card = document.getElementById('result-card');
        card.style.transform = 'scale(1)';
        card.style.opacity   = '1';
    }));
    launchSparks();
}

function showGameOver() {
    showResults();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderRound();
</script>
</body>
</html>
