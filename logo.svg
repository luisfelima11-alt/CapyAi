<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Capy Yara English">
  <title>Capy Yara English</title>
  <defs>
    <linearGradient id="lgFundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b4d"/>
      <stop offset="1" stop-color="#001f3f"/>
    </linearGradient>
    <linearGradient id="lgChapeu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be2d78"/>
    </linearGradient>
    <linearGradient id="lgPelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5763f"/>
      <stop offset="1" stop-color="#8f5528"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="64" fill="url(#lgFundo)"/>

  <!-- orelhas: pequenas e altas, encostadas na lateral — capivara não tem
       orelha grande de urso, e é isso que estava puxando a leitura pro lado
       errado -->
  <ellipse cx="30.5" cy="50" rx="8" ry="7" fill="#7d4a22"/>
  <ellipse cx="97.5" cy="50" rx="8" ry="7" fill="#7d4a22"/>

  <!-- cabeça: tijolo de cantos arredondados. O que faz ler como capivara é
       ser LARGA e CHATA, não redonda -->
  <path fill="url(#lgPelo)"
        d="M64 38c22 0 33 8 33 22v16c0 12-9.5 20-16 20H47c-6.5 0-16-8-16-20V60c0-14 11-22 33-22Z"/>

  <!-- focinho: comprido e de ponta reta, a marca registrada da capivara -->
  <path fill="#d9a068"
        d="M48 74h32c1.7 0 3 1.3 3 3v11c0 5-6 8.5-19 8.5S45 93 45 88V77c0-1.7 1.3-3 3-3Z"/>
  <ellipse cx="55" cy="81" rx="3.2" ry="2.6" fill="#5b3316"/>
  <ellipse cx="73" cy="81" rx="3.2" ry="2.6" fill="#5b3316"/>
  <path d="M57 89.5c2 2.4 4.3 3.6 7 3.6s5-1.2 7-3.6" stroke="#5b3316" stroke-width="2.6"
        stroke-linecap="round" fill="none"/>

  <!-- óculos redondos: o traço que identifica a Yara -->
  <circle cx="49" cy="60" r="9" fill="#0b2b4d" stroke="#c9a7f2" stroke-width="3"/>
  <circle cx="79" cy="60" r="9" fill="#0b2b4d" stroke="#c9a7f2" stroke-width="3"/>
  <path d="M58 60h12" stroke="#c9a7f2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="51" cy="58" r="3" fill="#fff"/>
  <circle cx="81" cy="58" r="3" fill="#fff"/>

  <!-- chapéu -->
  <path fill="url(#lgChapeu)"
        d="M24 44c0-4 8-7.5 18-9.2C46.5 24.5 54.5 18 64 18s17.5 6.5 22 16.8C96 36.5 104 40 104 44c0 4.6-17.9 8-40 8s-40-3.4-40-8Z"/>
  <path fill="#ffffff" opacity=".22"
        d="M45 27.5c4.6-6 11.3-9.5 19-9.5 3.2 0 6.2.6 9 1.7-9.6.6-19.2 3.4-28 7.8Z"/>
  <!-- florzinha do chapéu -->
  <circle cx="90" cy="33.5" r="5" fill="#fbbf24"/>
  <circle cx="90" cy="33.5" r="2" fill="#f97316"/>
</svg>
