<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  /* O atributo hidden tem que vencer as classes de display do Tailwind (grid, flex). */
  [hidden] { display: none !important; }
  .botao { border-radius: 9999px; transition: transform .12s ease, background-color .15s ease; }
  .botao:active:not(:disabled) { transform: scale(.98); }
  .botao:disabled { opacity: .45; cursor: not-allowed; }
  .opcao { border-radius: 1.25rem; transition: background-color .15s ease, transform .12s ease; text-align: left; }
  .opcao:active:not(:disabled) { transform: scale(.99); }
  /* !important: no celular o toque deixa o hover:bg-slate-200 grudado e ele venceria a cor. */
  .opcao.certa, .opcao.certa:hover { background: #d1fae5 !important; color: #065f46; }
  .opcao.errada, .opcao.errada:hover { background: #ffe4e6 !important; color: #9f1239; }
  .opcao.apagada { opacity: .55; }
  mark.repare { background: #fde7f3; color: #9d174d; border-radius: .4rem; padding: 0 .15em; font-weight: 800; }
  .palavra-lida { box-shadow: inset 0 -.18em 0 #f9a8d4; cursor: pointer; border-radius: .2rem; }
  .cartao-virar { transition: transform .35s ease; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .entrar { animation: entrar .3s ease both; }
  @keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,.45); } 50% { box-shadow: 0 0 0 12px rgba(236,72,153,0); } }
  .gravando { animation: pulso 1.2s ease infinite; }
</style>
</head>
