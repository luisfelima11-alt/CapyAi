<script>
Components.mount('top-nav-placeholder', Components.renderTopNav('classes'));
Components.mount('side-nav-placeholder', Components.renderSideNav('classes'));
Components.mount('mobile-nav-placeholder', Components.renderMobileNav('classes'));

// ── Trilha Intermediate: 20 lições × 4 minis = 80 nós ───────────────────────
const TRAIL_INT = [
  { id:401, emoji:'📝', title:'Past Simple: Regular Verbs' },
  { id:402, emoji:'⚡', title:'Past Simple: Irregular Verbs' },
  { id:403, emoji:'🔄', title:'Past Continuous Basics' },
  { id:404, emoji:'🔗', title:'While & When' },
  { id:405, emoji:'✅', title:'Present Perfect Basics' },
  { id:406, emoji:'⏳', title:'Ever, Never, Already' },
  { id:407, emoji:'⏪', title:'Past Perfect Basics' },
  { id:408, emoji:'⏱️', title:'Before & After' },
  { id:409, emoji:'🎭', title:'Telling Your Story' },
  { id:410, emoji:'🌟', title:'Life Events' },
  { id:411, emoji:'🔀', title:'Mixing Past Tenses' },
  { id:412, emoji:'📖', title:'Story Time Practice' },
  { id:413, emoji:'🌦️', title:'First Conditional' },
  { id:414, emoji:'💭', title:'Second Conditional' },
  { id:415, emoji:'🗣️', title:'Reported Speech Basics' },
  { id:416, emoji:'💬', title:'Say, Tell, Ask' },
  { id:417, emoji:'🏗️', title:'Passive Voice Basics' },
  { id:418, emoji:'📜', title:'Passive in the Past' },
  { id:419, emoji:'💼', title:'Work & Career Words' },
  { id:420, emoji:'🎯', title:'My Career Story' },
  { id:421, emoji:'🔤', title:'Articles: A or An?' },
  { id:422, emoji:'🎯', title:'The or No Article?' },
  { id:423, emoji:'📋', title:'Modal Verbs: Obligation & Advice' },
  { id:424, emoji:'🔍', title:'Modal Verbs: Possibility & Deduction' },
  { id:425, emoji:'🔗', title:'Relative Clauses: Who, Which, That' },
  { id:426, emoji:'📍', title:'Relative Clauses: Where, When, Whose' },
  { id:427, emoji:'🎬', title:'Gerunds: Verb + -ing' },
  { id:428, emoji:'➡️', title:'Infinitives & Verbs That Change Meaning' },
  { id:429, emoji:'🌟', title:'Talking About Your Dreams & Goals' },
  { id:430, emoji:'🏆', title:'Describing Your Ideal Life' },
  { id:431, emoji:'🔙', title:'Used to: Talking About Past Habits' },
  { id:432, emoji:'🔄', title:'Would, Be Used To & Get Used To' },
  { id:433, emoji:'🌠', title:'I Wish... (Present Wishes)' },
  { id:434, emoji:'😔', title:'Wishes, Regrets & Complaints' },
  { id:435, emoji:'🪞', title:'Question Tags: The Mirror Rule' },
  { id:436, emoji:'🎭', title:'Question Tags: Tricky Cases & Tone' },
  { id:437, emoji:'🔮', title:'Will vs Going To' },
  { id:438, emoji:'📅', title:'Future Plans, Perfect & Continuous' },
  { id:439, emoji:'🚀', title:'Reflecting on the Past, Looking to the Future' },
  { id:440, emoji:'🎓', title:'Intermediate Course Review: Grand Finale' }
];
const DAY_SUBS = ['Listen & Quiz','Game','Build & Speak','Chat with Yara'];

function miniDone(lessonId, miniNum) {
  if (window.Store && Store.state.completedLessons && Store.state.completedLessons.includes(lessonId)) return true;
  return window.Store ? Store.isMiniDone(lessonId, miniNum) : false;
}

function nextMini() {
  for (const l of TRAIL_INT) for (let m = 1; m <= 4; m++)
    if (!miniDone(l.id, m)) return { lesson: l, mini: m };
  return null;
}

function openMini(lessonId, miniNum) {
  window.location.href = `lessons.html?lesson=${lessonId}&mini=${miniNum}&guided=1`;
}

function render() {
  const cont = document.getElementById('int-trail');
  const next = nextMini();
  let done = 0, html = '';

  TRAIL_INT.forEach(l => {
    let rows = '';
    for (let m = 1; m <= 4; m++) {
      const isDone = miniDone(l.id, m);
      if (isDone) done++;
      const isCurrent = next && next.lesson.id === l.id && next.mini === m;
      rows += `
        <button onclick="openMini(${l.id},${m})"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl border-2 text-left transition-all active:scale-[.98]
            ${isDone ? 'bg-rose-50 border-rose-200' : isCurrent ? 'bg-white border-rose-400 node-current' : 'bg-white border-slate-100 hover:border-rose-200'}">
          <span class="w-9 h-9 rounded-full flex items-center justify-center font-black text-sm flex-shrink-0
            ${isDone ? 'bg-rose-600 text-white' : isCurrent ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 text-slate-400'}">
            ${isDone ? '✓' : 'D' + m}
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-black text-sm ${isDone ? 'text-rose-700' : 'text-navy'}">Day ${m} — ${DAY_SUBS[m-1]}</span>
          </span>
          ${isCurrent ? '<span class="text-[10px] font-black bg-rose-600 text-white px-2.5 py-1 rounded-full flex-shrink-0">COMEÇAR</span>' : ''}
        </button>`;
    }
    html += `
      <div class="card-in bg-white/70 border border-rose-100 rounded-3xl p-4">
        <div class="flex items-center gap-2 mb-3 px-1">
          <span class="text-2xl">${l.emoji}</span>
          <span class="font-black text-navy">${l.title}</span>
        </div>
        <div class="space-y-2">${rows}</div>
      </div>`;
  });

  cont.innerHTML = html;
  document.getElementById('int-progress-bar').style.width = Math.round(done / 80 * 100) + '%';
  document.getElementById('int-progress-label').textContent = done + ' / 80';

  if (next) {
    const c = document.getElementById('int-continue');
    c.classList.remove('hidden');
    document.getElementById('int-cont-emoji').textContent = next.lesson.emoji;
    document.getElementById('int-cont-title').textContent = next.lesson.title;
    document.getElementById('int-cont-sub').textContent = `Day ${next.mini} — ${DAY_SUBS[next.mini-1]}`;
    document.getElementById('int-cont-btn').onclick = () => openMini(next.lesson.id, next.mini);
    if (done === 0) document.querySelector('#int-continue p').textContent = 'Comece por aqui';
  } else {
    document.getElementById('int-done').classList.remove('hidden');
  }
}

render();
document.addEventListener('stateChanged', render);
</script>
