<body class="bg-gradient-to-br from-slate-50 via-white to-violet-50/30 min-h-screen">

<div id="top-nav-placeholder"></div>
<div id="side-nav-placeholder"></div>

<main class="md:pl-24 pb-32 md:pb-10">
  <div class="max-w-3xl mx-auto px-5 pt-6 md:pt-10">

    <div class="mb-7 fade-up">
      <h1 class="text-3xl md:text-4xl font-black text-navy">Minha Conta</h1>
      <p class="text-slate-500 mt-1.5">Perfil, plano e progresso.</p>
    </div>

    <!-- ── Profile card ───────────────────────────────────────────────── -->
    <div id="profile-card" class="bg-white rounded-3xl border-2 border-slate-100 p-6 md:p-7 mb-5 fade-up" style="animation-delay:.05s">
      <div class="flex items-center gap-4">
        <div id="profile-avatar" class="w-16 h-16 rounded-full bg-slate-200 flex items-center justify-center text-3xl flex-shrink-0">🐾</div>
        <div class="flex-1 min-w-0">
          <p id="profile-name" class="font-black text-lg text-navy truncate">Carregando...</p>
          <p id="profile-email" class="text-slate-500 text-sm truncate">—</p>
        </div>
      </div>
    </div>

    <!-- ── Plan card ──────────────────────────────────────────────────── -->
    <div id="plan-card" class="rounded-3xl p-6 md:p-7 mb-5 fade-up border-2" style="animation-delay:.1s">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-1">Plano atual</p>
          <p id="plan-name" class="font-black text-2xl">—</p>
          <p id="plan-status" class="text-sm font-bold mt-1">—</p>
        </div>
        <div id="plan-badge" class="text-4xl">⚙️</div>
      </div>

      <div id="plan-features" class="space-y-1.5 mb-5 text-sm text-slate-600"></div>

      <div id="plan-actions" class="flex flex-col gap-2"></div>
    </div>

    <!-- ── Stats card ─────────────────────────────────────────────────── -->
    <div class="bg-white rounded-3xl border-2 border-slate-100 p-6 md:p-7 mb-5 fade-up" style="animation-delay:.15s">
      <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3">Sua jornada</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="text-center">
          <p id="stat-level" class="font-black text-2xl text-navy">—</p>
          <p class="text-slate-400 text-xs font-bold mt-0.5">Level</p>
        </div>
        <div class="text-center">
          <p id="stat-xp" class="font-black text-2xl text-amber-500">—</p>
          <p class="text-slate-400 text-xs font-bold mt-0.5">XP total</p>
        </div>
        <div class="text-center">
          <p id="stat-streak" class="font-black text-2xl text-orange-500">—</p>
          <p class="text-slate-400 text-xs font-bold mt-0.5">Streak</p>
        </div>
        <div class="text-center">
          <p id="stat-lessons" class="font-black text-2xl text-violet-500">—</p>
          <p class="text-slate-400 text-xs font-bold mt-0.5">Aulas feitas</p>
        </div>
      </div>
    </div>

    <!-- ── Recent activity ────────────────────────────────────────────── -->
    <div class="bg-white rounded-3xl border-2 border-slate-100 p-6 md:p-7 mb-5 fade-up" style="animation-delay:.2s">
      <div class="flex items-center justify-between mb-3">
        <p class="text-slate-500 text-xs font-black uppercase tracking-widest">Atividade recente</p>
        <a href="progress.html" class="text-xs font-black text-violet-500 hover:text-violet-700">Ver tudo →</a>
      </div>
      <div id="activity-list" class="space-y-2">
        <p class="text-slate-400 text-sm italic">Carregando...</p>
      </div>
    </div>

    <!-- ── Account actions ────────────────────────────────────────────── -->
    <div class="bg-white rounded-3xl border-2 border-slate-100 p-6 md:p-7 mb-10 fade-up" style="animation-delay:.25s">
      <p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3">Conta</p>
      <div class="space-y-2">
        <a href="settings.html" class="flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50 transition-colors group">
          <span class="flex items-center gap-3 text-slate-700 font-bold text-sm">
            <span class="material-symbols-outlined text-slate-400">settings</span> Configurações
          </span>
          <span class="text-slate-400 group-hover:text-slate-600">→</span>
        </a>
        <a href="onboarding.html" class="flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50 transition-colors group">
          <span class="flex items-center gap-3 text-slate-700 font-bold text-sm">
            <span class="material-symbols-outlined text-slate-400">tune</span> Refazer Onboarding (interesses, nível)
          </span>
          <span class="text-slate-400 group-hover:text-slate-600">→</span>
        </a>
        <button data-capy-onclick="forceSyncPlan()" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-slate-50 transition-colors group">
          <span class="flex items-center gap-3 text-slate-700 font-bold text-sm">
            <span class="material-symbols-outlined text-slate-400">sync</span> Atualizar status da assinatura
          </span>
          <span id="sync-icon" class="text-slate-400 group-hover:text-slate-600">↻</span>
        </button>
        <button id="logout-btn" class="w-full flex items-center justify-between p-3.5 rounded-xl hover:bg-red-50 transition-colors group">
          <span class="flex items-center gap-3 text-red-500 font-bold text-sm">
            <span class="material-symbols-outlined">logout</span> Sair
          </span>
          <span class="text-red-400">→</span>
        </button>
      </div>
    </div>

  </div>
</main>

<div id="mobile-nav-placeholder"></div>
<div id="footer-placeholder"></div>

  <script src="assets/js/secure-inline-events.js"></script>

</html>
