<script src="store.js?v=xpfix"></script><script src="components.js?v=sec1"></script><script>Components.mount('top-nav-placeholder',Components.renderTopNav('games'));Components.mount('side-nav-placeholder',Components.renderSideNav('games'));Components.mount('mobile-nav-placeholder',Components.renderMobileNav('games'));const ITEMS=[['window','janela'],['teacher','professor'],['journey','viagem'],['cloud','nuvem'],['market','mercado'],['answer','resposta'],['morning','manhã'],['bridge','ponte'],['ticket','passagem'],['flower','flor'],['kitchen','cozinha'],['help','ajuda'],['street','rua'],['water','água']];let order=[],step=0,points=0,seconds=6,clock,locked=false;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function render(){if(step>=10)return finish();locked=false;seconds=6;const correct=order[step];round.textContent=`${step+1} / 10`;score.textContent=`${points} XP`;word.textContent=correct[0];const opts=shuffle([correct,...shuffle(ITEMS.filter(x=>x!==correct)).slice(0,3)]);options.innerHTML=opts.map(x=>`<button class="option rounded-2xl bg-white/10 hover:bg-orange-500 border border-white/10 px-4 py-4 font-black" data-value="${x[1]}">${x[1]}</button>`).join('');options.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b,correct));feedback.textContent='';clearInterval(clock);tick();clock=setInterval(tick,100)}function tick(){seconds-=.1;timer.style.width=`${Math.max(0,seconds/6*100)}%`;if(seconds<=0){clearInterval(clock);choose(null,order[step])}}function choose(btn,correct){if(locked)return;locked=true;clearInterval(clock);const ok=btn&&btn.dataset.value===correct[1];if(ok){const earned=Math.max(4,Math.ceil(seconds));points+=earned;btn.classList.add('bg-emerald-500');feedback.textContent=`Rápido! +${earned} XP`;feedback.className='text-center font-black min-h-6 mt-5 text-emerald-300'}else{if(btn)btn.classList.add('bg-red-500');feedback.textContent=`A resposta era “${correct[1]}”.`;feedback.className='text-center font-black min-h-6 mt-5 text-red-300'}setTimeout(()=>{step++;render()},850)}function finish(){clearInterval(clock);if(window.Store){Store.addXP(points);Store.completeActivity('games');Store.activateStreak()}document.querySelector('section').innerHTML=`<div class="text-center py-8"><div class="text-7xl">⚡</div><h2 class="text-4xl font-black mt-4">Rodada concluída!</h2><p class="text-orange-300 text-2xl font-black mt-2">+${points} XP</p><div class="flex justify-center gap-3 mt-7"><button onclick="location.reload()" class="bg-white/10 px-6 py-3 rounded-full font-black">Jogar novamente</button><a href="5_Game_Pavilion_Forest_Edition.html" class="bg-orange-500 px-6 py-3 rounded-full font-black">Mais games</a></div></div>`}order=shuffle(ITEMS);render();</script><script src="celebration.js?v=cel3"></script>
