<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Yara's Boutique — Capy Yara Adventures</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;700&family=Lexend:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "navy": "#001f3f",
                        "navy-light": "#002d5c",
                        "pink-brand": "#ec4899",
                        "green-brand": "#10b981",
                        "purple-brand": "#8b5cf6",
                        "surface": "#ffffff",
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; align-items:center; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Item animation for hovering */
        .shop-item:hover .item-emoji {
            transform: scale(1.2) rotate(-5deg);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .item-emoji { transition: all 0.3s ease; }
        
        /* Fireworks animation overlay */
        @keyframes firework {
            0% { transform: translate(var(--x), var(--initialY)); width: var(--initialSize); opacity: 1; }
            50% { width: 0.5vmin; opacity: 1; }
            100% { width: var(--finalSize); opacity: 0; }
        }
        .firework,
        .firework::before,
        .firework::after
        {
            --initialSize: 0.5vmin;
            --finalSize: 45vmin;
            --particleSize: 0.2vmin;
            --color1: yellow;
            --color2: khaki;
            --color3: white;
            --color4: lime;
            --color5: gold;
            --color6: mediumseagreen;
            --y: -30vmin;
            --x: -50%;
            --initialY: 60vmin;
            content: "";
            animation: firework 2s infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, var(--y));
            width: var(--initialSize);
            aspect-ratio: 1;
            background: 
                radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 50% 0%,
                radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 100% 50%,
                radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 50% 100%,
                radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 0% 50%,
                /* bottom right */
                radial-gradient(circle, var(--color5) var(--particleSize), #0000 0) 80% 90%,
                radial-gradient(circle, var(--color6) var(--particleSize), #0000 0) 95% 90%,
                radial-gradient(circle, var(--color1) var(--particleSize), #0000 0) 90% 70%,
                /* bottom left */
                radial-gradient(circle, var(--color2) var(--particleSize), #0000 0) 10% 90%,
                radial-gradient(circle, var(--color3) var(--particleSize), #0000 0) 5% 90%,
                radial-gradient(circle, var(--color4) var(--particleSize), #0000 0) 10% 70%;
            background-size: var(--initialSize) var(--initialSize);
            background-repeat: no-repeat;
            z-index: 100;
        }
        .firework::before { --x: -50%; --y: -50%; --initialY: -50%; transform: translate(-50%, -50%) rotate(40deg) scale(1.3) rotateY(40deg); }
        .firework::after { --x: -50%; --y: -50%; --initialY: -50%; transform: translate(-50%, -50%) rotate(170deg) scale(1.15) rotateY(-30deg); }
        
    </style>
</head>
<body class="bg-navy font-body text-slate-100 selection:bg-purple-brand selection:text-white min-h-screen relative overflow-x-hidden">

<!-- Component Placeholders -->
<div id="top-nav-placeholder"></div>
<div id="side-nav-placeholder"></div>

<!-- Confetti Canvas -->
<div id="confetti" class="fixed inset-0 pointer-events-none hidden z-50">
    <div class="firework" style="left: 25%;"></div>
    <div class="firework" style="left: 75%; animation-delay: 0.25s"></div>
    <div class="firework" style="left: 50%; animation-delay: 0.4s"></div>
</div>

<main class="relative min-h-screen pt-32 pb-12 px-4 md:pl-32 md:pr-12 max-w-screen-2xl mx-auto">
    <!-- Hero Header -->
    <header class="flex flex-col md:flex-row items-center gap-8 md:gap-16 mb-16 relative">
        <div class="flex-1 text-center md:text-left">
            <h1 class="font-headline text-5xl md:text-7xl font-black text-white mb-6 leading-tight tracking-tight">
                Yara's <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">Boutique</span>
            </h1>
            <p class="font-body text-xl text-slate-300 max-w-xl mb-8 leading-relaxed">
                Spend your hard-earned <strong class="text-pink-400">Star Berries 🍓</strong> to unlock cool outfits and accessories for your friend Yara!
            </p>
            <div class="flex items-center justify-center md:justify-start gap-4 inline-flex bg-white/10 p-2 rounded-full border border-white/20">
                <div class="bg-pink-500/20 text-pink-300 w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner shadow-pink-500/30">
                    🍓
                </div>
                <div class="pr-6">
                    <p class="font-label text-xs uppercase tracking-widest text-slate-400 font-bold mb-0.5">Your Balance</p>
                    <p class="font-headline text-2xl font-black text-white" id="shop-balance">0</p>
                </div>
            </div>
        </div>
        
        <!-- Live Preview Yara Avatar -->
        <div class="relative flex-shrink-0 animate-[bounce_4s_infinite]">
            <div class="absolute -inset-4 bg-gradient-to-tr from-purple-500 to-pink-500 opacity-20 blur-3xl rounded-full"></div>
            <div class="bg-navy-light rounded-full p-4 relative shadow-2xl border border-white/10 z-10 w-64 h-64 flex items-center justify-center overflow-hidden">
                <img src="yara.png" alt="Yara" class="w-56 h-56 object-contain mix-blend-multiply relative z-20"/>
                
                <!-- Dynamic Overlays -->
                <div id="overlay-hat" class="absolute top-[10%] left-1/2 -translate-x-1/2 text-6xl z-30 transform hidden">🎩</div>
                <div id="overlay-glasses" class="absolute top-[35%] left-1/2 -translate-x-1/2 text-5xl z-30 transform hidden">🕶️</div>
                <div id="overlay-neck" class="absolute top-[60%] left-1/2 -translate-x-1/2 text-5xl z-30 transform hidden">🧣</div>
                <div id="overlay-companion" class="absolute bottom-[20%] right-[10%] text-4xl z-30 transform hidden -scale-x-100">🦋</div>
            </div>
            
            <div class="absolute -bottom-4 right-0 glass-panel px-4 py-2 rounded-full z-40 transform rotate-6 animate-pulse">
                <p class="font-label font-bold text-sm text-pink-300">Look at me! ✨</p>
            </div>
        </div>
    </header>

    <!-- Shop Tabs -->
    <div class="flex flex-wrap gap-4 mb-10 border-b border-white/10 pb-4">
        <button class="font-label font-bold text-white border-b-2 border-pink-500 pb-2 px-4 transition-colors">Hats</button>
        <button class="font-label font-bold text-slate-400 hover:text-white pb-2 px-4 transition-colors">Glasses</button>
        <button class="font-label font-bold text-slate-400 hover:text-white pb-2 px-4 transition-colors">Accessories</button>
    </div>

    <!-- Shop Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="shop-catalog">
        <!-- Injected via JS -->
    </div>
</main>

<div id="footer-placeholder"></div>
<div id="mobile-nav-placeholder"></div>

<!-- Success Modal -->
<div id="purchase-modal" class="fixed inset-0 bg-navy/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-surface-container border-2 border-pink-500/30 bg-gradient-to-b from-navy-light to-navy p-10 rounded-[3rem] w-full max-w-md text-center transform scale-95 shadow-[0_0_100px_rgba(236,72,153,0.3)]">
        <div class="text-[8rem] mb-6 leading-none animate-bounce" id="modal-emoji">🎩</div>
        <h3 class="font-headline text-3xl font-black text-white mb-2">New Item Unlocked!</h3>
        <p class="font-body text-slate-300 mb-8" id="modal-desc">You look amazing with your new Explorer Hat!</p>
        <button onclick="closeModal()" class="w-full bg-pink-500 hover:bg-pink-400 text-white font-label font-bold py-4 rounded-full shadow-lg active:scale-95 transition-transform text-lg">
            Awesome! ✨
        </button>
    </div>
</div>

<script src="store.js?v=c52d7db"></script>
<script src="components.js?v=c52d7db"></script>
<script>
    // Initialize components
    Components.mount('top-nav-placeholder', Components.renderTopNav('shop'));
    Components.mount('side-nav-placeholder', Components.renderSideNav('shop'));
    Components.mount('mobile-nav-placeholder', Components.renderMobileNav('shop'));
    Components.mount('footer-placeholder', Components.renderFooter());

    // ── Shop Catalog Data ──────────────────────────────────────────────────
    const CATALOG = [
        { id: 'hat_explorer', type: 'hat',     emoji: '🤠', name: 'Explorer Hat',     desc: 'Keep the sun out while exploring.', price: 50 },
        { id: 'hat_magic',    type: 'hat',     emoji: '🧙‍♀️', name: 'Magic Wizard Hat', desc: 'For spelling wizards.',             price: 150 },
        { id: 'hat_crown',    type: 'hat',     emoji: '👑', name: 'Royal Crown',      desc: 'The queen of the forest!',          price: 300 },
        { id: 'hat_party',    type: 'hat',     emoji: '🥳', name: 'Party Hat',        desc: 'Every day is a celebration.',       price: 25 },
        
        { id: 'glasses_cool', type: 'glasses', emoji: '🕶️', name: 'Cool Shades',      desc: 'Too cool for school.',              price: 75 },
        { id: 'glasses_nerd', type: 'glasses', emoji: '👓', name: 'Smart Glasses',    desc: 'Perfect for reading big words.',    price: 60 },
        
        { id: 'neck_scarf',   type: 'neck',    emoji: '🧣', name: 'Cozy Scarf',       desc: 'Winter fashion is here.',           price: 90 },
        { id: 'neck_medal',   type: 'neck',    emoji: '🏅', name: 'Gold Medal',       desc: 'You earned it champion!',           price: 200 },
        
        { id: 'comp_butterfly',type: 'companion',emoji: '🦋', name: 'Pet Butterfly', desc: 'A little friend to fly with you.', price: 120 },
        { id: 'comp_bird',     type: 'companion',emoji: '🐦', name: 'Singing Bird',  desc: 'Sings english songs all day long.',price: 250 },
    ];

    function renderShop() {
        const balance = Store.state.starBerries || 0;
        document.getElementById('shop-balance').textContent = balance;
        
        const purchased = Store.state.purchasedItems || [];
        const catalogEl = document.getElementById('shop-catalog');
        
        catalogEl.innerHTML = CATALOG.map(item => {
            const isOwned = purchased.includes(item.id);
            const canAfford = balance >= item.price;
            
            let btnHTML = '';
            if (isOwned) {
                // If owned, we can "equip" it (for now just marked as owned)
                // We'll treat clicking as equipping
                btnHTML = `<button onclick="equipItem('${item.id}')" class="w-full py-3 bg-white/10 hover:bg-white/20 text-white border border-white/20 font-label font-bold rounded-xl transition-colors mt-auto">Equip</button>`;
            } else {
                if (canAfford) {
                    btnHTML = `<button onclick="buyItem('${item.id}')" class="w-full py-3 bg-pink-500 hover:bg-pink-400 text-white font-label font-bold rounded-xl shadow-lg hover:shadow-pink-500/20 active:scale-95 transition-all mt-auto flex justify-center items-center gap-2">
                        <span>Buy</span>
                        <div class="bg-black/20 px-2 py-0.5 rounded-full text-xs flex items-center gap-1"><span class="opacity-80">🍓</span> ${item.price}</div>
                    </button>`;
                } else {
                    btnHTML = `<button disabled class="w-full py-3 bg-slate-800 text-slate-500 font-label font-bold rounded-xl cursor-not-allowed mt-auto flex justify-center items-center gap-2 border border-slate-700">
                        <span>Lacking 🍓</span>
                        <div class="px-2 py-0.5 rounded-full text-xs flex items-center gap-1">${item.price}</div>
                    </button>`;
                }
            }

            return `
                <article class="shop-item glass-panel rounded-3xl p-6 flex flex-col items-center text-center transition-all duration-300 hover:shadow-2xl hover:shadow-purple-500/10 hover:-translate-y-2 border ${isOwned ? 'border-purple-500/30 bg-purple-900/10' : 'border-white/5'}">
                    ${isOwned ? '<div class="absolute top-4 right-4 bg-emerald-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded-full px-2 py-0.5 tracking-wider">Owned \u2714</div>' : ''}
                    <div class="w-24 h-24 mb-6 rounded-full bg-gradient-to-br from-navy to-slate-900 shadow-inner flex items-center justify-center text-5xl item-emoji border-4 border-slate-800">
                        ${item.emoji}
                    </div>
                    <h3 class="font-headline font-extrabold text-white text-lg mb-2">${item.name}</h3>
                    <p class="font-body text-slate-400 text-sm mb-6 leading-relaxed">${item.desc}</p>
                    ${btnHTML}
                </article>
            `;
        }).join('');

        // Also update the navbar if the store changes
        Components.refreshStats();
        
        // Auto-equip the latest owned items based on type
        equipLatestItems(purchased);
    }

    function buyItem(id) {
        const item = CATALOG.find(i => i.id === id);
        if (!item) return;
        
        if (Store.spendBerries(item.price)) {
            Store.unlockItem(item.id);
            renderShop();
            showSuccessModal(item);
            equipItem(item.id);
            
            // Fire event for other components if needed
            document.dispatchEvent(new Event('stateChanged'));
        }
    }
    
    // Very simple equipment system: equipping sets an overlay emoji
    let equipped = { hat: null, glasses: null, neck: null, companion: null };
    
    function equipLatestItems(purchased) {
        // Find the last purchased item of each type to "auto-equip"
        // This is a proxy for a real inventory system to keep the mock fast
        [...purchased].reverse().forEach(id => {
            const item = CATALOG.find(i => i.id === id);
            if (item && !equipped[item.type]) {
                equipItem(item.id, false);
            }
        });
    }

    function equipItem(id, playAnim=true) {
        const item = CATALOG.find(i => i.id === id);
        if (!item) return;
        
        equipped[item.type] = item;
        
        const overlay = document.getElementById(`overlay-${item.type}`);
        if(overlay) {
            overlay.textContent = item.emoji;
            overlay.classList.remove('hidden');
            
            if(playAnim) {
                overlay.classList.add('animate-bounce');
                setTimeout(() => overlay.classList.remove('animate-bounce'), 1000);
            }
        }
    }

    function showSuccessModal(item) {
        document.getElementById('modal-emoji').textContent = item.emoji;
        document.getElementById('modal-desc').textContent = `You look amazing with your new ${item.name}! 💖`;
        
        const modal = document.getElementById('purchase-modal');
        modal.classList.remove('hidden');
        modal.offsetHeight; // reflow
        modal.classList.remove('opacity-0');
        
        document.getElementById('confetti').classList.remove('hidden');
    }

    function closeModal() {
        const modal = document.getElementById('purchase-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            document.getElementById('confetti').classList.add('hidden');
        }, 300);
    }

    // Init
    document.addEventListener('DOMContentLoaded', renderShop);
    // Listen for state changes (e.g. from nav)
    document.addEventListener('stateChanged', renderShop);

</script>
</body>
</html>
